[requirement.SR-088]
title = "New and changed files are picked up on later runs"
sn_refs = ["SN-001"]
boundary_refs = ["B-01", "B-13"]
requirement = "When a later run finds a file that is new, or whose size or modification time differs from the previous run's record, the system shall record the file's current content in the latest state."
rationale = "Without it the backup holds only the first run's tree. Re-reading every file on every run lost as the default: the owner chooses that trade-off separately (SN-007)."
acceptance_criteria = "After a file is added and another edited between two runs, the second run's latest state restores the added file and the edited file at its new content."
