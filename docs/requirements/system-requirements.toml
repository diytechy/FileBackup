[requirement.SR-106]
title = "Reading and restoring still work while a backup is held"
sn_refs = ["SN-039"]
boundary_refs = ["B-04", "B-08", "B-15", "B-16"]
requirement = """While a changing operation holds a backup, the system shall still run a check, the saved-state report or a restore started against it."""
rationale = """Locking readers out turns every long backup into an outage for restores and checks. A removal deletes the state it removes, so completion cannot be promised to a reader of that one state; promising it would need readers to hold removals back, which a restore cannot do, since it leaves nothing in the backup that a removal could see. A kit refresh replaces a state's kit a file at a time, which no single step makes whole, so a restore meeting it part-way waits a bounded time rather than run beside files of another revision, and a refresh outlasting the wait is reported as retry later."""
acceptance_criteria = """A check, the saved-state report and a restore started while a backup, a removal, a repair or a kit refresh is running each complete with their normal outcome against every complete state the running operation does not remove. A restore of the saved state that a running removal deletes either completes byte-exact or ends with retry later (value 4, SR-043) naming the removal; every file it has written is byte-exact, and no file is restored wrongly. A restore that meets a state's restore kit part-way through a running kit refresh waits a bounded time and then completes with its normal outcome, or ends with retry later (value 4) naming the refresh, writing nothing. A check or the report that meets a saved state removed while it reads leaves that state out as no longer present and reports no finding for it."""
permutations = """reader=set{check,report,restore}; writer=set{backup,removal,repair,kit-refresh}; state=set{kept,being-removed}; kit=set{settled,mid-refresh}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The reader's completion is the outcome."""
delivered_with = ["SR-085"]
form = "interface"

[requirement.SR-107]
title = "A dead holder's claim on a backup is released"
sn_refs = ["SN-039"]
boundary_refs = ["B-04"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """When the operation holding a backup ends, or its process dies, the system shall let the next changing operation on that backup proceed."""
rationale = """A claim nothing reclaims once its holder is gone stops all future backups. Expiring claims by age lost: it can let a second writer in beside a live slow one. Releasing the claim is not the same as cleaning up after the holder: a dead backup's unfinished work is recovered by the next run (SR-075), while a dead removal's is completed by re-running that removal (SR-017)."""
acceptance_criteria = """After a holding operation completes, fails, is refused partway, and after its process is killed, the claim no longer refuses the next changing operation. Where the dead holder was a backup, a new backup on the same store proceeds without manual clean-up, subject to SR-075; where it was a removal, the next backup is refused as a precondition not met (value 2, SR-043) and its message names the remedy, re-running the removal (SR-017)."""
permutations = """end=set{normal,failed,refused,killed,crashed}; holder=set{backup,removal}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-02"]
