status = "Drafted"
coincident = """The refusal and the untouched locations are the outcome."""
delivered_with = ["SR-138"]
form = "interface"

[requirement.SR-064]
title = "A check and a full restore fit their time budgets at scale"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-08", "B-15"]
hat_refs = ["PERFORMANCE"]
requirement = """Where the library is within the declared scale and the host meets the declared reference, the system shall complete a whole-backup check and a full restore each within its declared time budget."""
rationale = """Off the single-crossing rule on purpose: a time budget is a property of the whole operation, from launch to outcome. Without it a check or a restore quietly stops fitting its window as the library grows. How the internal work scales under this budget is a design matter."""
acceptance_criteria = """For a library of up to 2 TiB in up to one million files, on a host with four cores, 8 GiB of available memory and local storage sustaining 200 MiB per second with no competing load, a whole-backup check and a full restore each complete within eight hours."""
