sn_refs = ["SN-039"]
boundary_refs = ["B-04"]
hat_refs = ["FILESYSTEM-SEMANTICS", "INTEGRITY-RECOVERABILITY"]
requirement = "When a holding operation ends or its process dies within the supported host/store environment, the system shall allow the next mutation to acquire ownership without manually deleting a stale ownership claim."
rationale = "A dead owner must not block future runs, while a slow or suspended live owner must not be displaced by age. Cleanup admission after ownership is a separate question from claim release."
acceptance_criteria = "Complete, fail and kill each holding action; a later action can acquire ownership and then continue or report its specific surviving-state blocker. Suspending a live holder does not release ownership. No arbitrary stale-time wait or manual lock deletion is needed after process death."
