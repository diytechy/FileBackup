[requirement.SR-064]
title = "A check and a full restore fit their time budgets at scale"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-08", "B-15"]
hat_refs = ["PERFORMANCE"]
requirement = "Where the library is within the declared scale and the host meets the declared reference, the system shall complete a whole-backup check and a full restore each within its declared time budget."
rationale = "Off the single-crossing rule on purpose: a time budget is a property of the whole operation, from launch to outcome. Without it a check or a restore quietly stops fitting its window as the library grows. The reference host names local solid-state storage because sequential throughput alone does not bound the per-file and folder-metadata cost of a million small files, and the envelope names the stored history a whole-backup check inspects. How the internal work scales under this budget is a design matter."
