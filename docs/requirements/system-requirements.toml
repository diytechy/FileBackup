[requirement.SR-149]
title = "A change-detection state location inside a source or inside the store is refused"
sn_refs = ["SN-037", "SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
requirement = """If the location configured for a source's change-detection state lies inside a source, or equals or lies inside a backup or saved-state location, then the system shall refuse the run before anything is written, naming the setting."""
rationale = """A location inside a source would be written into the source beyond the one record SN-037 allows, and walked as source data; one inside a backup or saved-state location would mix working state into the store the system manages. SN-027 asks that such a wrong setting stop the run rather than be guessed at. The allowed relation is stated once, here: outside every source, and neither equal to nor inside any backup or saved-state location."""
acceptance_criteria = """With the configured state location inside a source, equal to and inside a backup location, and equal to and inside a saved-state location in turn, the run is refused with the configuration-refused outcome (value 2), nothing is created or changed in any location, and the message names the state-location setting; a location outside every source, backup and saved-state location is accepted (SR-148)."""
permutations = """relation=set{inside-source,equal-backup,inside-backup,equal-saved-states,inside-saved-states,outside}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched locations are the outcome."""
delivered_with = ["SR-148", "SR-138", "SR-063"]
form = "interface"

[requirement.SR-150]
title = "A link inside its own source, or back to its own ancestor, is recorded, not followed"
sn_refs = ["SN-001", "SN-036"]
boundary_refs = ["B-01", "B-02"]
requirement = "When a source holds a link or junction to a folder inside that same source, or to a folder that is one of the link's own ancestors in the walk, the system shall record the link and where it leads without following it."
rationale = "SN-001's acceptance states it: links that lead inside the same source or back to one of their own ancestors are recorded and rebuilt at restore rather than followed. A link back to one of its own ancestors makes a walk that follows it never end, and a link to a folder already inside the source would capture that content a second time under another path for no gain, since the content itself is captured at its real place. Recording the link instead keeps the restored tree the way it was (SN-036): the link comes back as a link. Following inside links and relying on de-duplication lost: it cannot end on a cycle."
acceptance_criteria = "With a link and a junction inside a source each leading to another folder of that source, and a link inside a followed outside folder leading to one of its own ancestors, the run finishes, captures the content behind each only at its real place, records each link with where it leads, and their presence does not change the outcome from complete."
permutations = "link=set{folder-link,junction}; leads_to=set{inside-source,ancestor-in-source,ancestor-in-followed-folder}; @pairwise"
priority = "M"
verification = "Test"
status = "Drafted"
coincident = "The record of each link, and the captured tree, are the outcome."
delivered_with = ["SR-137", "SR-152"]
form = "interface"

[requirement.SR-151]
title = "A link into the system's own locations is recorded, not followed"
sn_refs = ["SN-001"]
boundary_refs = ["B-01", "B-02"]
requirement = "When a source holds a link or junction to a folder inside the backup, its saved states, the change-detection state, the logs or the listing location, the system shall record the link and where it leads without following it."
rationale = "SN-001's acceptance states it: links that lead into the backup's own locations are recorded and rebuilt at restore rather than followed. Following a link into the backup backs the backup up into itself, and the store grows by its own size every run until the volume fills; following one into the listing location captures the generated views as source content. The link is the owner's, so it is recorded and comes back at restore like any other (SR-152), pointing where it pointed; only what lies behind it is the system's own, which SN-001 already leaves out."
acceptance_criteria = "With a link inside a source leading to the backup root, one to a saved state's folder, one to the change-detection state location, one to the log location and one to the listing location, the run captures nothing from behind them, the store does not grow by their content, each link is recorded with where it leads, and their presence does not change the outcome from complete."
permutations = "leads_to=set{backup-root,saved-state,state-location,log-location,listing-location}; @full"
priority = "M"
verification = "Test"
status = "Drafted"
coincident = "The unchanged store and the record of each link are the outcome."
delivered_with = ["SR-074", "SR-152"]
form = "interface"

[requirement.SR-152]
title = "A recorded link is rebuilt at restore"
sn_refs = ["SN-036", "SN-001"]
boundary_refs = ["B-16"]
hat_refs = ["CROSS-PLATFORM"]
requirement = "When a restored state records a link, the restore kit shall recreate it at its place under the target after every file is written, pointing at the matching path under the target where it led to a folder captured in the state, and at the path it led to otherwise."
rationale = "A tree whose internal links come back missing or as empty folders is not the tree the owner had (SN-036); an inside link re-pointed under the target works in the restored tree as it did in the source. A link into the system's own locations is rebuilt to its original path because it is the owner's link, even where it leads nowhere on the restore machine. Links are made last so no file is ever written through one (SR-121). Derived through CROSS-PLATFORM: a target that cannot hold a link of that kind must not turn an intact restore into a failure."
acceptance_criteria = "A state recording a link inside its source, a junction inside its source, a link inside a followed outside folder back to one of its ancestors, and a link into the backup restores each as a link at its place: the first three lead to the matching folders under the target and open their restored content, the last leads to its original path; no file is written through any of them. On a target that cannot create a link of that kind, or without the right to, the restore names each link it could not recreate and the outcome stays complete (value 0)."
permutations = "link=set{inside-source,junction-inside-source,ancestor-in-followed-folder,own-location}; target_os=set{windows,linux,macos}; can_create_links=bool; @pairwise"
priority = "S"
verification = "Test"
status = "Drafted"
coincident = "The rebuilt links in the restored tree are the outcome."
delivered_with = ["SR-150", "SR-151", "SR-121"]
form = "interface"
