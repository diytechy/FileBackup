[requirement.SR-093]
title = "Backing up never alters the source"
sn_refs = ["SN-037"]
boundary_refs = ["B-01", "B-24"]
requirement = """The system shall not write, move, delete or change the modification time or attributes of any file or folder in a source, apart from the change-detection state it keeps at the source root where that is where the state is kept, and the change to the source-root folder's own modification time that creating or updating that state causes."""
rationale = """The source is what is being protected and the reference a restore is compared against; touching it, even a time stamp, can damage it. The one exception is the Owner's: by default the change-detection state is a plain record at the source root, readable by the owner and the tool (SR-139), written across the one authorised crossing into the source (B-24). On ordinary filesystems creating or updating a file changes its folder's modification time, so the exception covers that incidental change to the source-root folder and nothing else. Access times a filesystem updates when a file is read are not a change the system makes."""
acceptance_criteria = """With nothing else changing the source during the run (DA-21), after any run every file and folder in the source is byte-identical, with unchanged modification times and attributes, and no file or folder has been added or removed, apart from the change-detection state where it is kept at the source root and the source-root folder's own modification time; every other folder's modification time, the root folder's attributes and every file outside that state are unchanged. With that state kept elsewhere, the source is untouched entirely, the root folder's modification time included. Access times are not compared."""
permutations = """action=set{backup,report,removal,check,listing}; outcome=set{success,failure,refusal}; state_location=set{source-root,elsewhere}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-21"]
delivered_with = ["SR-139"]
form = "cross-cutting"

[requirement.SR-094]
