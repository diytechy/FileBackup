delivered_with = ["SR-106", "SR-107", "SR-086", "SR-144"]
form = "assumption"

[requirement.SR-086]
title = "A backup whose exclusive use cannot be established is treated as held, and the change is refused"
sn_refs = ["SN-039", "SN-013"]
boundary_refs = ["B-04", "B-08"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = """If the system cannot establish exclusive use of a backup for any reason, then the system shall treat the backup as held, for safety, and refuse the changing operation without changing anything in it."""
rationale = """Derived through FILESYSTEM-SEMANTICS: the needs say a second changing operation is refused (SN-039) and that an interrupted run is never built on (SN-013), but not what to conclude when the claim of exclusive use itself fails for a reason other than another holder (access denied, an unusable claim location, an I/O error, a brief outside access), which differs between filesystems and network shares. The two errors are not symmetric: taking a failure as free can let two writers destroy content, taking it as held costs one run. Which value the refusal reports follows SR-043: a cause that clears by itself (contention, a passing I/O error) is retried; one a person must fix (access denied, an unusable location) is reported for attention. Obtaining exclusive use is never taken as proof that an earlier interrupted run is dead; that judgement stays with SR-075 and SR-017."""
acceptance_criteria = """With the claim of exclusive use failing through contention, access denial, an unusable claim location and an I/O error in turn, a backup, a removal, a repair and a kit refresh are each refused and the store is byte-identical, the refusal reported on the console and in the launch's own record outside the backup: contention and an I/O error report busy, value 4, and access denial or an unusable claim location reports a precondition not met, value 2, naming the claim location (SR-043); after the cause clears, the same operation proceeds. With exclusive use obtained but an earlier run's unfinished work showing a live or unproven owner, or holding content, the run is still refused as SR-017 requires."""
permutations = """claim_failure=set{contention,access-denied,unusable-location,io-error}; operation=set{backup,removal,repair,kit-refresh}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched store are the outcome."""
delivered_with = ["SR-085"]
form = "interface"

