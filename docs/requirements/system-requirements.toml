[requirement.SR-129]
title = "A configuration carrying readable credentials is refused"
sn_refs = ["SN-049"]
boundary_refs = ["B-05", "B-07", "B-08"]
hat_refs = ["SECURITY"]
requirement = """If a configuration carries notification credentials in readable form, then the system shall refuse it before any backup data is touched."""
rationale = """Accepting such a configuration keeps the secret readable wherever the configuration travels; refusing is the only way to stop it being used. The rule holds for every configuration form, since a form exempt from it is where the secret would go. What is refused is a readable credential, not a carrier format: the JSON form has no protected representation of a credential, only text that anyone who can read the file can read, so any credential written in it is readable. The native-Windows form can carry the mail login protected by the host's credential facility, readable only by the owner's account on that host (DA-20), so a credential carried that way is not readable and is accepted."""
acceptance_criteria = """A configuration holding a readable password for notification, in the JSON form and in the native-Windows form alike, is refused with the configuration-refused outcome (value 2) and nothing is created or changed; because the JSON form has no protected representation, a JSON configuration carrying the login in any form carries it readable and is refused the same way; a native-Windows configuration carrying the login protected by the host's credential facility is accepted."""
permutations = """form=set{json,native-windows}; credential=set{readable,protected,absent}; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-20"]
