[requirement.SR-121]
title = "A restore never writes outside its target"
sn_refs = ["SN-042"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["SECURITY"]
requirement = """If a file entry in the record of a state being restored would land outside the restore target, by its path or through a link, or a recorded link would be placed outside the target or, where it led to a folder captured in the state, would be re-pointed to outside the target, in a restore that has passed admission (SR-145), then the restore kit shall leave it unwritten, name it, and report the damaged-record outcome."""
rationale = """A damaged or crafted record can name a path that climbs out of the target, or redirect through a link, and overwrite files the restorer never meant to touch. Joining path text blindly lost to checking where the write really lands. A recorded link into the system's own locations is the owner's and is recreated as a link pointing there (SR-152); its own place is checked like a file's, its target is not, and it is made after every file, so nothing is written through it."""
acceptance_criteria = """A record holding entries with parent-climbing, absolute and drive-qualified paths, and entries redirected outside the target through a link, restores every other entry, writes nothing outside the target, names and counts each such entry as not restored, and returns exit code 3. A state recording a link whose own place climbs out of the target, and an inside link whose re-pointed target climbs out of the target, restores every other entry, creates neither link, names each, and returns exit code 3; a link into the system's own locations, rebuilt pointing to its original path outside the target (SR-152), is not refused. A record holding such an entry whose completeness evidence does not match is refused before anything is written, with exit code 3 (SR-039, SR-145)."""
permutations = """path_form=set{parent-climb,absolute,drive-qualified,via-link}; entry=set{file,link}; restorer=set{windows,linux,macos}; target_exists=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Nothing written outside the target is the outcome."""
delivered_with = ["SR-009", "SR-141", "SR-145"]
form = "interface"

