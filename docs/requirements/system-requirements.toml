[requirement.SR-089]
title = "A file or folder not captured is named and fails the run"
sn_refs = ["SN-001", "SN-044", "SN-052"]
boundary_refs = ["B-06", "B-08"]
requirement = """If a run cannot capture a file or a folder of a source, then the system shall name it with the cause in the run's record and report the run as failed."""
rationale = """A file skipped without a failure status is the silent loss SN-001 forbids. Skipping unreadable folders quietly lost: it cannot tell a system folder from an owner folder whose permissions changed."""
acceptance_criteria = """With one file and one folder made unreadable, the run's record names both with their causes, neither is counted as captured or as removed, and the run reports the part-failed outcome; every readable file is still captured."""
permutations = """unreadable=set{file,folder,both}; prior_capture=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The run's record and its outcome are the output the owner and host read; reporting them is the delivered outcome."""
delivered_with = ["SR-001", "SR-091"]
form = "interface"

[requirement.SR-090]
title = "Retrying unreadable files is bounded for each location"
sn_refs = ["SN-052"]
boundary_refs = ["B-01", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The system shall bound the total extra time a run spends waiting to retry unreadable files to a declared limit for each configured location, however many files are unreadable."""
rationale = """Per-file retries multiplied by many locked files can stretch a run past its window or make it look hung; an unbounded per-file retry fails the host at 3am with nobody watching. One limit per configured location keeps a systemically unreadable tree from sleeping the run away while every location still gets its own chance."""
acceptance_criteria = """With many files of one location held unreadable throughout a run, the run's waiting for retries in that location totals no more than 60 seconds over the same run with them readable; once the limit is spent, remaining unreadable files are reported failed without further waiting, the record says the limit was reached, and the run ends with the part-failed outcome."""
permutations = """unreadable_count=range[1..10000]; availability=set{next-retry,after-limit,never}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The run's own duration and outcome are the observed result."""
