[requirement.SR-094]
title = "A run succeeds with read-only access to the source when its state lives elsewhere"
sn_refs = ["SN-037", "SN-024"]
boundary_refs = ["B-01", "B-12", "B-20"]
requirement = """Where the change-detection state is kept outside the source, the system shall complete a run against a source it is only allowed to read."""
rationale = """A tool that needs write access to the source cannot be prevented from damaging it, and cannot run under a read-only mount such as a container's. Where the source may only be read, the change-detection state has to live elsewhere, which the owner configures (SR-139); a read-only source without that setting is SR-140's."""
