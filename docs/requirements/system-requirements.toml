[requirement.SR-109]
title = "A repair fixes only what is certain"
sn_refs = ["SN-047"]
boundary_refs = ["B-02", "B-06", "B-08"]
requirement = """When the owner asks for a repair, the system shall correct every check finding of a class declared certain, and leave and report every other finding."""
rationale = """A problem that can only be reported leaves the owner choosing between living with it and a fresh backup that throws away history; a repair that guesses can lose a recoverable store. A finding is certain when its right answer is established by stored bytes whose identity is verified: either the bytes at the entry's own place, or, for content missing from its place, a copy elsewhere in the backup whose bytes, read and hashed at repair time, have the digest and length the record names, which is the identity the record states for that content (DA-05, DA-11). The repair stores those bytes again at the entry's own place rather than pointing the entry at the other copy: pointing would make the entry depend on a folder whose removal knows nothing of it, the shared-content loss the repair exists to prevent, while a copy costs only the space of one object. Where no such copy exists, the finding is reported, and content missing from the whole backup comes back only from a later run over the source."""
acceptance_criteria = """The certain classes are a recorded stored form that disagrees with the stored bytes at the entry's own place, a stored item whose name claims a form its bytes do not have, and content missing from its place while a copy elsewhere in the backup, read and hashed by the repair, has the digest and length the record names, which the repair stores again at the entry's own place, leaving the entry's location and every other folder unchanged; each is corrected for every entry sharing that stored item, and a check afterwards no longer reports it. Content missing from the whole backup, stored bytes that differ from their record, a copy elsewhere whose bytes do not hash to the recorded digest and length (including one whose name claims that identity), and stored content no record refers to are reported and left as they are. After the repair, removing the folder that held the copy leaves the repaired entry restorable byte-exact. Every state that restored before restores byte-exact afterwards, and a repair of an intact store changes nothing."""
permutations = """finding=set{form-recorded-wrong,name-claims-wrong-form,missing-here-verified-copy-elsewhere,missing-here-unverified-copy,missing-everywhere,altered,unreferenced}; sharing=bool; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-05", "DA-11"]
delivered_with = ["SR-110"]
form = "interface"

[requirement.SR-110]
title = "An interrupted repair or kit refresh leaves every state restorable"
