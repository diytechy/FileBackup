[requirement.SR-074]
title = "Only the declared exclusions are left out of a backup"
sn_refs = ["SN-001"]
boundary_refs = ["B-01"]
requirement = """The system shall leave out of a backup only the declared exclusions: the change-detection state it keeps at a source's root; where a source is the root of a volume, the volume's own system folders at that root, matched without regard to letter case, and no other file or folder of the same name elsewhere in the tree; what lies behind a folder link or junction it records rather than follows (SR-150, SR-151); and a file whose name it refuses as non-portable (SR-055)."""
rationale = """An exclusion set wider than this silently drops owner data that happens to share a name; none at all makes a volume-root source fail every run on a folder nobody can read and backs up files the owner already discarded. A per-location exclusion list lost: scoping the source is the declared way to leave things out. A setting that leaves files out by hidden, system or dot-named status lost too: it silently drops owner data. What is the system's own is what it writes into the source, not what shares a name with it. Matching ignores case because the systems that create those folders do. The list is complete, so the capture domain of SR-001 is exactly the source less these; a recorded link is kept in the record and rebuilt at restore, and a refused name is named in the run's record, so nothing is left out silently (SR-150, SR-151, SR-152, SR-055)."""
acceptance_criteria = """A source at the root of a local drive or of a network share omits only the volume's metadata folder and recycle folder at that root, whatever their letter case; the same folder names nested in the tree, or directly under an ordinary folder that is a source, are backed up in full. Where the change-detection state is kept at the source root it is not backed up, and same-named files nested elsewhere are; where it is kept elsewhere, a root-level owner file sharing its name is backed up; a root-level owner file sharing a name with a file the system keeps only in the backup is backed up. What lies behind a folder link or junction that is recorded rather than followed is left out and the link is recorded; a file whose name is refused is left out and named in the run's record. Nothing else is omitted. An unreadable volume system folder at the root neither fails the run nor adds an entry, and does not change the outcome class of a later restore."""
permutations = """source_root=set{drive-root,share-root,ordinary-folder}; folder_position=set{top-level,nested}; folder_name=set{volume-metadata,recycle,state-record,backup-only-name,ordinary}; state_location=set{source-root,elsewhere}; name_case=set{as-created,different-case}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-12"]
delivered_with = ["SR-001", "SR-137", "SR-055"]
form = "assumption"

[requirement.SR-075]
title = "A run after a dead interrupted run proceeds by itself when nothing would be lost"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-04"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """When a run finds traces of an earlier interrupted run and can tell from the backup alone that the earlier run is dead and that proceeding loses nothing, the system shall recover and complete the run without intervention."""
rationale = """A run that refuses forever after one interruption stops all future backups until someone notices; a run that reclaims a live run's work destroys content. A process identifier proves nothing across hosts or containers, so death is judged from liveness evidence that has stopped changing for longer than a stated time; a longer time delays recovery, a shorter one risks a live run. How liveness is kept and confirmed is design under this row; two runs racing to recover are SR-085's, and a run reclaimed while it was suspended is SR-144's."""
acceptance_criteria = """After a run is killed at a point that left no content in transit, a run started once the killed run's liveness evidence has been unchanged for longer than 30 minutes completes with the complete outcome without intervention, and the store restores every state; a run started sooner is refused as SR-017 requires. A live run that is not suspended for longer than that time is never judged dead, whether it runs on the same host, another host or another container, while their clocks agree within the bound DA-16 holds for."""
permutations = """leftover=set{none,holds-no-content}; earlier_run=set{dead,alive}; elapsed=set{under-stale-time,over-stale-time}; host=set{same,other-container}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-02", "DA-16"]
delivered_with = ["SR-017", "SR-144"]
form = "assumption"

[requirement.SR-081]
title = "With compression on, a measured saving decides, and the file type decides where no measurement is taken"
sn_refs = ["SN-003"]
boundary_refs = ["B-02", "B-10"]
requirement = """Where compression is turned on, the system shall decide whether newly written content is stored compressed from a measurement of the saving compression gives it, and from its file type where measuring is turned off, the content is at or below the size floor, or the measurement cannot be taken."""
rationale = """Media is already compressed and only gets slower; text shrinks a lot. A file's type is a fair guess and a measurement is better: deciding by type alone wastes space on misnamed text and time on misnamed media, so a measurement decides wherever one is taken. Where none is taken (the owner turned measuring off, the file is too small to be worth measuring, or the measurement failed), the type decides rather than storing everything as it is, so the owner keeps most of the saving without paying for measurement. Either stored form restores byte-exact, so a wrong guess costs space or time, never content."""
acceptance_criteria = """With compression on and every file measured, content larger than 256 KiB whose measured saving is at least 10% is stored compressed whatever its name, and content saving less is stored as it is whatever its name, so random bytes under a document name stay as they are and text under a media name is compressed. With measuring turned off, and for files of 256 KiB or less in every choice, content of a type declared as already compressed is stored as it is and other content is stored compressed, without measuring. With known-incompressible types skipped, files of those types are stored as they are without being measured and other files are measured. When the measurement cannot be taken, the file type decides, with a warning, and the run does not fail on that account. Measuring changes neither the source nor stored content. Every file restores byte-exact in every case."""
permutations = """content=set{compressible,incompressible,partly-compressible}; name_class=set{media-type,document-type,listed-incompressible,none}; measuring=set{off,skip-listed-types,every-file}; size=set{below-floor,above-floor}; measurement=set{taken,unavailable}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-18"]
delivered_with = ["SR-096"]
form = "interface"

[requirement.SR-082]
title = "An interrupted run never leaves a state that restores wrongly"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-13"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """If a run is interrupted at any point, then the system shall leave the latest state as the tree before the run or the tree after it, and every visible state either restorable as recorded or refused by a restore with the damaged-record outcome, never restored wrongly."""
rationale = """Unattended runs are killed by reboots, power cuts and stopped containers. A half-written state that a restore reads as complete hands back a shrunken tree, and a torn rewrite can destroy the only record of a saved state. A state is published as a record and its completeness evidence, two writes that no single rename makes one (DA-01), so the honest promise is not that every visible state always restores but that none restores wrongly: one caught between the two is refused as damaged. Recovery comes after admission and exclusive ownership: the next run first holds the backup exclusively (SR-085, SR-086) and passes admission (SR-018, SR-019, SR-017), and only then completes a publication it positively identifies as interrupted from surviving evidence. Matching evidence alone is not proof that a damaged record is authoritative, so anything ambiguous is refused under SR-017 rather than recovered."""
acceptance_criteria = """With a run killed at each step in turn, and with power removed during writing, the latest state restores as the pre-run or the post-run tree or is refused with exit code 3, every visible saved state restores or is refused with exit code 3, and no restore produces a tree other than one the state records; the record of each state is either its complete old or its complete new version, never a torn one. The next run, once it holds the backup exclusively and has passed admission, completes each interrupted publication it positively identifies from surviving evidence, re-establishing matching completeness evidence, after which every visible state restores, and it replaces any incomplete leftovers; damage or leftovers it cannot positively identify as an interrupted publication are refused as SR-017 requires, with nothing changed. A next run refused at admission, or as busy, changes nothing, recovery included."""
permutations = """interrupt=set{kill,power-loss,container-stop}; interrupt_point=range[first-step..last-step]; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-01", "DA-15"]
delivered_with = ["SR-017", "SR-085"]
form = "assumption"

