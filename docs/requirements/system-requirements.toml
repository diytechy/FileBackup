form = "interface"

[requirement.SR-085]
title = "Only one changing operation proceeds on a backup at a time"
sn_refs = ["SN-039"]
boundary_refs = ["B-04", "B-08"]
requirement = """While a backup, a removal, a repair or a kit refresh is changing a backup, the system shall refuse any other of those operations on the same backup, change nothing for it, and name the operation holding the backup."""
rationale = """Overlapping scheduled runs or a removal during a backup let two writers act on state the other is changing and destroy content neither meant to touch. Queueing the second lost: it stacks runs behind a hung one. The exclusion covers the whole operation, its final steps included, because those steps can briefly hold the only copy of saved content."""
acceptance_criteria = """For each ordered pair of changing operations started on one backup, at the start, the middle and the final steps of the first, the second is refused as busy with value 2, its message names the first, and the store matches what the first alone produces. When two runs start together to recover the same dead run's unfinished work, one proceeds and the other is refused the same way."""
permutations = """first=set{backup,removal,repair,kit-refresh}; second=set{backup,removal,repair,kit-refresh}; phase=set{start,middle,final}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-03"]
delivered_with = ["SR-106", "SR-107", "SR-086", "SR-144"]
form = "assumption"

[requirement.SR-086]
title = "Not being able to establish exclusive use counts as a live holder"
sn_refs = ["SN-039", "SN-013"]
boundary_refs = ["B-04", "B-08"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = """If the system cannot establish exclusive use of a backup for any reason, then the system shall treat the backup as held by a live operation and refuse the changing operation without creating, moving or deleting anything in it."""
rationale = """Derived through FILESYSTEM-SEMANTICS: the needs say a second changing operation is refused (SN-039) and that an interrupted run is never built on (SN-013), but not what to conclude when the claim of exclusive use itself fails for a reason other than another holder (access denied, an unusable claim location, an I/O error, a brief outside access), which differs between filesystems and network shares. The two errors are not symmetric: taking a failure as free can let two writers destroy content, taking it as busy costs one run. Obtaining exclusive use is never taken as proof that an earlier interrupted run is dead; that judgement stays with SR-075 and SR-017."""
acceptance_criteria = """With the claim of exclusive use failing through contention, access denial, an unusable claim location and an I/O error in turn, a backup, a removal, a repair and a kit refresh are each refused as busy with value 2 and the store is byte-identical; after the cause clears, the same operation proceeds. With exclusive use obtained but an earlier run's unfinished work showing a live or unproven owner, or holding content, the run is still refused as SR-017 requires."""
permutations = """claim_failure=set{contention,access-denied,unusable-location,io-error}; operation=set{backup,removal,repair,kit-refresh}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched store are the outcome."""
