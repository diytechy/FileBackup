[requirement.SR-144]
title = "A run whose work was reclaimed after its claim was lost changes nothing its successor made and publishes nothing more"
sn_refs = ["SN-013", "SN-039"]
boundary_refs = ["B-02", "B-04", "B-08"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """If a run resumes after a successor has reclaimed its work because its claim of exclusive use was no longer held and its liveness evidence was stale beyond the stale time, then the system shall change no file its successor wrote or published, publish nothing further in that backup, and end the resumed run without reporting it complete."""
rationale = """Derived through INTEGRITY-RECOVERABILITY: SN-013 lets a later run recover from one it can tell is dead, and SN-039 lets only one changing operation proceed. Under DA-03 a suspended holder (a paused virtual machine, a frozen container) still holds its claim, so a successor is refused while it does (SR-085) and no reclaim happens. The reclaim this row answers arises only where the claim is no longer held: the holder ran on another host or container whose claim the successor does not share, outside DA-03's holding condition, or its claim was lost, and its liveness evidence went stale beyond the threshold (SR-075). No liveness rule can tell such a holder from a dead one, so the protection sits on the resuming side: it must notice it no longer holds the backup and touch nothing its successor wrote. No separate check can close the window between reading the evidence and the write it guards, so the reclaim itself must disable the resumed run's changes; what such a run can still write through work it already had open lands among the leftovers the successor set aside, never in a file the successor wrote or published."""
acceptance_criteria = """A run suspended while it holds its claim, for longer than the stale time, keeps the backup held: a successor is refused as busy (value 4, SR-085) until the claim is released, and the store is unchanged by it. A run on another host or container whose claim the successor does not see, suspended for longer than the stale time while the successor reclaims its unfinished work and completes, then resumed, changes no file the successor wrote or published, publishes nothing, writes nothing outside the leftovers the successor set aside, every state restores as the successor left it, and the resumed run ends with the part-failed outcome (value 1) and a record saying its work was reclaimed."""
permutations = """claim=set{held-same-kernel,not-shared-other-host}; resume_point=set{while-reading,while-storing,while-publishing}; successor=set{completed,still-running}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-03", "DA-16"]
delivered_with = ["SR-075", "SR-085"]
form = "interface"

[requirement.SR-145]
title = "A restore makes every whole-restore refusal before it writes anything"
sn_refs = ["SN-053", "SN-025", "SN-019", "SN-042"]
boundary_refs = ["B-14", "B-17", "B-16", "B-15"]
requirement = """When a restore is started, the restore kit shall make every whole-restore check, of the request and its target, of the record's integrity and form, of the tools its route needs and of the target's space, before writing anything to the target, and continue file by file only once every one of them has passed."""
rationale = """Per-file continuation (SR-029, SR-120, SR-121) and whole-restore refusal (SR-009, SR-023, SR-039, SR-061, SR-118, SR-141) each answer a need, and a restore that meets both at once must not write a partial tree and then refuse: a refused restore writes nothing, so the restorer can fix the cause and run it again, and per-entry continuation applies only to a restore that has been admitted. Which value is reported when several refusals apply is SR-040's precedence; this row decides only that no write comes before them."""
acceptance_criteria = """With each whole-restore fault combined in turn with a per-entry fault (a record whose completeness evidence does not match together with an entry that would land outside the target; a target lacking space together with missing content; a missing restore tool together with two names that collide on the target), nothing is written to the target and the restore returns the value SR-040's precedence gives for the whole-restore faults present. With only per-entry faults, every other file restores and the per-entry outcome is reported."""
permutations = """whole_fault=set{target-in-backup,unresolvable-target,record-evidence-mismatch,retired-form,missing-tool,no-space}; entry_fault=set{none,escaping-entry,missing-content,name-collision}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Nothing written before a refusal, and the outcome, are the result."""
delivered_with = ["SR-029", "SR-120", "SR-121", "SR-040"]
form = "interface"

[requirement.SR-146]
title = "A current-form state with missing or malformed folder metadata or links restores its files and reports part failed"
sn_refs = ["SN-036", "SN-053"]
boundary_refs = ["B-16", "B-15"]
requirement = """If the folder record or the link record of a current-form state is missing or malformed, or holds fewer rows than the state's completeness evidence states, then the restore kit shall still restore every file of that state, name the folder metadata and the links it could not apply, and report the part-failed outcome."""
rationale = """Old-version compatibility and damage are separate policies. A state positively identified as written before folder metadata existed restores as complete (SR-116), but a current-form state that has lost its folder record has lost empty folders or attributes SN-036 asks for, so a complete outcome would tell the restorer the tree is whole when it is not (SN-053); a lost link record loses the links SN-036 asks for in the same way. Refusing the restore lost: every file's content is still there and checkable, and folder metadata is not content."""
acceptance_criteria = """With a current-form state's folder record removed, malformed and short of its stated rows, and with its link record removed, malformed and short of its stated rows, every file restores byte-exact, the report names the folder metadata not applied (empty folders not recreated, attributes not applied) or the links not rebuilt, and the restore ends with exit code 1, through every restorer; a state positively identified as written before folder metadata existed ends with exit code 0 (SR-116)."""
permutations = """record=set{folder,link}; fault=set{missing,malformed,short}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restored files and the report are the outcome."""
delivered_with = ["SR-116", "SR-065", "SR-122"]
form = "interface"

[requirement.SR-147]
title = "With the space view off, the run's record says the media measure was not taken"
sn_refs = ["SN-051"]
boundary_refs = ["B-06"]
requirement = """Where the space view is turned off, the system shall record in each run's record that the media measure was not taken."""
rationale = """SN-051 asks the record to say the measure was not taken when the feature is off as well as when it cannot be taken; a figure silently missing looks like zero, or like a tool that failed. The view's own behaviour while it is on is SR-097, SR-098 and SR-099's, and the record entry for a missing tool is SR-133's."""
acceptance_criteria = """With the space view off, with the media-measurement tool present and with it absent, the run's record says the media measure was not taken, no media measurement is made, and the run's stored content and outcome are those it has without the space view."""
permutations = """tool=set{present,absent}; @full"""
priority = "C"
verification = "Test"
status = "Drafted"
coincident = """The run's record is the outcome."""
delivered_with = ["SR-099", "SR-133"]
form = "interface"

