boundary_refs = ["B-01"]
requirement = "The system shall omit source content only under the documented capture-scope policy, and distinguish each unsupported entry from captured content."
rationale = "Volume-root operating-system metadata and recycle folders can be explicitly excluded; a same-named nested or ordinary owner folder cannot be excluded merely by its name. No source-side FileBackup state is created or exempted."
acceptance_criteria = "The proposed scope excludes only declared volume-owned metadata/recycle entries at actual volume roots and traversal behind links recorded under SR-150/151 rather than followed; external links governed by SR-137 retain that proposed follow policy. The same names in ordinary or nested owner folders are captured. Unsupported names or links are reported, unreadable entries are failures with retained prior copies, and hidden/system/dot status alone never excludes owner data."
