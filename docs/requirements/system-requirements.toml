[requirement.SR-043]
title = "Backups, removals, checks, repairs and kit refreshes report their outcome from the shared outcome vocabulary"
sn_refs = ["SN-045"]
boundary_refs = ["B-08", "B-12"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The system shall end every backup, removal, check, repair and kit refresh with a documented outcome value that is distinct for each of: complete; some part failed; refused because it cannot proceed until someone changes something; refused because the record of a state was damaged; and stopped for a later retry because the backup was busy or a host fault occurred while it worked."""
rationale = """A host deciding whether to retry, alert or carry on cannot act if every failure looks the same, and a run that backed up nothing must not look like one that worked. Distinct values only on request lost: a host that forgets to ask gets the ambiguous form. SN-045 asks that a refused configuration and a busy backup be told apart. The line is drawn by what the host must do: alert a person when nothing will change until someone acts, whether on the request, the configuration or an unmet precondition, and retry later when waiting alone can clear the cause, as with a busy backup or a host fault mid-operation. One vocabulary serves every operation and is the restore's (SR-040). Busy applies to the operations that change a backup; a check runs beside them (SR-106)."""
acceptance_criteria = """Without any opt-in, deliberately induced instances of each class for a backup and a removal, of complete, some part failed and configuration refused for a check, and of complete and busy for a repair and a kit refresh, produce: 0 complete; 1 some part failed or content missing; 2 refused until someone changes something, for a bad request, a refused configuration or a precondition not met (a missing or unsupported runtime, tool or component, a destination lacking space, a source that suddenly looks empty, the leftovers of an unfinished removal, a retired store form, a read-only source with no state location); 3 refused over a damaged record of a state; 4 retry later without changing anything, for a busy backup or a host fault while working, such as an I/O failure or a tool failing mid-operation. A refused configuration and a busy backup never return the same value. A launch that still makes the former request for distinct values is accepted and gets the same values. For a run covering several locations, the value is 0 when all completed; when every location was refused before anything changed, it is the refusal's value, 2 taking precedence over 3 and 3 over 4 where the locations' refusals differ; otherwise it is 1 when any location failed or was refused. The same values come through the container's exit status."""
permutations = """operation=set{backup,removal,repair,kit-refresh}; class=set{complete,part-failed,configuration-refused,precondition-not-met,damaged-record,busy,host-fault}; locations=set{one,several}; host=set{direct,container}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-09"]
form = "interface"

