[requirement.SR-143]
title = "Third-party components in the container image are licensed for it and carry their notices"
sn_refs = ["SN-054"]
boundary_refs = ["B-22"]
hat_refs = ["LEGAL"]
requirement = """The system shall ship in the container image only third-party components whose licences permit that redistribution, each with its required notices in the image."""
rationale = """Every container image a host pulls carries other people's code; shipped against its licence, each is a breach whose risk the owner carries. The image is delivered, not operated, so this row sits at the delivery crossing; the backup folder's own components are SR-131's."""
