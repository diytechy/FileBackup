[requirement.SR-116]
title = "A state recorded before a newer kind of record restores and says what it could not check"
sn_refs = ["SN-041", "SN-025"]
boundary_refs = ["B-15", "B-16"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """When a state carries positive evidence that it was recorded before a newer kind of record existed, the restore kit shall restore it as before and report each check it could not make."""
rationale = """Refusing older states because they lack a newer record strands history; restoring them silently hides that a check was skipped. This is what reconciles SN-041's old-state promise with SN-025's refusal: absence of evidence a version never wrote is not damage. Absence alone is not evidence of age, though, or deleting the evidence would bypass the refusal SN-025 asks for, so the older version must be shown by the record itself; how is the record-format interface's. This row is compatibility only: missing or malformed metadata in a current-form record is damage, and its outcome is SR-146's."""
acceptance_criteria = """A state whose record shows it was written before completeness evidence existed restores byte-exact, its report says the record is unverified, and the restore ends with exit code 0; a current-form record whose completeness evidence is missing is not treated as older and is refused (SR-039). A state whose record shows it was written before folder metadata existed restores its files as before, its report says the folder metadata was not recorded, and the restore ends with exit code 0; a current-form state without its folder record is not treated as older (SR-146)."""
permutations = """missing_record_kind=set{completeness-evidence,folder-metadata}; age_evidence=set{older-form,current-form}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restore and its report are the outcome."""
delivered_with = ["SR-115", "SR-039", "SR-146"]
form = "interface"

