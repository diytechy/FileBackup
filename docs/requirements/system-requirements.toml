[requirement.SR-112]
title = "Runs, checks and restores stay within their total memory bound at scale"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-15"]
hat_refs = ["PERFORMANCE"]
requirement = """Where the library is within the declared scale, a run is within the declared change envelope and the host meets the declared reference, the system shall keep the total resident memory of a run, a whole-backup check and a full restore, each with the tools it runs at the same time, within its declared memory bound."""
rationale = """Off the single-crossing rule on purpose: memory is a whole-operation property. A tool whose memory grows with the library eventually stops fitting the host, and fails on the night it matters. The bound covers the whole operation, its own processes and the hashing, archive and media tools it runs concurrently (B-10, B-18), because the host's memory is shared by all of them; a bound on one process alone can pass while the operation as a whole exceeds the host."""
acceptance_criteria = """On the reference host and library of SR-064, the peak total resident memory, summed over the operation's own processes and every tool it runs at the same time, of a run with at most 1 GiB changed (SR-113), of a whole-backup check and of a full restore each stays at or below 4 GiB."""
permutations = """operation=set{run-few-changes,check,full-restore}; files=range[1..1000000]; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The memory used is the outcome."""
