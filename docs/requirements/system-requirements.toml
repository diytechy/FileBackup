rationale = "A relative target calculated from the restored link’s parent keeps the relationship valid when the whole restored tree moves to another drive or location. The original link may have been absolute or a junction; portable folder-link behavior is preferred over retaining a host-specific representation. Links are created after ordinary directory and file recovery so they cannot redirect that work. An external absolute target or a relative target escaping the restored root is not a valid fallback."
acceptance_criteria = "Restore the supported in-root link cases of SR-150 through both carried recovery routes. Each link reaches the corresponding restored directory using a target relative to its own parent, including a parent component where the resolved destination still stays inside the restored root. Move the complete recovered root to a different location: the links still reach its directories. Ordinary directories and files are restored before links are created, and no content writes follow those links. Outside-root, ambiguous or unavailable target mappings are reported without recreating an absolute or escaping link. If the host lacks the required link capability or privilege, report the affected link as a metadata limitation rather than silently replacing it with copied content; otherwise complete content recovery may remain complete with those warnings. Missing or malformed required recorded link metadata remains incomplete."
permutations = "route=set{PowerShell,bash}; source_link=set{relative,absolute,junction}; destination=set{sibling,descendant,ancestor,root,outside,unavailable}; target_capability=set{supported,unsupported,permission-denied}; moved_root=bool; @pairwise"
