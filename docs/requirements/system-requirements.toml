[requirement.SR-052]
title = "A backup refuses before writing when its destination lacks space"
sn_refs = ["SN-019"]
boundary_refs = ["B-03", "B-06", "B-08"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = """If a backup's demand for space on a volume, summed over every configured location on that volume, exceeds the volume's free space, then the system shall refuse those locations, as a precondition not met, before writing, naming the volume with the space needed and the space free."""
rationale = """A backup that fills its volume midway can leave the record and the content out of step. Checking each location alone lost: several locations sharing a volume pass singly and fail together. Treating paths as volumes lost too: a mount and the folders beneath it are one volume. Counting content lengths alone lost: a tree of many small files writes records, kits, logs and temporary copies too, so the demand carries a declared allowance for them."""
acceptance_criteria = """Demand counts new content at its uncompressed length, content being stored again to heal a loss, earlier content that must be copied to a saved-state location on another volume, and a declared allowance for the records, restore kits, logs and temporary space the run writes. With demand above free space, alone or summed across two locations on one volume, nothing is created or changed on the volume, the message names the volume, needed and free space, and those locations are refused as a precondition not met (value 2, SR-043); with demand at or below free space the run proceeds and does not fail for want of space. A mount point and the folders beneath it count as one volume on Windows and on Linux."""
permutations = """locations_on_volume=range[1..3]; need_vs_free=set{below,equal,above}; demand=set{new-content,healed-content,cross-volume-history,many-small-files}; platform=set{windows,linux}; @pairwise"""
