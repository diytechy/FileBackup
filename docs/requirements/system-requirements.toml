[requirement.SR-067]
title = "A briefly locked file is retried within the run"
sn_refs = ["SN-052"]
boundary_refs = ["B-01"]
requirement = """If a source file cannot be read when a run reaches it, for a reason that could change, then the system shall try it again within the same run, up to three attempts in all while its location's retry limit (SR-090) lasts, and capture it at the first attempt that succeeds."""
rationale = """Other programs hold files open for a moment; giving up at the first refusal leaves a gap for no reason. Waiting on the file until it opens lost: it can hang the run. A failure that waiting cannot change is not retried, because a retry would only delay a loud, accurate error. This row is the one home of the per-file attempt count; the per-location time limit is SR-090's."""
acceptance_criteria = """A file held locked when the run first reaches it and released before its last allowed attempt is captured by that run, the retry is visible in the run's record, and the file is not reported failed. No file is tried more than three times. A file still unreadable at its last allowed attempt, or when its location's retry limit is spent, is reported with the number of attempts made, and no entry is recorded for content the backup does not hold."""
permutations = """lock_released=set{before-second-attempt,before-third-attempt,never}; retry_limit=set{available,spent}; group=set{unique,shared-content}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The captured file is the outcome; no assumption sits between the retry and the copy in the backup."""
delivered_with = ["SR-090", "SR-091"]
form = "interface"

[requirement.SR-068]
title = "A store holding both forms restores byte-exact"
sn_refs = ["SN-048"]
boundary_refs = ["B-13", "B-16"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """The restore kit shall restore every state of a store holding content in both compressed and uncompressed form byte-exact, whatever form each state's record says its content is in."""
rationale = """After a setting change one content can exist in both forms; a restorer that trusts the recorded form can hand back archive bytes under the original name and report success. A source file can itself be an archive, so the decision rests on the stored bytes, not on a name or a recorded flag."""
acceptance_criteria = """In a store whose compression was turned on and off between runs, every saved state and the latest state restore byte-exact through every restorer, including states whose recorded form disagrees with the copy found and with every recorded form flipped; a source file that is itself a compressed archive, stored as it is, restores as that archive and is never expanded; a stored item matching neither form fails as content damage rather than restoring wrong bytes."""
permutations = """history=set{on-off,off-on,on-off-on}; recorded_form=set{correct,flipped}; item=set{tool-compressed,raw,source-archive-stored-raw,damaged}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
