title = "A change-detection state given a location is kept there"
sn_refs = ["SN-037"]
boundary_refs = ["B-05", "B-07", "B-20"]
requirement = """Where a location is configured for a source's change-detection state, the system shall keep that state at that location and write nothing into the source for it."""
rationale = """SN-037 lets the owner set the record to live on the backup side, for a source that may only be read or that the owner wants untouched. A setting that is accepted but still writes at the source root would break the promise the owner chose it for. Which configured locations are accepted is SR-149's."""
