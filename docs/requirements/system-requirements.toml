rationale = """An exact account of what is missing is what lets the restorer act on a partial tree; a generic failure leaves the recovered tree misleading, and a success status hides the loss from a script. A restore refused at admission writes no tree to account for; its refusal names its cause (SR-145)."""
acceptance_criteria = """The reported list equals the set of files not restored and the count equals its size, for one, several and every file failing through missing content, failed recovery from another copy, failed expansion and unrecoverable content mismatch; no incomplete restore reports complete; an intact restore reports complete with exit code 0."""
