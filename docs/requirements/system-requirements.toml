[requirement.SR-090]
title = "Retrying unreadable files is bounded for each location"
sn_refs = ["SN-052"]
boundary_refs = ["B-01", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "The system shall bound the total extra time a run spends waiting to retry unreadable files to a declared limit for each configured location, however many files are unreadable."
rationale = "Per-file retries multiplied by many locked files can stretch a run past its window or make it look hung; an unbounded per-file retry fails the host at 3am with nobody watching. One limit per configured location keeps a systemically unreadable tree from sleeping the run away while every location still gets its own chance."
acceptance_criteria = "With many files of one location held unreadable throughout a run, the run's waiting for retries in that location totals no more than 60 seconds over the same run with them readable; once the limit is spent, remaining unreadable files are reported failed without further waiting, the record says the limit was reached, and the run ends with the part-failed outcome."
permutations = "unreadable_count=range[1..10000]; availability=set{next-retry,after-limit,never}; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-067", "SR-089", "SR-091"]
form = "interface"

[requirement.SR-091]
title = "A persistently unreadable file keeps its earlier copy"
sn_refs = ["SN-052"]
boundary_refs = ["B-13", "B-06"]
requirement = "If a file or folder that an earlier run captured stays unreadable for a whole run, then the system shall keep its earlier content in the latest state rather than record it as removed."
rationale = "Recording an unreadable file as removed turns a passing lock or a permissions change into data loss; dropping it lost because the source still holds it. When the earlier bytes are shared with another file, keeping them for one entry must not depend on the other."
acceptance_criteria = "After a run in which a previously captured file and folder stay unreadable, the run reports them with the cause and fails, and the latest state still restores their previously saved content, including when another source file shared those bytes and has since changed or been removed."
permutations = "unreadable=set{file,folder}; shared=bool; @full"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-067", "SR-089", "SR-090"]
form = "interface"
hat_refs = ["SHARED-CONTENT"]

[requirement.SR-092]
title = "Names that would collide on the restore target are reported, never merged"
sn_refs = ["SN-032", "SN-053"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["CROSS-PLATFORM", "FILESYSTEM-SEMANTICS"]
requirement = "If two recorded names would land on the same name on the restore target, then the restore kit shall write neither, name both as not restored, and report incomplete recovery with an explicit target-name-collision cause."
rationale = "Derived through CROSS-PLATFORM: names that differ only by case, or by Unicode normalisation, are distinct on the backup host and one file on a case-insensitive or normalising target, so one file silently replaces the other. SN-032 asks that names come back exactly and SN-053 that the restorer is told which files did not; refusing the whole restore lost because every other file can still come back, and writing one of the two lost because which one survives would depend on the order of the record."
acceptance_criteria = "A state holding two names differing only by case, restored onto a case-insensitive target, and two names differing only by Unicode normalisation, restored onto a normalising target, restores every other file, writes neither colliding entry, names both as not restored, and returns the incomplete result; on a target that keeps both names distinct, both restore. Machine-readable and human diagnostics identify target-name collision rather than claim the stored bytes are missing."
permutations = "collision=set{case,unicode-normalisation}; target_case_sensitive=bool; @full"
priority = "M"
verification = "Test"
status = "Approved"
delivered_with = ["SR-021", "SR-029", "SR-055", "SR-119", "SR-120", "SR-145", "SR-146", "SR-158"]
form = "interface"

