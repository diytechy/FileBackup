requirement = """When the container is started without naming an action, the system shall run a backup."""
rationale = """SN-024's acceptance asks that a container started without naming an action runs a backup: a host that schedules one-shot backup containers should not have to name the commonest action. Removals and the saved-state report are named explicitly (SR-048)."""
