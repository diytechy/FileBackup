[requirement.SR-092]
title = "Names that would collide on the restore target are reported, never merged"
sn_refs = ["SN-032", "SN-053"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """If two recorded names would land on the same name on the restore target, then the restore kit shall write neither, name both as not restored, and report the content-missing outcome."""
rationale = """Derived through CROSS-PLATFORM: names that differ only by case, or by Unicode normalisation, are distinct on the backup host and one file on a case-insensitive or normalising target, so one file silently replaces the other. SN-032 asks that names come back exactly and SN-053 that the restorer is told which files did not; refusing the whole restore lost because every other file can still come back, and writing one of the two lost because which one survives would depend on the order of the record."""
acceptance_criteria = """A state holding two names differing only by case, restored onto a case-insensitive target, and two names differing only by Unicode normalisation, restored onto a normalising target, restores every other file, writes neither colliding entry, names both as not restored, and returns exit code 1; on a target that keeps both names distinct, both restore."""
