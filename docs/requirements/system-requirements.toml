[requirement.SR-112]
title = "Runs, checks and restores stay within their total memory bound at scale"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-15"]
hat_refs = ["PERFORMANCE"]
requirement = "Where the library is within the declared scale, a run is within the declared change envelope and the host meets the declared reference, the system shall keep the total resident memory of a run, a whole-backup check and a full restore, each with the tools it runs at the same time, within its declared memory bound."
rationale = "Off the single-crossing rule on purpose: memory is a whole-operation property. A tool whose memory grows with the library eventually stops fitting the host, and fails on the night it matters. The bound covers the whole operation, its own processes and the hashing, archive and media tools it runs concurrently (B-10, B-18), because the host's memory is shared by all of them; a bound on one process alone can pass while the operation as a whole exceeds the host."
acceptance_criteria = "On the reference host and library of SR-064, the peak total resident memory, summed at each measurement instant over the operation's own processes and every tool it runs at that time, of a run with at most 1 GiB changed (SR-113), of a whole-backup check and of a full restore each stays within that host's declared available-memory budget. The measurement method declares its treatment of shared resident pages; separate processes' peaks at different times are not added together."
permutations = "operation=set{run-few-changes,check,full-restore}; files=range[1..1000000]; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-064", "SR-113"]
form = "cross-cutting"

[requirement.SR-113]
title = "A run's time follows what changed, and grows less than in proportion to stored history"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-08"]
hat_refs = ["PERFORMANCE"]
requirement = "Where a run has at most the declared amount of change and the backup holds up to the declared number of saved states, the system shall complete it within its declared time budget, its time growing less than in proportion to the number of saved states."
rationale = "Off the single-crossing rule on purpose: a scaling property of the whole run. A run whose cost grows with history slows every year without the source changing, until it no longer fits its window. The history envelope makes the budget finite: a year of daily saved states."
acceptance_criteria = "With at most 1 GiB changed in a library of up to 2 TiB in up to one million files, no full re-read due, and up to 365 saved states, on the reference host of SR-064, a run completes within 30 minutes. Doubling the number of saved states from 182 to 364, with the same source, the same change between the measured runs, no full re-read due in either, the same host with no competing load and the same compression setting, increases that run's time by less than a factor of two."
permutations = "saved_states=range[1..365]; changed_bytes=range[0..1GiB]; files=range[1..1000000]; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-064", "SR-112"]
form = "cross-cutting"

