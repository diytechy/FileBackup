[requirement.SR-120]
title = "An incomplete restore names every file not restored, its cause and the count"
sn_refs = ["SN-053"]
boundary_refs = ["B-15"]
requirement = "If any file of a state cannot be restored in a restore that has passed admission (SR-145), then the restore kit shall report failure, naming each file not restored with its cause and giving their total."
rationale = "An exact account of what is missing is what lets the restorer act on a partial tree; a generic failure leaves the recovered tree misleading, and a success status hides the loss from a script. A restore refused at admission writes no tree to account for; its refusal names its cause (SR-145)."
acceptance_criteria = "The reported failed-file list equals the set not restored and its count equals its size, across missing content, failed fallback, expansion failure, content mismatch, target-name collision, unsafe recorded path and host write failure. Causes distinguish these cases rather than labeling all of them missing content. Metadata-only limitations are listed separately from byte recovery; required-metadata damage remains incomplete. An incomplete restore never reports complete; all required checks passing with no lost required metadata reports complete, with explicitly unsupported metadata warnings allowed under SR-040."
permutations = "cause=set{missing,fallback-failed,expand-failed,content-mismatch,name-collision,unsafe-path,host-write-failed,metadata-only,mixed}; count=range[0..100]; @pairwise"
