[requirement.SR-085]
title = "Only one changing operation proceeds on a backup at a time"
sn_refs = ["SN-039"]
boundary_refs = ["B-04", "B-08"]
requirement = "While a changing operation using one validated configuration owns a backup, the system shall refuse a competing mutation using that configuration until ownership ends."
rationale = "Overlapping writers can invalidate each other’s decisions. This obligation covers the configuration whose resolved backup roots are unique, not independent configurations or external writers."
acceptance_criteria = "For each ordered pair of backup, removal, repair, kit refresh and other store-mutating actions using the same validated configuration, start the second at the first operation’s beginning, middle and finalization. One owns the store and the other returns busy without changing protected data. A suspended live holder is not evicted by age."
