title = "A restore with no target asks only where it can, or prints its usage"
sn_refs = ["SN-035", "SN-011"]
boundary_refs = ["B-14", "B-15"]
requirement = "When a restore is started without a target, the restore kit shall ask for one only by a folder choice on a desktop session or a typed prompt on an interactive console, and otherwise print its usage and return the documented refusal result without asking anything."
rationale = "A script cannot answer a dialog; a restore that prompts where nobody can answer hangs. A cancelled choice falling back to some default target would write where nobody asked. That a restore given its target asks nothing is SR-016's."
acceptance_criteria = "A restore started without a target in non-interactive mode, with redirected or closed input, or with neither a console nor a desktop prints its usage and returns the documented refusal result without asking anything; with an interactive console but no desktop it asks for the target by typed prompt, and on a desktop by a folder choice. A cancelled or unavailable folder choice never restores into a default target."
permutations = "start=set{non-interactive,redirected-input,closed-input,no-console-no-desktop,console-only,desktop,cancelled-choice}; restore_system=set{windows,linux,macos}; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-016", "SR-072"]
form = "interface"

[requirement.SR-074]
title = "Capture exclusions are explicit and location-specific"
