[requirement.SR-066]
title = "Each restored file gets its own modification time"
sn_refs = ["SN-036"]
boundary_refs = ["B-01", "B-16"]
requirement = "Where the target supports the recorded time within the declared precision, the recovery route shall apply each file’s own recorded modification time, including files sharing stored content."
rationale = "Identical files are stored once; unless each file's own time is applied, every twin comes back with the time of whichever was stored first. A time is metadata, not content: withholding a byte-exact file over it would throw away a good file, so the file is restored. A blank or unreadable time in a current-form record is damage, though, and the tree does not come back as it was (SN-036), so the restore reports it and does not report complete; a state positively identified as older is SR-116's."
acceptance_criteria = "Two identical files with different modification times restore with their own times, with compression on and off, through every restorer, as does a file with unique content. A file whose recorded time in a current-form record is blank or unreadable is restored with its content, the time problem is reported naming the file, the file still counts as restored, and the restore ends with the part-failed outcome. Compare times within the declared target precision. Unsupported precision or timestamp range is reported as a metadata limitation; missing/malformed required current metadata remains an incomplete outcome, not an unsupported-platform exemption."
permutations = "compress=bool; restorer=set{windows,linux,macos}; entry=set{unique,shared-first,shared-twin,blank-time,unreadable-time}; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
