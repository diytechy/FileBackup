boundary_refs = ["B-01", "B-06"]
requirement = "When a source holds a link or junction to a folder outside that source and outside the system's own locations, and that folder is not one of the link's own ancestors in the walk, the system shall capture what it leads to as part of the source, under the link's path."
rationale = "An owner who backs up a folder holding a junction assumes the junction's content is in the backup; leaving it out, even visibly, loses data the owner believes is protected. Recording the link alone lost: the folder it leads to may be on a volume no other source covers, and a restore elsewhere could not reach it. Two links to one folder are each followed: the content is stored once, because identical content is (SN-002), and only the record grows. A link to a single file is a file of the tree, captured under the link's name. A link whose target cannot be reached is a file the run could not capture."
acceptance_criteria = "With a folder link and a junction inside a source, each leading to a folder on another volume outside every system location, the run captures every file behind them under the link's path, and a restore produces them as ordinary folders and files at that path under the target; two links to the same outside folder both appear in the record and the content behind them is stored once; a link to a single file is captured and restored as the file it leads to; a link inside a followed outside folder that leads back to one of its own ancestors is recorded and not followed (SR-150), and the walk ends. A link whose target cannot be reached is named in the run's record as not captured, its earlier captured content is not recorded as removed, and the run reports part failed (value 1, SR-043). The waiting on unreachable link targets in one location, together with that location's waiting to retry unreadable files (SR-090), totals no more than 60 seconds in a run; once that is spent, further unreachable link targets are named without waiting."
permutations = "link=set{folder-link,junction,file-link}; target=set{other-volume,network-share,unreachable,ancestor-in-walk}; repeated=bool; unreachable_links=range[0..1000]; @pairwise"
priority = "M"
verification = "Test"
status = "Drafted"
coincident = "The captured tree under the link's path is the outcome."
delivered_with = ["SR-001", "SR-089", "SR-150"]
form = "interface"

[requirement.SR-138]
title = "A backup or saved-state location that overlaps a source is refused"
sn_refs = ["SN-037", "SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
requirement = """If a configured backup or saved-state location lies inside a source, equals one or contains one, then the system shall refuse the run before anything is written."""
rationale = """A backup inside its own source is written into the source, which SN-037 forbids, and is walked as source data on the next run, backing up the backup; one containing the source puts the owner's files inside the store the system manages. A drive-root source with its backup in a folder on the same drive is a plausible slip. SN-027 asks that such a wrong setting stop the run rather than be guessed at. The listing location's equivalent is SR-063, the change-detection state's SR-149."""
acceptance_criteria = """With the backup location and the saved-state location in turn inside, equal to and containing a source, including a source at a drive root with its backup in a folder on that drive, the run is refused with the configuration-refused outcome (value 2), nothing is created or changed in any location, and the message names both locations; locations that do not overlap a source run normally."""
permutations = """location=set{backup,saved-states}; relation=set{inside,equal,containing,separate}; source_root=set{ordinary-folder,drive-root}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched locations are the outcome."""
delivered_with = ["SR-063", "SR-149"]
form = "interface"

[requirement.SR-139]
title = "The change-detection state lives at the source root unless configured elsewhere"
sn_refs = ["SN-037"]
boundary_refs = ["B-05", "B-07", "B-24", "B-20"]
requirement = """Where no location is configured for a source's change-detection state, the system shall keep that state as a plain record at the source root, readable by the owner and the tool."""
rationale = """The Owner's ruling: the state beside the files it describes travels with them and needs no setting, and a plain record lets the owner see what the tool believes about the source. It is the one thing SN-037 lets the system write into a source, across the one authorised crossing into it (B-24). Keeping it elsewhere when the owner configures a location is SR-148's, and which configured locations are refused is SR-149's."""
acceptance_criteria = """With no location configured, after a run the source root holds the change-detection state as a plain record the owner can open, the owner and the tool can both read it, and nothing else is added to the source."""
permutations = """first_use=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Where the state is kept is the outcome."""
delivered_with = ["SR-093", "SR-094", "SR-140", "SR-148", "SR-149"]
form = "interface"

[requirement.SR-140]
title = "A read-only source with no state location set elsewhere is refused before the run starts"
sn_refs = ["SN-037", "SN-027"]
boundary_refs = ["B-05", "B-07", "B-01", "B-08"]
requirement = """If a source cannot be written by the run and no location outside it is configured for its change-detection state, then the system shall refuse the run before it starts, naming the setting that would let it proceed."""
rationale = """With the state kept at the source root by default (SR-139), a source the run may only read would fail at the end, after the backup was written, leaving a backup whose change-detection state is missing; refusing at the start names the one setting that fixes it (SN-027). Moving the state elsewhere without being asked lost: the owner would not know where the tool keeps it."""
acceptance_criteria = """With a source the run's account can read but not write and no state location configured, the run is refused with the precondition-not-met outcome (value 2) before anything is created or changed, and the message names the state-location setting; with that setting pointing outside the source, the same run completes (SR-094)."""
permutations = """source_writable=bool; state_location=set{unset,outside}; host=set{windows,container}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched environment are the outcome."""
delivered_with = ["SR-139", "SR-094"]
form = "interface"

[requirement.SR-141]
title = "A restore target whose real location cannot be established is refused"
sn_refs = ["SN-042"]
boundary_refs = ["B-14", "B-17", "B-15"]
hat_refs = ["SECURITY"]
requirement = """If the restore target's real location cannot be resolved, or its path holds a parent-folder component, then the restore kit shall refuse before writing anything, with exit code 2."""
rationale = """Derived through SECURITY: SN-042 asks that a restore never write into its backup or outside the chosen target, and SR-009 and SR-121 can keep that promise only for a target whose real location is known. A target that cannot be resolved cannot be shown to lie outside the backup, and a parent-folder component is reduced differently by different tools, so where the writes land would depend on the restore host. Reducing the path and proceeding lost: the restorer would get files back where they did not ask."""
acceptance_criteria = """A target that cannot be resolved, and a target path holding a parent-folder component, are each refused with exit code 2 and the reason, nothing is written, and the refusal is never reported as content, record or host damage; the same target written without the parent-folder component restores normally."""
permutations = """target=set{unresolvable,parent-component,plain}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched target are the outcome."""
delivered_with = ["SR-009", "SR-121"]
form = "interface"

[requirement.SR-142]
