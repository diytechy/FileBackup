[requirement.SR-075]
title = "A run after a dead interrupted run proceeds by itself when nothing would be lost"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-04"]
hat_refs = ["INTEGRITY-RECOVERABILITY", "UNATTENDED-OPS"]
requirement = "When a later run obtains exclusive use after an interrupted run, the system shall recover disposable incomplete work and continue automatically wherever the surviving records and content permit safe continuation."
rationale = "A killed run must not permanently block unattended backups. Owner-death release supplies admission; elapsed age or a stopped heartbeat is neither required nor sufficient to reclaim a live suspended holder."
acceptance_criteria = "Kill a run at each persistence/publication stage. Once ownership is released, the next admitted run handles disposable leftovers and preserves published recoverable progress without a stale-time delay. It completes where inputs remain usable; blockers follow SR-017. A suspended holder retains ownership and a competing mutation is refused."
