sn_refs = ["SN-001", "SN-036"]
boundary_refs = ["B-01", "B-02"]
hat_refs = ["PERFORMANCE"]
requirement = "When a folder link or junction resolves to a supported directory within its configured source root, the system shall record the link and its destination within that root without traversing the target again through the link."
rationale = "An in-root link can be recreated relative to its restored parent without depending on the original drive or mount path. Capturing its target through every alias would lose link identity and multiply restored data. Containment is based on resolved destinations, not a textual path prefix; a relative path can still escape the root. Traversal cycles encountered while following the separately proposed external-link policy must also terminate without repeated capture."
acceptance_criteria = "Exercise relative and absolute source links to sibling, descendant and ancestor directories within the configured root, including a link back to the root. Each supported link records an unambiguous destination within that root; target data is captured at its ordinary source path, not again under the alias. A textually internal target that resolves outside the root is not classified as internal. An ancestor cycle encountered in an externally followed tree is not traversed again; if its destination cannot be mapped within the configured source root, it is reported as unsupported for portable link recreation. Unresolvable destinations are reported rather than guessed."
permutations = "link=set{folder-symlink,junction}; spelling=set{relative,absolute}; destination=set{sibling,descendant,ancestor,root,outside-via-alias,unresolvable}; @pairwise"
priority = "M"
