# System requirements: owner-approved, 2026-11-05.
# Approval: docs/plans/spine-rebaseline-2026-11-05/sr-approval.md.
# docs/plans/spine-rebaseline-2026-11-05/sr-generation-review.md records legacy
# dispositions, policy proposals and independent DeepSeek review. LLRs, tests and
# implementation links remain legacy evidence to reconcile during decomposition.
# Acceptance records the specified targets, not implementation conformance.

[requirement.SR-001]
title = "Every file in a source tree is captured"
sn_refs = ["SN-001"]
boundary_refs = ["B-01", "B-13"]
requirement = "When a run ends for a source, the system shall have either recorded in that source's latest state or named in the run's record as not captured every file in the source tree outside the declared exclusions, hidden, system and dot-named files and files nested anywhere that share a name with the backup's own files included."
rationale = "Silent omission is found only when recovery is needed. SR-074 defines the exclusions; unreadable or unsupported entries must be identified rather than counted as captured. A familiar infrastructure name alone is not an exclusion."
acceptance_criteria = "After one run against a known tree, every file of the tree outside the declared exclusions, including dot-named files, nested dot-named folders, hidden and system files and folders at any depth, and nested files whose names match the backup's own files, is either restored from the latest state or named in the run's record as not captured, with compression on and off; any such file neither restored nor named is a failure. With every file of the domain readable and portably named, every one restores and the run reports complete; a file named as not captured makes the run report part failed."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-04"]
delivered_with = ["SR-074", "SR-088", "SR-089", "SR-137", "SR-150", "SR-151"]
form = "assumption"

[requirement.SR-003]
title = "Identical content is stored once"
sn_refs = ["SN-002"]
boundary_refs = ["B-02", "B-13"]
requirement = "The system shall store content with identical bytes once in a backup, however many files, folders, runs or saved states contain it."
rationale = "Storing each copy again multiplies the space the backup costs with no gain in what restores. Deduplicating by name or path lost: it misses renamed and copied files. Deduplicating only against earlier runs lost too: files first seen together in one run are among the commonest duplicates."
acceptance_criteria = "Two files with identical bytes, under different names or extensions, in the same folder or different folders, first seen together in one run or in different runs and saved states, add the space of one stored copy, and each restores byte-exact, with compression on and off."
permutations = "placement=set{same-folder,different-folder,same-run,different-run,different-saved-state}; size=range[0..4GiB]; compress=bool; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-05"]
form = "assumption"
delivered_with = ["SR-056", "SR-059", "SR-108"]
hat_refs = ["SHARED-CONTENT"]

[requirement.SR-005]
title = "A changing run keeps the previous state as a dated saved state"
sn_refs = ["SN-004"]
boundary_refs = ["B-02", "B-13"]
requirement = "When a run changes the backed-up state of a source, the system shall preserve the preceding recorded state with its completion-date label and a distinct selectable identity, alongside latest."
rationale = "Without earlier states the backup faithfully copies a mistake and the good version is gone; keeping only the latest state lost. A change is any difference from the previous state's record, including a file added only as a duplicate of content already stored and a removed file whose content other files still share: either supersedes the previous state although no new content is written."
acceptance_criteria = "After several runs with changes between them, each earlier state is listed by its date in order and restores exactly as it was, and the latest state is present. A run whose only change is an added duplicate, a removed file whose content is still shared, or a changed modification time also keeps a saved state. Two states completed within the same second receive distinct identifiers. Equal dates and clock rollback do not overwrite a state or make selection ambiguous: retain a distinct selectable identity and explain the displayed date/disambiguator."
permutations = "runs=range[2..20]; change_kind=set{add,edit,remove,rename,duplicate-only-add,shared-content-remove,time-only}; compress=bool; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-16"]
delivered_with = ["SR-041", "SR-100"]
form = "assumption"
hat_refs = ["FILESYSTEM-SEMANTICS"]

[requirement.SR-007]
title = "Every state in a backup carries a restore kit"
sn_refs = ["SN-005"]
boundary_refs = ["B-13"]
requirement = "The system shall carry the PowerShell and bash recovery scripts, their required bundled components, guidance and notices with each latest or saved state, so that the complete store can be recovered independently of the backup executable."
rationale = "A future restorer may have only the handed-off store. A state folder can depend on shared content elsewhere in that store; bundling scripts does not promise recovery of retention-invalidated history."
acceptance_criteria = "Hand off a coherent complete store to a clean supported host. With only the documented recovery tools installed and no engine, repository or network, recover latest and each in-window saved state. Each state carries the recovery routes and required accompanying material."
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-10", "DA-19"]
delivered_with = ["SR-008", "SR-118"]
form = "assumption"
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
hat_refs = ["CROSS-PLATFORM", "INTEGRITY-RECOVERABILITY", "STORE-FORMAT-COMPATIBILITY"]

[requirement.SR-008]
title = "A restore needs only the documented tool floor and downloads nothing"
sn_refs = ["SN-005", "SN-022"]
boundary_refs = ["B-18"]
requirement = "The system shall document the local prerequisite tools and supported versions for each carried PowerShell or bash recovery route and perform recovery without network access once those prerequisites are available."
rationale = "Offline recovery must not depend on downloading the engine or a package during a disaster. Provisioning beforehand may use online sources or offline media; a missing interpreter cannot run its own diagnostic."
acceptance_criteria = "The delivered guidance identifies each route, supported host/tool versions and provisioning instructions, including the shell itself. On a provisioned supported host, disable all network access and recover a compressed and raw-content fixture using only the complete store and local tools."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-10", "DA-18", "DA-19"]
delivered_with = ["SR-007", "SR-031", "SR-071", "SR-118", "SR-156"]
form = "assumption"
hat_refs = ["CROSS-PLATFORM"]

[requirement.SR-009]
title = "A restore target inside the backup is refused"
sn_refs = ["SN-042"]
boundary_refs = ["B-17", "B-15"]
hat_refs = ["SECURITY"]
requirement = "If the restore target lies inside the backup folder, directly or through a link, then the restore kit shall refuse before writing anything."
rationale = "A restorer under stress may pick the wrong folder; writing into the backup can destroy the content being restored. Checking the path as typed lost: a link makes an outside-looking path land inside the backup."
acceptance_criteria = "Targets equal to the backup folder, inside it, and reaching it through a link are each refused with the documented refusal result and the backup is byte-identical; a target outside the backup, including a sibling folder whose name begins with the backup folder's name, restores normally."
permutations = "target=set{equal,inside,via-link,prefix-sibling,outside}; restorer=set{windows,linux,macos}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
delivered_with = ["SR-121", "SR-141", "SR-145"]
form = "interface"

[requirement.SR-010]
title = "A restore reproduces exactly the chosen state"
sn_refs = ["SN-006"]
boundary_refs = ["B-14", "B-16"]
requirement = "When recovery starts, the recovery route shall reconstruct the recorded captured state selected by the restorer, or the latest recorded state when none is selected, without substituting later source versions."
rationale = "History exists to get back what was there before a mistake; a restore that mixes in newer content brings the mistake back."
acceptance_criteria = "For each available in-window state, recovered paths, bytes and metadata match that selected record, including after later edits, additions and removals. Default selection is latest. An interrupted run may have checkpointed a mixture of captured versions under SR-082; no whole-source atomic instant is implied. Missing required content is reported rather than replaced by different newer content."
permutations = "state=set{latest,oldest,middle}; later_change=set{edit,remove,add}; compress=bool; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
form = "interface"
coincident = "The stated boundary result directly supplies the cited need; verification remains required."

[requirement.SR-011]
title = "The re-read schedule decides deterministically when unchanged-looking files are re-read"
sn_refs = ["SN-007"]
boundary_refs = ["B-05", "B-07", "B-01"]
requirement = "The system shall re-read for change detection the content of a file whose size and modification time are unchanged on exactly the runs its source's re-read schedule makes due, and on no others."
rationale = "Re-reading everything every run can overrun the backup window; never re-reading trusts size and time completely. The owner, not the tool, picks the point on that trade-off, and the choice is useless unless it decides the same way every time. Periods are counted from the last completed full re-read, so an interrupted re-read does not reset the clock. The schedule governs only reads made to detect change: reads a run needs to capture new content or to store lost content again (SR-053) are outside it. The names of the schedule settings and their calendar meaning belong to the configuration interface."
acceptance_criteria = "For each schedule and each elapsed time since the last completed full re-read, whether a run re-reads unchanged-looking files to detect change is decided the same way every time: an every-run schedule always re-reads, a never schedule never does, and a periodic schedule re-reads on the first run at or after its period has elapsed since the last completed full re-read; a re-read interrupted before it completes does not count as completed. Reads made to capture new content or to store lost content again happen whatever the schedule."
permutations = "schedule=set{every-run,periodic,never}; elapsed=range[0..400d]; last_reread_interrupted=bool; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
da_refs = ["DA-14", "DA-16"]
delivered_with = ["SR-105"]
form = "assumption"

[requirement.SR-014]
title = "One location's failure does not stop the others"
sn_refs = ["SN-009"]
boundary_refs = ["B-02", "B-08"]
requirement = "If one configured location fails during a run, then the system shall still back up every other location and report the run as a whole failed."
rationale = "Aborting all locations over one leaves good data unprotected for an unrelated reason; reporting success because most worked hides the failure."
acceptance_criteria = "With one of three configured sets made to fail after configuration admission, attempt the other two independently and recover their captured data. The overall result is non-success under the documented mixed-result precedence of SR-043. Invalid configuration is refused as a whole under SR-018 before any set mutates a backup."
permutations = "failing_position=set{first,middle,last}; @full"
priority = "M"
verification = "Test"
status = "Approved"
delivered_with = ["SR-095"]
form = "interface"
hat_refs = ["UNATTENDED-OPS"]

[requirement.SR-015]
title = "Where notification is set up, each run's outcome is sent"
sn_refs = ["SN-010"]
boundary_refs = ["B-09"]
requirement = "Where notification is set up and is not switched off for the run, the system shall send a message stating success or failure after each run."
rationale = "For scheduled runs the owner wants to know without checking logs; switching it off for one run serves a manual run the owner is watching."
acceptance_criteria = "With notification set up, a message stating the run's outcome reaches the relay after each run; with it not set up, or switched off for the run, none is sent and the run proceeds."
permutations = "configured=bool; switched_off_for_run=bool; outcome=set{success,failure}; @full"
priority = "C"
verification = "Test"
status = "Approved"
da_refs = ["DA-09"]
delivered_with = ["SR-127"]
form = "assumption"

[requirement.SR-016]
title = "An operation started without an interactive session never prompts"
sn_refs = ["SN-011"]
boundary_refs = ["B-07", "B-08", "B-14", "B-15"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "If an operation is started non-interactively, with its input redirected or closed, or with no console and no desktop session, then the system shall complete or fail without asking anything, reporting a failure with the reason where an answer would have been needed."
rationale = "A scheduled task that hangs on a prompt is a silent backup failure that may also block the next run. Whether a person is present cannot be observed; how the operation was launched and what input and session it has can, so those are the trigger. This row is the one home for asking nothing; SR-073 adds only what a restore started without a target does."
acceptance_criteria = "A backup, a removal, a check, a repair, a kit refresh and a restore each started non-interactively, with input redirected, and with no console and no desktop, finish without waiting, including when a required component has to be obtained (SR-132); one that needed an answer reports a failure outcome naming the reason."
permutations = "operation=set{backup,removal,check,repair,kit-refresh,restore}; start=set{non-interactive,redirected-input,closed-input,no-console-no-desktop}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
form = "interface"
delivered_with = ["SR-073"]

[requirement.SR-017]
title = "Unsafe interrupted work is preserved and its blocker reported"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-06", "B-08"]
requirement = "If surviving state from an interrupted operation cannot be safely continued under the documented recovery rules, then the system shall stop the changing operation, preserve the recoverable content and report the blocker and remedy."
rationale = "Leftovers are not by themselves proof of damage or a live owner. Automatic continuation is SR-075; this row covers an identifiable blocker such as a malformed latest record or unresolved interrupted removal, without requiring witness files or stale-heartbeat inference."
acceptance_criteria = "Exercise disposable incomplete work, an unreadable latest record and an interrupted removal requiring resumption. Disposable work is handled by SR-075; each blocker produces a non-success result naming the affected state and available remedy, without destroying previously recoverable content."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
delivered_with = ["SR-075", "SR-082", "SR-086", "SR-158"]
form = "assumption"
da_refs = ["DA-01", "DA-02"]
hat_refs = ["INTEGRITY-RECOVERABILITY", "UNATTENDED-OPS"]

[requirement.SR-018]
title = "A wrong or missing configuration is refused before any backup is touched"
sn_refs = ["SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "If the configuration is missing, or has a retired or unknown key, a value of the wrong kind, a missing required setting, or an unsupported description version, then the system shall refuse the run before any backup data is touched, naming the setting and what was expected, with the configuration-refused outcome, creating and changing nothing."
rationale = "A mistyped key or a quoted \"false\" where a yes-or-no belongs silently changes what the owner asked for, including disarming a safety setting. Coercing or ignoring lost. A retired setting ignored in silence would leave an old configuration meaning something it no longer does."
acceptance_criteria = "Each fault in turn refuses with the documented refusal result, the message names the setting and the expected kind or value (a retired setting by its name, as retired), no backup, saved state, log folder or listing is created or changed, and an existing log is not truncated."
permutations = "fault=set{missing-file,unknown-key,retired-key,wrong-type,quoted-boolean,missing-required,version-too-old,version-too-new,non-integer-version}; @full"
priority = "M"
verification = "Test"
status = "Approved"
form = "interface"
delivered_with = ["SR-063", "SR-123", "SR-126", "SR-138", "SR-154"]

[requirement.SR-019]
title = "A missing required component or unsupported runtime stops the run first"
sn_refs = ["SN-015"]
boundary_refs = ["B-10", "B-06", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "If a required host capability or separately installed tool for the selected backup action is absent or unsupported, then the system shall refuse before changing the backup and name the missing prerequisite and how to obtain it."
rationale = "A missing prerequisite must be distinguishable from damaged backup content. Embedded engine libraries are part of the delivered executable, not an excuse to require a language runtime from the owner."
acceptance_criteria = "For each declared required capability/tool, remove it or supply an unsupported version and invoke an action that needs it. The action changes no backup, returns non-success and identifies the prerequisite and installation or support guidance. An optional extra follows SR-133."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
delivered_with = ["SR-099", "SR-126", "SR-132", "SR-133"]
form = "assumption"
da_refs = ["DA-18"]

[requirement.SR-021]
title = "File names restore exactly"
sn_refs = ["SN-032"]
boundary_refs = ["B-01", "B-16"]
hat_refs = ["CROSS-PLATFORM", "FILESYSTEM-SEMANTICS"]
requirement = "Where a recorded name is representable distinctly on the supported target, the recovery route shall reproduce that name without loss or substitution."
rationale = "Text quoting, encoding and host normalization can turn a valid name into another name. Unrepresentable names and collisions require explicit handling under SR-055/092 rather than a universal naming promise."
acceptance_criteria = "Across supported writer/reader/target combinations, Unicode, spaces, brackets, parentheses and mixed-case names return unchanged where representable. Invalid names and case or normalization collisions are reported without silent merging; unaffected entries restore."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-08"]
form = "assumption"
delivered_with = ["SR-055", "SR-092"]

[requirement.SR-023]
title = "Restore reports a known capacity shortfall before target writes"
sn_refs = ["SN-019"]
boundary_refs = ["B-17", "B-15"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = "If the measured target capacity is below the documented restore-demand estimate, then the recovery route shall refuse before writing restored entries and report the estimate, available capacity and shortfall."
rationale = "Expansion can require more space than stored bytes. Estimates must account for the declared allocation and temporary-work model; capacity is not reserved and later exhaustion is handled by SR-158."
acceptance_criteria = "With measurable target capacity, raw and compressed fixtures use expanded output plus documented allocation, metadata and temporary-work allowances, counted once per actual volume. A known shortfall refuses before target writes. Unknown capacity is reported as unknown, never as sufficient; sufficient estimated capacity does not claim writes cannot later fail."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-06"]
form = "assumption"
delivered_with = ["SR-052", "SR-145", "SR-158"]

[requirement.SR-024]
title = "An unchanged source reports no changes and leaves the latest state as it was"
sn_refs = ["SN-021"]
boundary_refs = ["B-02", "B-06"]
requirement = "When a run over an unchanged source needs no content repair, the system shall leave the latest state semantically unchanged and report no additions, changes or removals."
rationale = "An unchanged run should not fabricate history because ordering or serialization varied. Restoring externally lost content is separate from a source change; a changed recovery representation does not by itself establish a new source state."
acceptance_criteria = "Repeat runs over unchanged sources with compression on and off and no repair needed: state paths, content identities and recorded metadata are unchanged, reported change counts are zero, and SR-100 adds no saved state. A run that repairs lost bytes reports that repair distinctly."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "S"
verification = "Test"
status = "Approved"
delivered_with = ["SR-100"]
form = "interface"

[requirement.SR-027]
title = "Shipped guidance takes a new user to a first backup"
sn_refs = ["SN-012"]
boundary_refs = ["B-23"]
requirement = "The system shall ship quick-start guidance and a configuration helper with which a new user on a supported host builds a configuration and completes a first backup."
rationale = "A tool that can only be configured by reading its code is set up wrongly or not at all. Spanning delivery and operation on purpose: the guidance crosses at delivery and is judged by the first backup it leads to."
acceptance_criteria = "A user new to the tool, following only the shipped quick-start guidance and its configuration helper on a supported host, builds a configuration the launch checks accept and completes a first backup with the complete outcome."
priority = "S"
verification = "Demonstration"
status = "Approved"
delivered_with = ["SR-132"]
form = "interface"

[requirement.SR-029]
title = "A partial restore still restores every other file"
sn_refs = ["SN-053"]
boundary_refs = ["B-02", "B-16"]
requirement = "If some recorded content of a state cannot be restored in a restore that has passed admission (SR-145), then the restore kit shall still restore every other file of that state."
rationale = "A restore that stops at the first problem throws away what could be saved; per-file continuation wins over abandoning the whole tree. Continuation applies only after admission: a whole-restore refusal stops before any write (SR-145)."
acceptance_criteria = "With the stored content of some files missing, damaged beyond recovery, or failing to expand, at the first, a middle and the last position of the state, every other file restores byte-exact. With content missing and the target lacking space together, nothing is written and the restore reports the documented refusal result (SR-145)."
permutations = "damage=set{missing,corrupt,expand-fails,mixed}; failure_position=set{first,middle,last}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
da_refs = ["DA-18", "DA-19"]
delivered_with = ["SR-092", "SR-119", "SR-120", "SR-145", "SR-146", "SR-158"]
form = "assumption"

