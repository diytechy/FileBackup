# System requirements (SR-###): FileBackup's system-requirement tier.
#
# Composed from the round-2 merged tier, with the Owner's rulings of 2026-10-17,
# the coordinator's calls and every review disposition applied (see
# docs/plans/spine-restructure/derive/r2-dispositions.md and r2-final-notes.md).
# Rows carrying a legacy id keep it; SR-088 to SR-136 were new at the merge, and
# SR-137 onward were added by the dispositions. All rows are Drafted.


[requirement.SR-001]
title = "Every file in a source tree is captured"
sn_refs = ["SN-001"]
boundary_refs = ["B-01", "B-13"]
requirement = """When a run completes for a source, the system shall have recorded in that source's latest state every file in the source tree, hidden, system and dot-named files and files nested anywhere that share a name with the backup's own files included, apart from the declared exclusions."""
rationale = """Without it a file can be left out silently and is found missing only when it is needed. Skipping hidden or system files as noise lost: for a backup, capturing too much is recoverable and capturing too little is not. What is left out on purpose is SR-074's, and links and junctions inside a source are SR-137's."""
acceptance_criteria = """After one run against a known tree, a restore of the latest state yields every file of the tree outside the declared exclusions, including dot-named files, nested dot-named folders, hidden and system files and folders at any depth, and nested files whose names match the backup's own files, with compression on and off; any file absent from the restore is a failure."""
permutations = """file_kind=set{ordinary,hidden,system,dot-named,nested-dot-folder,nested-own-file-name}; depth=range[0..32]; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-04"]
delivered_with = ["SR-074", "SR-089", "SR-137"]
form = "assumption"

[requirement.SR-003]
title = "Identical content is stored once"
sn_refs = ["SN-002"]
boundary_refs = ["B-02", "B-13"]
requirement = """The system shall store content with identical bytes once in a backup, however many files, folders, runs or saved states contain it."""
rationale = """Storing each copy again multiplies the space the backup costs with no gain in what restores. Deduplicating by name or path lost: it misses renamed and copied files. Deduplicating only against earlier runs lost too: files first seen together in one run are among the commonest duplicates."""
acceptance_criteria = """Two files with identical bytes, under different names or extensions, in the same folder or different folders, first seen together in one run or in different runs and saved states, add the space of one stored copy, and each restores byte-exact, with compression on and off."""
permutations = """placement=set{same-folder,different-folder,same-run,different-run,different-saved-state}; size=range[0..4GiB]; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-05"]
form = "assumption"

[requirement.SR-005]
title = "A changing run keeps the previous state as a dated saved state"
sn_refs = ["SN-004"]
boundary_refs = ["B-02", "B-13"]
requirement = """When a run changes the backed-up state of a source, the system shall keep the previous state as a complete saved state identified by the date that state was completed, alongside the latest state."""
rationale = """Without earlier states the backup faithfully copies a mistake and the good version is gone; keeping only the latest state lost. A change is any difference from the previous state's record, including a file added only as a duplicate of content already stored and a removed file whose content other files still share: either supersedes the previous state although no new content is written."""
acceptance_criteria = """After several runs with changes between them, each earlier state is listed by its date in order and restores exactly as it was, and the latest state is present. A run whose only change is an added duplicate, a removed file whose content is still shared, or a changed modification time also keeps a saved state. Two states completed within the same second receive distinct identifiers."""
permutations = """runs=range[2..20]; change_kind=set{add,edit,remove,rename,duplicate-only-add,shared-content-remove,time-only}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-16"]
delivered_with = ["SR-100"]
form = "assumption"

[requirement.SR-007]
title = "Every state in a backup carries a restore kit"
sn_refs = ["SN-005"]
boundary_refs = ["B-13"]
requirement = """The system shall place, with the latest state and with each saved state, a restore kit able to restore that state on a machine that has never had FileBackup."""
rationale = """A backup that only the tool that made it can restore is hostage to that tool existing at the moment of disaster."""
acceptance_criteria = """The backup folder, copied whole to a machine that has never had FileBackup, restores the latest state and every saved state from the kits it carries."""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-19"]
delivered_with = ["SR-008"]
form = "assumption"

[requirement.SR-008]
title = "A restore needs only the documented tool floor and downloads nothing"
sn_refs = ["SN-005", "SN-022"]
boundary_refs = ["B-18"]
requirement = """The restore kit shall restore using only the documented restore-tool floor, with nothing downloaded at restore time."""
rationale = """A restore that fetches anything depends on a network and a source that may be gone; one that needs uncommon tools fails on the machine at hand."""
acceptance_criteria = """With network access removed and only the documented floor installed, a restore of the latest state, including compressed content and files whose stored copy must be found elsewhere in the backup, produces a tree byte-identical to the source at that run."""
permutations = """restore_system=set{windows,linux,macos}; route=set{shell-tools,language-runtime}; compressed_content=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-10", "DA-18"]
delivered_with = ["SR-007"]
form = "assumption"

[requirement.SR-009]
title = "A restore target inside the backup is refused"
sn_refs = ["SN-042"]
boundary_refs = ["B-17", "B-15"]
hat_refs = ["SECURITY"]
requirement = """If the restore target lies inside the backup folder, directly or through a link, then the restore kit shall refuse before writing anything."""
rationale = """A restorer under stress may pick the wrong folder; writing into the backup can destroy the content being restored. Checking the path as typed lost: a link makes an outside-looking path land inside the backup."""
acceptance_criteria = """Targets equal to the backup folder, inside it, and reaching it through a link are each refused with exit code 2 and the backup is byte-identical; a target outside the backup, including a sibling folder whose name begins with the backup folder's name, restores normally."""
permutations = """target=set{equal,inside,via-link,prefix-sibling,outside}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched backup are the outcome."""
delivered_with = ["SR-121", "SR-141"]
form = "interface"

[requirement.SR-010]
title = "A restore reproduces exactly the chosen state"
sn_refs = ["SN-006"]
boundary_refs = ["B-14", "B-16"]
requirement = """When a restore is started, the restore kit shall rebuild exactly the saved state chosen, or the latest state when none is chosen, with nothing from a newer state mixed in."""
rationale = """History exists to get back what was there before a mistake; a restore that mixes in newer content brings the mistake back."""
acceptance_criteria = """Restoring each saved state yields a tree byte-identical to the source at that state's run, with no file added, changed or removed since; restoring without a choice yields the latest state."""
permutations = """state=set{latest,oldest,middle}; later_change=set{edit,remove,add}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restored tree is the outcome."""
form = "interface"

[requirement.SR-011]
title = "The re-read schedule decides deterministically when unchanged-looking files are re-read"
sn_refs = ["SN-007"]
boundary_refs = ["B-05", "B-07", "B-01"]
requirement = """The system shall re-read for change detection the content of a file whose size and modification time are unchanged on exactly the runs its source's re-read schedule makes due, and on no others."""
rationale = """Re-reading everything every run can overrun the backup window; never re-reading trusts size and time completely. The owner, not the tool, picks the point on that trade-off, and the choice is useless unless it decides the same way every time. Periods are counted from the last completed full re-read, so an interrupted re-read does not reset the clock. The schedule governs only reads made to detect change: reads a run needs to capture new content or to store lost content again (SR-053) are outside it. The names of the schedule settings and their calendar meaning belong to the configuration interface."""
acceptance_criteria = """For each schedule and each elapsed time since the last completed full re-read, whether a run re-reads unchanged-looking files to detect change is decided the same way every time: an every-run schedule always re-reads, a never schedule never does, and a periodic schedule re-reads on the first run at or after its period has elapsed since the last completed full re-read; a re-read interrupted before it completes does not count as completed. Reads made to capture new content or to store lost content again happen whatever the schedule."""
permutations = """schedule=set{every-run,periodic,never}; elapsed=range[0..400d]; last_reread_interrupted=bool; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-16"]
delivered_with = ["SR-105"]
form = "interface"

[requirement.SR-014]
title = "One location's failure does not stop the others"
sn_refs = ["SN-009"]
boundary_refs = ["B-02", "B-08"]
requirement = """If one configured location fails during a run, then the system shall still back up every other location and report the run as a whole failed."""
rationale = """Aborting all locations over one leaves good data unprotected for an unrelated reason; reporting success because most worked hides the failure."""
acceptance_criteria = """With one of three locations made to fail, the other two complete and restore, and the run reports the part-failed outcome."""
permutations = """failing_position=set{first,middle,last}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The completed backups and the outcome are the result."""
delivered_with = ["SR-095"]
form = "interface"

[requirement.SR-015]
title = "Where notification is set up, each run's outcome is sent"
sn_refs = ["SN-010"]
boundary_refs = ["B-09"]
requirement = """Where notification is set up, the system shall send a message stating success or failure after each run, unless notification was switched off for that run."""
rationale = """For scheduled runs the owner wants to know without checking logs; switching it off for one run serves a manual run the owner is watching."""
acceptance_criteria = """With notification set up, a message stating the run's outcome reaches the relay after each run; with it not set up, or switched off for the run, none is sent and the run proceeds."""
permutations = """configured=bool; switched_off_for_run=bool; outcome=set{success,failure}; @full"""
priority = "C"
verification = "Test"
status = "Drafted"
da_refs = ["DA-09"]
delivered_with = ["SR-127"]
form = "assumption"

[requirement.SR-016]
title = "An operation started without an interactive session never prompts"
sn_refs = ["SN-011"]
boundary_refs = ["B-07", "B-08", "B-14", "B-15"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If an operation is started non-interactively, with its input redirected or closed, or with no console and no desktop session, then the system shall complete or fail without asking anything, reporting a failure with the reason where an answer would have been needed."""
rationale = """A scheduled task that hangs on a prompt is a silent backup failure that may also block the next run. Whether a person is present cannot be observed; how the operation was launched and what input and session it has can, so those are the trigger. This row is the one home for asking nothing; SR-073 adds only what a restore started without a target does."""
acceptance_criteria = """A backup, a removal, a check, a repair, a kit refresh and a restore each started non-interactively, with input redirected, and with no console and no desktop, finish without waiting, including when a required component has to be obtained (SR-132); one that needed an answer reports a failure outcome naming the reason."""
permutations = """operation=set{backup,removal,check,repair,kit-refresh,restore}; start=set{non-interactive,redirected-input,closed-input,no-console-no-desktop}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Finishing without waiting is the outcome."""
form = "cross-cutting"

[requirement.SR-017]
title = "A run that cannot tell it is safe refuses and says what it found"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-06", "B-08"]
requirement = """If a run finds traces of an earlier run and cannot tell from the backup alone that the earlier run is dead and that proceeding loses nothing, then the system shall refuse before changing anything and name what it found."""
rationale = """A later run that builds on half-finished work can destroy the only copy of saved content; guessing that it is safe lost. Uncertainty favours keeping the leftovers: a refused run costs one night, a wrong clean-up costs history."""
acceptance_criteria = """With an earlier run's unfinished work that may hold content (hidden, system and dot-named content included), with the unfinished work of a removal that did not complete, with an earlier run alive or not proven dead, with unfinished work reached through a link or other redirection, or with evidence that cannot be read, the next run moves and deletes nothing, publishes no saved state, is refused as not ready (value 2, SR-043), and its message names what was found. Where the unfinished work is a removal's, the message names the remedy, re-running that removal, which completes it (SR-101), after which backups proceed. Unfinished work that holds no content does not by itself cause the refusal. When a safe clean-up of reclaimable unfinished work fails, it is kept and the message gives recovery guidance."""
permutations = """leftover=set{may-hold-content,removal-unfinished,owner-alive,owner-unproven,linked,unreadable-evidence,holds-no-content}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched store are the outcome."""
delivered_with = ["SR-075"]
form = "interface"

[requirement.SR-018]
title = "A wrong or missing configuration is refused before any backup is touched"
sn_refs = ["SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If the configuration is missing, or has a retired or unknown key, a value of the wrong kind, a missing required setting, or an unsupported description version, then the system shall refuse the run before any backup data is touched, naming the setting and what was expected, with the configuration-refused outcome, creating and changing nothing."""
rationale = """A mistyped key or a quoted "false" where a yes-or-no belongs silently changes what the owner asked for, including disarming a safety setting. Coercing or ignoring lost. A retired setting ignored in silence would leave an old configuration meaning something it no longer does."""
acceptance_criteria = """Each fault in turn refuses with exit code 2, the message names the setting and the expected kind or value (a retired setting by its name, as retired), no backup, saved state, log folder or listing is created or changed, and an existing log is not truncated."""
permutations = """fault=set{missing-file,unknown-key,retired-key,wrong-type,quoted-boolean,missing-required,version-too-old,version-too-new,non-integer-version}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched environment are the outcome."""
form = "interface"

[requirement.SR-019]
title = "A missing required component or unsupported runtime stops the run first"
sn_refs = ["SN-015"]
boundary_refs = ["B-10", "B-06", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If the runtime is unsupported, or a required component or a tool a chosen setting needs is still missing once any permitted fetch has been tried, then the system shall refuse before changing the backup, naming what is missing and how to obtain it."""
rationale = """A run that proceeds without its content-identity function or the tool its storage setting needs writes a backup that cannot be trusted or restored; failing first costs one run, failing later costs the store. Obtaining a missing component comes first (SR-132); this row decides what happens when that has not made it available. Whether compression off needs the tool at all is SR-096's."""
acceptance_criteria = """With an unsupported runtime, with the hashing component absent and the package source unreachable, and with compression on but the archive tool absent, each run is refused as not ready (value 2, SR-043), the backup is byte-identical, and the message names the missing item and how to obtain it."""
permutations = """missing=set{unsupported-runtime,hashing-component-unobtainable,archive-tool-with-compression}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched backup are the outcome."""
delivered_with = ["SR-132"]
form = "interface"

[requirement.SR-021]
title = "File names restore exactly"
sn_refs = ["SN-032"]
boundary_refs = ["B-01", "B-16"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """The system shall restore every captured file under the exact name it had in the source, Unicode, brackets, parentheses and spaces included, through every restorer."""
rationale = """A file back under another name, or lost to a misread name, is a lost file. Escaping or transliterating names lost: it changes what the owner gets back. A name rule that holds only where the backup was made would break the restore on the other systems the backup promises."""
acceptance_criteria = """Files whose names contain Unicode, brackets, parentheses and spaces, files with no extension and files whose extension contains spaces or non-ASCII characters restore with byte-identical names through each restorer on each supported restore system, and every recorded distinct path stays distinct in the restored tree."""
permutations = """name_feature=set{unicode,brackets,parentheses,spaces,mixed}; extension=set{none,ordinary,with-space,non-ascii}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-08"]
form = "assumption"

[requirement.SR-023]
title = "A restore refuses before writing when its target lacks space"
sn_refs = ["SN-019"]
boundary_refs = ["B-17", "B-15"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = """If a restore's expanded content would not fit in the free space of its target, then the restore kit shall refuse before writing, naming the volume with the space needed and the space free, and report the precondition outcome."""
rationale = """A restore that fills its target leaves a partial tree that looks finished. Counting stored bytes lost: compressed content expands, so the need is the expanded size."""
acceptance_criteria = """With a target whose free space is below the restore's expanded size, nothing is written to the target, the message names the volume, needed and free space, and the restore reports exit code 2, on Windows, Linux and macOS."""
permutations = """need_vs_free=set{below,equal,above}; compress=bool; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-06"]
form = "assumption"

[requirement.SR-024]
title = "An unchanged source reports no changes and leaves the latest state as it was"
sn_refs = ["SN-021"]
boundary_refs = ["B-02", "B-06"]
requirement = """When a run finds no change in a source, the system shall report no added, changed or removed files and leave the record of its latest state identical."""
rationale = """Spurious changes bury real ones and teach the owner to distrust every change the tool reports."""
acceptance_criteria = """Two consecutive runs over an unchanged source leave identical records of the latest state and the second run reports zero added, changed and removed files, with compression on and off and whether or not a full re-read is due."""
permutations = """reread_due=bool; compress=bool; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The report and the unchanged record are the outcome."""
delivered_with = ["SR-100"]
form = "interface"

[requirement.SR-027]
title = "Shipped guidance takes a new user to a first backup"
sn_refs = ["SN-012"]
boundary_refs = ["B-23", "B-05", "B-13"]
requirement = """The system shall ship quick-start guidance and a configuration helper with which a new user on a supported host builds a configuration and completes a first backup."""
rationale = """A tool that can only be configured by reading its code is set up wrongly or not at all. Spanning delivery and operation on purpose: the guidance crosses at delivery and is judged by the first backup it leads to."""
acceptance_criteria = """A user new to the tool, following only the shipped quick-start guidance and its configuration helper on a supported host, builds a configuration the launch checks accept and completes a first backup with the complete outcome."""
priority = "S"
verification = "Demonstration"
status = "Drafted"
coincident = """The first completed backup is the outcome."""
delivered_with = ["SR-132"]
form = "interface"

[requirement.SR-029]
title = "A partial restore still restores every other file"
sn_refs = ["SN-053"]
boundary_refs = ["B-02", "B-16"]
requirement = """If some recorded content of a state cannot be restored, then the restore kit shall still restore every other file of that state."""
rationale = """A restore that stops at the first problem throws away what could be saved; per-file continuation wins over abandoning the whole tree."""
acceptance_criteria = """With the stored content of some files missing, damaged beyond recovery, or failing to expand, at the first, a middle and the last position of the state, every other file restores byte-exact."""
permutations = """damage=set{missing,corrupt,expand-fails,mixed}; failure_position=set{first,middle,last}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-18", "DA-19"]
delivered_with = ["SR-120", "SR-119"]
form = "interface"

[requirement.SR-031]
title = "A restore behaves the same on Windows, Linux and macOS"
sn_refs = ["SN-022"]
boundary_refs = ["B-19", "B-16"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """The restore kit shall restore any state whose names stay distinct on the target to an identical tree on a stock Windows, Linux or macOS machine meeting the documented tool floor, including one without the backup tool's runtime."""
rationale = """The machine at hand after a disaster is often not the one that made the backup. Names that would collide on a target are SR-092's, so this row's promise rests on the names arriving distinct (DA-08)."""
acceptance_criteria = """The same backup, with compression on and off, restores the latest state and a saved state to byte-identical trees on each of the three systems, with the backup runtime absent."""
permutations = """restore_system=set{windows,linux,macos}; state=set{latest,saved}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-08", "DA-10", "DA-18"]
delivered_with = ["SR-008"]
form = "assumption"

[requirement.SR-033]
title = "Backups from Linux and Windows hosts restore through every restorer"
sn_refs = ["SN-023"]
boundary_refs = ["B-13", "B-16"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """The system shall write a backup in the same form whether run from a Linux host or from Windows, so that each restores byte-exact through every restorer."""
rationale = """If each host wrote its own form, moving backup duty would strand history and a restorer would need to know which host made the backup."""
acceptance_criteria = """A backup made from a Linux host and one made from Windows, each with compression on and off, restore byte-exact through each restorer."""
permutations = """backup_host=set{windows,linux-container}; restorer=set{windows,linux,macos}; compress=bool; @pairwise"""
priority = "C"
verification = "Test"
status = "Drafted"
coincident = """The restored tree is the outcome."""
delivered_with = ["SR-136"]
form = "interface"

[requirement.SR-034]
title = "Backups run inside a container with nothing installed on the host"
sn_refs = ["SN-024"]
boundary_refs = ["B-12"]
requirement = """The system shall run backups inside a container that carries the runtime and every required component, so that the host needs none of them installed."""
rationale = """A home server or NAS runs its services as containers and should not need a separate runtime to protect its files."""
acceptance_criteria = """On a host with no backup runtime installed, a containerised run produces a backup with its restore kit that restores byte-exact, using only what the container carries, with compression on and off."""
permutations = """compress=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The completed backup is the outcome."""
delivered_with = ["SR-130", "SR-048", "SR-142"]
form = "interface"

[requirement.SR-035]
title = "A damaged change-detection state never costs a change or stored content"
sn_refs = ["SN-001", "SN-034"]
boundary_refs = ["B-20", "B-01", "B-13", "B-06"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """If a source's change-detection state is missing, unreadable or inconsistent with the backup, then the system shall work out what changed by comparing the source with the backup's own record, and report that the state was rebuilt."""
rationale = """Derived through INTEGRITY-RECOVERABILITY: the change-detection state is a durable artifact outside the backup, and trusting a torn or stale copy would mark changed files unchanged (breaking SN-001's capture of changed files) or removed (breaking SN-034). Treating the backup as new would discard superseded history. Refusing the run until someone repairs the state lost: the backup's own record holds enough to proceed, and an unattended host would otherwise stop backing up."""
acceptance_criteria = """With the change-detection state deleted, truncated, replaced by an older copy, or belonging to another source, the next run compares the source with the backup's own record, captures every file edited since, records no unchanged file as removed, keeps any superseded state as a saved state as for any changing run, completes, and its record says the state was rebuilt."""
permutations = """state_fault=set{missing,truncated,stale,foreign}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The captured content and the record are the outcome."""
form = "interface"

[requirement.SR-036]
title = "A source that suddenly looks empty is refused"
sn_refs = ["SN-038"]
boundary_refs = ["B-01", "B-02", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If a source that held files on the previous run shows none, then the system shall refuse that source as not ready before changing its backup, unless the owner has declared that this source may become empty."""
rationale = """An unattended run cannot tell a dropped drive from a deliberate wipe. Trusting the empty view records every file as deleted. Inferring intent lost; the owner's explicit setting decides."""
acceptance_criteria = """A previously populated source now empty: the backup is byte-identical after the run and the source is refused as not ready (SR-043); with the owner's allow-empty setting on for that source, the run records the removals and keeps the previous state as a saved state; a source empty from its first run is backed up normally."""
permutations = """previous=set{populated,empty-from-first-run}; allow_empty=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The unchanged backup and the not-ready outcome are the delivered result."""
form = "interface"

[requirement.SR-038]
title = "Every record of a state carries evidence of its own completeness"
sn_refs = ["SN-025"]
boundary_refs = ["B-13", "B-02"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """When the system writes or rewrites the record of a state, the system shall write with it matching evidence of that record's completeness, against which a restorer can tell that the record is truncated, partly written, or replaced by a record the evidence does not match."""
rationale = """Derived through INTEGRITY-RECOVERABILITY: SN-025 asks the restore to refuse a damaged or substituted record, but a restorer can detect only what the producer made detectable. A record checked only against the stored content cannot reveal that it has shrunk when content is shared, because every remaining entry still finds its bytes; without producer-side evidence the restore-side refusal (SR-039) is unsatisfiable. Evidence written only for the latest state lost: each saved state is restored on its own and needs its own. A record replaced together with evidence that matches it cannot be told from an authentic pair by the backup alone; the row rests on damage from outside not doing that (DA-11)."""
acceptance_criteria = """For the latest state and every saved state, and after every rewrite of a record by a backup, a removal or a repair, the record has matching completeness evidence of its own; truncating the record, cutting it partway, or replacing it with another state's record while its own evidence stays is detected against that evidence by every restorer."""
permutations = """state=set{latest,saved,rewritten-by-removal,rewritten-by-repair}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-11"]
delivered_with = ["SR-039"]
form = "interface"

[requirement.SR-039]
title = "A restore refuses a damaged or substituted record of contents"
sn_refs = ["SN-025"]
boundary_refs = ["B-13", "B-15"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """If the record of the state being restored is truncated, partly written, replaced by a record its completeness evidence does not match, or in the current form without its completeness evidence, then the restore kit shall refuse before creating the target or writing anything, with exit code 3."""
rationale = """A restore that trusts a shrunken record reproduces a shrunken tree and reports success, and the restorer cannot know files are missing. A current-form record without its evidence is refused too: if missing evidence were read as an older record, deleting the evidence would bypass the check (SR-116 needs positive evidence of age). A record replaced together with matching evidence is outside what the backup alone can show (DA-11)."""
acceptance_criteria = """With the record of the latest state and of a saved state each truncated, partly written, replaced by another state's record, and in the current form with its completeness evidence removed, every restorer exits 3, writes no restore log, and the target does not exist or is unchanged; text that is not a record of contents at all is refused with exit code 2, which takes precedence."""
permutations = """fault=set{truncated,partly-written,replaced,current-form-evidence-missing,not-a-record}; state=set{latest,saved}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-11"]
delivered_with = ["SR-038", "SR-116"]
form = "interface"

[requirement.SR-040]
title = "Every restorer reports the same outcome value per class, with a fixed precedence"
sn_refs = ["SN-026"]
boundary_refs = ["B-15", "B-19"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """When a restore ends, the restore kit shall return one outcome value from the documented classification, the same value for the same failure through every restorer on every supported system."""
rationale = """A host supervising restores must tell "the bytes are gone" from "fix this machine and retry" from "wrong folder"; one generic failure sends a script into retrying over real damage. A fixed precedence is needed so that a mixed failure maps to one value, and a classification true only on the system the backup was made on misleads every other restore host."""
acceptance_criteria = """Values are 0 complete, 1 content missing, 2 bad request or precondition, 3 damaged record of contents, 4 host or tool problem; when several apply, 2 takes precedence over 3, 3 over 4, and 4 over 1. Deliberately induced instances of each class, alone and combined, return their value through every restorer on Windows, Linux and macOS. An incomplete restore reports the count of content failures and of host failures even when one class takes precedence. Content that cannot be produced although the host's tools work is content missing; a failure of the host's tools or storage is a host problem. Two names colliding on the target are content missing (1), an entry whose path would land outside the target is a damaged record (3), and a state recorded before completeness evidence existed, restored with that check reported as not made, is complete (0)."""
permutations = """class=set{complete,content-missing,precondition,damaged-record,host-problem}; combined_with=set{none,content-missing,host-problem}; case=set{induced,name-collision,escaping-entry,unverified-older-record}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The outcome value is itself the outcome."""
form = "interface"

[requirement.SR-041]
title = "Earlier content a run cannot place in the saved state stays restorable, and the run fails"
sn_refs = ["SN-044", "SN-034", "SN-004"]
boundary_refs = ["B-02", "B-06", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If a run cannot place the earlier content of a superseded or removed file in the saved state, then the system shall keep that content in the store so the saved state still restores the file, name the file with the cause in the run's record, and report the run as part failed."""
rationale = """Derived through UNATTENDED-OPS: the needs ask that a run's failures be named (SN-044), that stored content a state depends on is not lost (SN-034) and that a changing run keeps its complete previous state (SN-004), but none says what happens when placing one earlier copy fails partway. Completing a saved state that lacks the file is the loss SN-034 forbids (SR-059); stopping at the first failure leaves every later one unreported; carrying on in silence reports success. The content is still in the store, so the honest result is a complete saved state, a named failure and a failed run, and a saved state missing a file is never published. Capture failures on the source side are SR-089's."""
acceptance_criteria = """With two superseded or removed files whose earlier content cannot be placed in the saved state, the run's record names each with its cause and gives their count, the saved state restores both files byte-exact together with every other file, the run reports the part-failed outcome, and the next run proceeds. Where earlier content cannot be kept restorable at all, no saved state missing it is published, the latest state is left as it was before the run, and the run reports the part-failed outcome."""
permutations = """kind=set{superseded,removed}; failures=range[1..2]; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restorable saved state, the record and the outcome are the delivered result."""
delivered_with = ["SR-059"]
form = "interface"

[requirement.SR-042]
title = "The configuration has a documented, versioned description matching the launch checks"
sn_refs = ["SN-050"]
boundary_refs = ["B-23", "B-05", "B-07", "B-08"]
requirement = """The system shall publish a documented, versioned description of the configuration that accepts and refuses exactly the configurations the launch checks accept and refuse."""
rationale = """A host generating configurations needs a contract it can rely on across versions; a description that drifts from what launch enforces leaves every integrator guessing. A configuration form exempt from the description would be a second, undocumented contract, so every supported form is held to it. The stated version (SR-135) and the credential rule (SR-129) are rows of their own; this row holds the description and the checks to one verdict. Spanning delivery and operation on purpose: the description crosses at delivery and the verdict in operation."""
acceptance_criteria = """For a corpus of valid and invalid configurations in each supported form, the JSON form and the native-Windows form, the published description and the launch checks give the same verdict on every one, and omitted optional settings resolve to their documented defaults."""
permutations = """form=set{json,native-windows}; case=set{valid,unknown-key,wrong-type,missing-required,bad-version}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The agreement between description and checks is the outcome."""
delivered_with = ["SR-134", "SR-135", "SR-123"]
form = "interface"

[requirement.SR-043]
title = "Backups, removals and checks report one of three documented outcomes"
sn_refs = ["SN-045"]
boundary_refs = ["B-08", "B-12"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The system shall end every backup, removal and check with a documented outcome value that is distinct for each of: complete, some part failed, and refused before changing anything because the configuration was refused or the backup was busy or not ready."""
rationale = """A host deciding whether to retry, alert or carry on cannot act if every failure looks the same, and a run that backed up nothing must not look like one that worked. Distinct values only on request lost: a host that forgets to ask gets the ambiguous form. Busy and not ready share the precondition value with a refused configuration, as they do for a restore: each means that nothing was changed and the request can be repeated once the cause is fixed. Busy and not ready apply to the operations that change a backup; a check runs beside them (SR-106)."""
acceptance_criteria = """Without any opt-in, deliberately induced instances of each class for a backup and a removal, and of complete, some part failed and configuration refused for a check, produce 0 complete, 1 some part failed, and 2 refused (configuration refused, busy or not ready); a launch that still makes the former request for distinct values is accepted and gets the same values. For a run covering several locations, the value is 2 only when every location was refused before anything changed, otherwise 1 when any location failed or was refused, and 0 when all completed. The same values come through the container's exit status."""
permutations = """operation=set{backup,removal}; class=set{complete,part-failed,configuration-refused,busy,not-ready}; locations=set{one,several}; host=set{direct,container}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-09"]
form = "interface"

[requirement.SR-045]
title = "Removing a named saved state keeps every other state whole"
sn_refs = ["SN-029"]
boundary_refs = ["B-05", "B-07", "B-02", "B-08"]
hat_refs = ["SHARED-CONTENT"]
requirement = """When the owner asks for a named saved state to be removed, the system shall remove it and leave every remaining saved state and the latest state restorable byte-exact, including when the removed state held the only stored copy of content other states share."""
rationale = """Without it history grows until the volume fills, and removing a state from outside the tool is silent loss of shared content. Retention policy inside the tool lost: the owner or host names what to remove."""
acceptance_criteria = """After removing the oldest, a middle, the newest and the only saved state in turn, including one holding the only copy of content other states share, with compression on and off, every remaining state and the latest state restore byte-exact, and the remaining records list the same files with the same names, lengths, times and content identities as before."""
permutations = """compress=bool; holds_only_copy=bool; position=set{oldest,middle,newest,only}; count=range[1..3]; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Every remaining state restoring is the outcome."""
delivered_with = ["SR-046", "SR-101", "SR-102"]
form = "interface"

[requirement.SR-046]
title = "A removal that would lose content is refused"
sn_refs = ["SN-029"]
boundary_refs = ["B-02", "B-08"]
hat_refs = ["SHARED-CONTENT"]
requirement = """If removing a named saved state would lose content any remaining state needs, or the removal cannot establish that it would not, then the system shall refuse that removal as not ready before changing anything."""
rationale = """Pruning into a store that is already damaged can turn a recoverable problem into a permanent one; removing what it can and reporting the rest lost. A removal that cannot prove its safety is treated as unsafe, because the owner can repeat a refused removal but cannot undo a lossy one."""
acceptance_criteria = """With shared content already missing from the store, with a remaining state's record failing its completeness check, with the named state holding content no record refers to, with the destination volume lacking the space the removal must move, and with compression needed for that move but its tool missing, the removal is refused, the store is byte-identical afterwards, the message names the cause, and the outcome is value 2 (not ready, SR-043)."""
permutations = """cause=set{content-already-missing,record-check-fails,unreferenced-content,no-space,compression-tool-missing}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The untouched store and the outcome are the result."""
delivered_with = ["SR-045"]
form = "interface"

[requirement.SR-047]
title = "The saved-state report gives what each removal would reclaim"
sn_refs = ["SN-046"]
boundary_refs = ["B-06", "B-08"]
hat_refs = ["SHARED-CONTENT"]
requirement = """When asked for the saved-state report, the system shall give for every saved state the space its removal would free and the space that would have to be moved to keep shared content."""
rationale = """With shared content a state's folder size is not what removing it frees, and nobody outside the tool can work out the true figure. Reporting folder sizes lost."""
acceptance_criteria = """For each saved state, the reported freed figure equals the drop in the store's size when that state is then removed, and the moved figure equals the content moved by that removal, with content shared with the latest state, between saved states, and not at all."""
permutations = """sharing=set{none,with-latest,between-saved-states}; states=range[1..3]; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The figures are the outcome the owner or host acts on."""
delivered_with = ["SR-103", "SR-104"]
form = "interface"

[requirement.SR-048]
title = "Removal and the saved-state report can be run through the container"
sn_refs = ["SN-024"]
boundary_refs = ["B-12", "B-08"]
requirement = """Where backups run inside the container, the system shall accept a request for a removal or for the saved-state report through the container and return the same outcome values and findings as when started directly."""
rationale = """A host that runs backups in a container also decides retention there (SN-024): it must be able to ask what each removal would reclaim and then remove a state in one-shot container runs, reading the same outcome values it reads for a backup. Without it, retention needs the runtime installed on the host, which is what running in a container avoids."""
acceptance_criteria = """In a container on a host with no backup runtime, the saved-state report returns its machine-readable findings with the complete outcome and changes nothing; a valid removal completes with the complete outcome and every remaining state restores byte-exact; a removal naming an unknown state is refused with value 2 and nothing changed; each outcome equals that of the same request started directly."""
permutations = """action=set{removal,report}; request=set{valid,unknown-state}; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The container's returned outcome and findings are the result the host acts on."""
delivered_with = ["SR-034", "SR-142"]
form = "interface"

[requirement.SR-049]
title = "A check reports every disagreement between the record and what is stored"
sn_refs = ["SN-030"]
boundary_refs = ["B-05", "B-07", "B-06", "B-08"]
requirement = """When the owner asks for a check, the system shall report, for the latest state and every saved state, each file whose stored content is missing, altered, or in a form other than its record says, with the kind of problem, and report failure when there is any."""
rationale = """The record of how each file was stored is kept apart from the bytes; unless something compares them a wrong record or a lost file stays invisible until a restore fails. A check confined to the latest state lost: saved states are what a restore after a mistake depends on."""
acceptance_criteria = """After stored content is deleted, altered, and recorded in the wrong form in the latest state and in a saved state, the check names each affected file and its kind of problem and reports the part-failed outcome (value 1, SR-043); content missing from the whole backup is distinguished from a stored copy missing from its place but present elsewhere in the backup; on an intact backup it reports clean."""
permutations = """damage=set{deleted-everywhere,deleted-here-present-elsewhere,altered,wrong-form,none}; location=set{latest,saved-state}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-11"]
delivered_with = ["SR-103", "SR-104"]
form = "interface"

[requirement.SR-052]
title = "A backup refuses before writing when its destination lacks space"
sn_refs = ["SN-019"]
boundary_refs = ["B-03", "B-06", "B-08"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
requirement = """If a backup's demand for space on a volume, summed over every configured location on that volume, exceeds the volume's free space, then the system shall refuse those locations as not ready before writing, naming the volume with the space needed and the space free."""
rationale = """A backup that fills its volume midway can leave the record and the content out of step. Checking each location alone lost: several locations sharing a volume pass singly and fail together. Treating paths as volumes lost too: a mount and the folders beneath it are one volume. Counting content lengths alone lost: a tree of many small files writes records, kits, logs and temporary copies too, so the demand carries a declared allowance for them."""
acceptance_criteria = """Demand counts new content at its uncompressed length, content being stored again to heal a loss, earlier content that must be copied to a saved-state location on another volume, and a declared allowance for the records, restore kits, logs and temporary space the run writes. With demand above free space, alone or summed across two locations on one volume, nothing is created or changed on the volume, the message names the volume, needed and free space, and those locations are refused as not ready (SR-043); with demand at or below free space the run proceeds and does not fail for want of space. A mount point and the folders beneath it count as one volume on Windows and on Linux."""
permutations = """locations_on_volume=range[1..3]; need_vs_free=set{below,equal,above}; demand=set{new-content,healed-content,cross-volume-history,many-small-files}; platform=set{windows,linux}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-06"]
form = "assumption"

[requirement.SR-053]
title = "Content lost from the backup is stored again"
sn_refs = ["SN-031"]
boundary_refs = ["B-02", "B-01"]
hat_refs = ["SHARED-CONTENT"]
requirement = """When a run finds that stored content the latest state relies on has been removed or quarantined from the backup and the source still holds those bytes, the system shall store the content again."""
rationale = """Antivirus quarantine and sync space sweeps remove files inside a backup that looks like a plain copy. If the loss is only forgotten, every later run reports success over a file that can no longer be restored. Waiting for the file to change at the source lost: an untouched file would never be healed. Content still present but corrupted is not stored again in silence: a check reports it (SR-049) and a restore recovers it from another intact copy (SR-119), because only a check can tell corruption from a legitimate change."""
acceptance_criteria = """After stored content is deleted from outside the tool, the next run succeeds and the affected file restores byte-exact from the latest state, whether the content is stored again from the source or taken from another surviving copy, and even when the file's size and time are unchanged; when healing changes the record, the state before it is kept as a saved state as for any change; a run over a backup with no such loss behaves as before."""
permutations = """removed=set{one-object,many-objects,shared-object}; source_metadata=set{unchanged,changed}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-11"]
delivered_with = ["SR-108"]
form = "assumption"

[requirement.SR-055]
title = "A name invalid on Windows or Linux is refused at backup time"
sn_refs = ["SN-032"]
boundary_refs = ["B-01", "B-06", "B-08"]
requirement = """If a source file's name cannot exist on Windows or on Linux, then the system shall leave that file out of the backup, name it with the offending character in the run's record, report the run as failed and still back up every other file of that source."""
rationale = """A name one platform cannot hold breaks the promise that every backup restores on every supported system. Half-handling it (mangling, or storing it for a restore that will fail) lost; so did aborting the whole source over one name. Refusing loudly lets the owner fix the name at the source."""
acceptance_criteria = """For a file named with each invalid class in turn, beside ordinary files: a character forbidden on Windows (less-than, greater-than, colon, double quote, vertical bar, question mark, asterisk) or a control character including a newline; a trailing dot or space; a reserved device name (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9) whatever its case or extension; and, on a non-Windows host, a backslash in a name. The run's record names the file and the offending character or rule, the run reports part failed, and every other file restores. Names with Unicode, brackets, parentheses and ordinary spaces are accepted. Where an earlier run stored a file at a name that is now refused, that earlier entry and its content stay restorable."""
permutations = """invalid_feature=set{forbidden-character,control-character,trailing-dot,trailing-space,reserved-name,backslash-on-non-windows}; prior_entry=set{none,stored-earlier}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal, the record and the outcome are the delivered result."""
form = "interface"

[requirement.SR-056]
title = "A successful restore has checked every file it wrote"
sn_refs = ["SN-033"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """The restore kit shall report a restore complete only when every file it wrote has been checked to have the content the backup recorded for it."""
rationale = """A wrong stored copy, a flipped bit or a truncated file would otherwise restore with a success status. Trusting the store lost."""
acceptance_criteria = """With stored content altered, bit-flipped at the same length, and truncated, in raw and compressed form, the restore never reports exit code 0 with any written file differing from its recorded content; a written file that fails the check is not left in place as if restored."""
permutations = """damage=set{altered,same-length-bit-flip,truncated}; compress=bool; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-05", "DA-18"]
delivered_with = ["SR-119"]
form = "assumption"

[requirement.SR-059]
title = "No operation loses or alters content a state depends on"
sn_refs = ["SN-034"]
boundary_refs = ["B-02"]
hat_refs = ["SHARED-CONTENT"]
requirement = """The system shall not, in any operation, make stored content that the latest state or a saved state depends on, and that restored correctly before the operation, missing or different from what that state records."""
rationale = """Files and states share stored content; rewriting or removing one copy because one file changed silently breaks every other file and state using it, found only at restore. Testing survival only against the files the source still holds lost: entries kept from an earlier run, and entries whose replacement failed, depend on content the source walk never sees. Damage already present before an operation is the business of healing and repair (SR-053, SR-109); this row forbids adding to it. A repair that renames or re-forms a stored item so that it restores the same bytes alters nothing a state depends on."""
acceptance_criteria = """After one of two identical files is edited, and after files are removed, renamed and re-added, every earlier saved state still restores the old bytes for every path that held them and the latest state restores the new bytes. Content still claimed by an entry kept from an earlier run (its file unreadable or its name refused) and content whose replacement copy failed are retained; removing either of two files sharing one stored copy leaves that copy in place. After every operation, every file of every state that restored before restores the same bytes, including after a repair that corrects a recorded form; on a store already missing some content, the operation adds no further missing or altered content."""
permutations = """operation=set{backup,removal,repair,kit-refresh}; change=set{edit-one-twin,remove,rename,re-add,kept-earlier-entry,failed-replacement}; store=set{intact,already-damaged}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restorability of every state is itself the outcome."""
delivered_with = ["SR-041"]
form = "cross-cutting"

[requirement.SR-061]
title = "A backup or state in a retired or unrecognised form is refused by name"
sn_refs = ["SN-040"]
boundary_refs = ["B-02", "B-06", "B-08", "B-15"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """If a backup, or a saved state in it, is in a retired or unrecognised form, then the system shall refuse it by name before changing anything or writing to any restore target, with a message naming the form and what to do."""
rationale = """A version that half-understands an unfamiliar form can damage a store it should have left alone, and a restorer that misreads one hands back wrong files; best-effort continuation lost. A retired form is one only a version no longer supported wrote (SN-041 covers states written by a supported version), and it is recognised from positive evidence, so that a merely damaged entry is never mistaken for a retired store: damage is a check finding, healed or repaired per entry, while a retired form is refused as a whole. How a form is recognised belongs to the record-format interface."""
acceptance_criteria = """A backup in a retired form and one in an unrecognised form are each byte-identical after a backup, a removal and a repair are attempted, each refused as not ready (value 2, SR-043) with a message naming the form and the action to take; every restorer refuses a state in a retired form before writing to the target, naming the form, with exit code 2; a check reports the form as a finding and changes nothing. A retired form is refused by name also when no completeness evidence is present. A store whose only fault is one damaged entry is not refused as a whole: that entry is still checked, healed and restored."""
permutations = """form=set{retired,unrecognised,newer-than-this-version,damaged-entry-only}; action=set{backup,removal,repair,check,restore}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The untouched backup, the refusal and its message are the outcome."""
delivered_with = ["SR-114"]
form = "interface"

[requirement.SR-062]
title = "Where turned on, a browsable listing of the latest state is produced"
sn_refs = ["SN-008"]
boundary_refs = ["B-06", "B-20"]
requirement = """Where the browse view is turned on, the system shall produce after each run a listing of every backed-up path of the latest state, duplicates included, searchable by name, in which opening an entry opens that file's stored content."""
rationale = """The backup is organised by content, not by the original tree, so it cannot be browsed by eye; without another way in, finding one file means restoring everything."""
acceptance_criteria = """With the browse view on, after a run the listing holds every path of the latest state including duplicates, a name search finds a given file, opening its entry yields its content, and a run that changed the latest state brings the listing up to date; with the view off, no listing is produced."""
permutations = """browse_view=set{off,on}; duplicates=bool; change=set{add,edit,remove,none}; compress=bool; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The listing is the outcome."""
form = "interface"

[requirement.SR-063]
title = "A listing location that overlaps a source or a backup, or holds other content, is refused"
sn_refs = ["SN-037", "SN-034", "SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
requirement = """If the configured listing location overlaps a source, a backup or a saved-state location, by lying inside one, equalling one or containing one, or holds content the system did not generate, then the system shall refuse the run before it starts."""
rationale = """The listing is regenerated from scratch, so a location that overlaps the source would alter it (SN-037), one that overlaps a backup would remove stored content (SN-034), and one holding the owner's own files would erase them; SN-027 asks that such a wrong setting stop the run rather than be guessed at."""
acceptance_criteria = """With the listing location inside, equal to, and containing the source, the backup and the saved-state location in turn, and with a listing location holding files the system did not generate, the run is refused with the configuration-refused outcome, nothing is created or changed, and those files are left in place."""
