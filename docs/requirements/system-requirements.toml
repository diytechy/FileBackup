sn_refs = ["SN-036"]
boundary_refs = ["B-01", "B-16"]
requirement = """The restore kit shall give each restored file the modification time recorded for it, including files that share one stored copy."""
rationale = """Identical files are stored once; unless each file's own time is applied, every twin comes back with the time of whichever was stored first. A time is metadata, not content: failing a byte-exact restore over it would throw away a good file."""
