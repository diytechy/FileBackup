[requirement.SR-040]
title = "Every restorer reports the same outcome value per class, with a fixed precedence"
sn_refs = ["SN-026"]
boundary_refs = ["B-15", "B-19"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """When a restore ends, the restore kit shall return one outcome value from the shared outcome vocabulary (SR-043), the same value for the same failure through every restorer on every supported system."""
rationale = """A host supervising restores must tell "the bytes are gone" from "nothing proceeds until someone changes something" from "retry later"; one generic failure sends a script into retrying over real damage, or alerts nobody over a problem only a person can fix. A fixed precedence is needed so that a mixed failure maps to one value, and a classification true only on the system the backup was made on misleads every other restore host."""
acceptance_criteria = """Values are 0 complete; 1 content missing or some part failed; 2 the restore cannot proceed until someone changes something, a bad request or a precondition not met, such as a host tool absent or below its required version or a target lacking the space the restore needs; 3 damaged record of contents; 4 retry later without changing anything, a host fault while the restore works, such as an I/O failure or a tool failing mid-restore. When several apply, 2 takes precedence over 3, 3 over 4, and 4 over 1. Deliberately induced instances of each class, alone and combined, return their value through every restorer on Windows, Linux and macOS. An incomplete restore reports the count of content failures and of host failures even when one class takes precedence. Content that cannot be produced although the host's tools work is content missing (1). Two names colliding on the target are content missing (1), an entry whose path would land outside the target is a damaged record (3), a current-form state whose folder record or a file's recorded time is missing or malformed is some part failed (1), and a state recorded before completeness evidence existed, restored with that check reported as not made, is complete (0)."""
permutations = """class=set{complete,content-missing,bad-request,precondition-not-met,damaged-record,host-fault}; combined_with=set{none,content-missing,host-fault}; case=set{induced,name-collision,escaping-entry,damaged-current-metadata,unverified-older-record}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The outcome value is itself the outcome."""
form = "interface"

[requirement.SR-041]
title = "Earlier content a run cannot place in the saved state stays restorable, and the run fails"
sn_refs = ["SN-044", "SN-034", "SN-004"]
boundary_refs = ["B-02", "B-06", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If a run cannot place the earlier content of a superseded or removed file in the saved state, then the system shall keep that content in the store so the saved state still restores the file, name the file with the cause in the run's record, and report the run as part failed."""
rationale = """Derived through UNATTENDED-OPS: the needs ask that a run's failures be named (SN-044), that stored content a state depends on is not lost (SN-034) and that a changing run keeps its complete previous state (SN-004), but none says what happens when placing one earlier copy fails partway. Completing a saved state that lacks the file is the loss SN-034 forbids (SR-059); stopping at the first failure leaves every later one unreported; carrying on in silence reports success. The content is still in the store, so the honest result is a complete saved state, a named failure and a failed run, and a saved state missing a file is never published. Capture failures on the source side are SR-089's."""
acceptance_criteria = """With two superseded or removed files whose earlier content cannot be placed in the saved state, the run's record names each with its cause and gives their count, the saved state restores both files byte-exact together with every other file, the run reports the part-failed outcome, and the next run proceeds. Where earlier content cannot be kept restorable at all, no saved state missing it is published, the latest state is left as it was before the run, and the run reports the part-failed outcome."""
permutations = """kind=set{superseded,removed}; failures=range[1..2]; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restorable saved state, the record and the outcome are the delivered result."""
delivered_with = ["SR-059"]
form = "interface"

[requirement.SR-042]
title = "The configuration has a documented, versioned description matching the launch checks"
