[requirement.SR-036]
title = "A source that suddenly looks empty is refused"
sn_refs = ["SN-038"]
boundary_refs = ["B-01", "B-02", "B-08"]
hat_refs = ["FILESYSTEM-SEMANTICS", "UNATTENDED-OPS"]
requirement = "If a previously populated source is missing or appears empty at admission or during capture, then the system shall stop that set with a non-success result rather than publish the apparent emptiness as intentional removal."
rationale = "A missing mount can resemble an empty source. A bounded run may already have published valid per-file progress when disappearance is detected; preserving earlier recoverable content is required, not rollback of every checkpoint."
acceptance_criteria = "Exercise missing, unreadable and empty roots before and during a populated-source run, including a tree containing only empty folders. Report the condition and preserve earlier recoverable content without publishing mass removal. A first backup of an empty source succeeds; intentional retirement is explicit removal of that source’s backup-set entry from the configuration, not inferred from disappearance. After that edit, later runs no longer capture the retired source, and neither removing the entry nor running the remaining entries deletes its existing store; any history deletion is a separate operator action. This is retirement, not an implicit permission to publish an empty replacement."
permutations = "host=set{Windows,Linux,macOS}; condition=set{nominal,missing,invalid,interrupted}; @pairwise"
priority = "M"
verification = "Test"
status = "Approved"
form = "assumption"
da_refs = ["DA-04"]
delivered_with = ["SR-082", "SR-091", "SR-158"]

[requirement.SR-039]
title = "Detectably invalid records or entries are rejected safely"
sn_refs = ["SN-025"]
boundary_refs = ["B-13", "B-15"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = "If a selected state record has an unsupported structure, malformed required fields or detectable truncation, then the recovery route shall refuse the unusable record or reject and name its invalid entries without unsafe writes."
rationale = "Parsing and per-file checks detect specific defects, not record provenance or completeness. A syntactically valid shortened or substituted record can evade those checks; SR-155 states that limit instead of requiring a completeness witness."
