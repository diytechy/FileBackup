# assumptions.toml: the claims about the world FileBackup's outcomes rely on,
# and the test stand-ins for outside parties. All rows are owner-approved.
# Each holding condition limits the particular claim, not the approved needs.
# A failed premise must not erase required refusal, reporting or recovery behavior.
# DA-17 and DA-21 are verification conditions, not production prerequisites.
# Risk acceptance is recorded by the owner approval act, not by drafting.

[assumption.DA-01]
effect_at = ["B-02"]
assumption = """A same-filesystem rename publishes one complete namespace entry to other processes; durability after power loss additionally depends on persistence of the file data and directory updates."""
holds_when = """The particular host, filesystem and mount options provide the required rename semantics; source and destination of the operation share that filesystem."""
obstacle = """Separate mounts, weaker network or synchronization semantics, or lost directory updates after power failure can violate the publication or persistence premise."""
falsifier = """An observer sees a partial published file after process interruption, or a power-loss exercise loses a supposedly durable namespace update."""
obstacle_hats = ["FILESYSTEM-SEMANTICS", "INTEGRITY-RECOVERABILITY"]
status = "Approved"
standing = "active"

[assumption.DA-02]
effect_at = ["B-04"]
assumption = "The declared host and filesystem release an exclusive-use claim when its holder ends or dies, without an operator repairing ownership state."
holds_when = "The supported local or network storage combination provides the required owner-death behavior for the coordination mechanism used; a protocol or filesystem name alone does not establish it."
obstacle = "A disconnected network client leaves stale ownership, a reconnect loses ownership while the process continues, or another process retains the resource that holds the claim."
falsifier = "On a declared supported combination, after the holder ends or dies and storage is available, another operation remains blocked solely by ownership that cannot be released without manual repair."
obstacle_hats = ["FILESYSTEM-SEMANTICS", "INTEGRITY-RECOVERABILITY"]
status = "Approved"
standing = "active"

[assumption.DA-03]
effect_at = ["B-04"]
assumption = """An exclusive-use claim taken by an operation using a single validated configuration is observed by competing operations using that same configuration on the supported host and store filesystem."""
holds_when = """For an already validated configuration, the declared host and filesystem expose the same interoperable exclusion domain to contenders for a resolved root. Unique-root validation and refusal of duplicate roots are independent product admission requirements, not environmental premises."""
obstacle = """Independent configurations or external writers targeting the same root are outside this coordination promise; network or multi-host locking may also lack the required behavior."""
falsifier = """Two operations using the same validated configuration are both observed mutating the same backup on a supported host."""
obstacle_hats = ["FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[assumption.DA-04]
effect_at = ["B-01"]
assumption = "Reading one coherent version of a file requires an interval in which its bytes are stable, or a coherent read view supplied by the source environment. Size and time observations do not prove that concurrent writes were absent."
holds_when = "The individual file remains stable for its capture attempt, or the environment supplies a consistent view for that read; other files may still be changing."
obstacle = "Concurrent writes can produce a mixture of versions, including same-size changes or changes hidden by timestamp granularity. Live databases and virtual disks may need application-specific consistency arrangements."
falsifier = "A capture made under the stated stable-file or coherent-view condition contains bytes that differ from the version exposed by that view."
obstacle_hats = ["INTEGRITY-RECOVERABILITY"]
status = "Approved"
standing = "active"

[assumption.DA-05]
effect_at = ["B-02"]
assumption = "For the declared content-identity method and workload, different contents sharing an identity are treated as a residual risk, not as impossible. Successful identity checks provide the documented level of assurance."
holds_when = "The chosen identity method is suitable for the documented data scale and threat model, and its collision limitations are disclosed."
obstacle = "Accidental collisions, deliberately constructed collisions, or a workload outside the method's assessed scale can make different bytes appear identical."
falsifier = "Independent comparison establishes that different contents accepted under the same recorded identity produced an incorrect recovered file."
accepted_risk = "Residual content-identity collisions can escape the documented checks. This does not permit skipping required checks or ignoring a detected discrepancy."
obstacle_hats = ["SECURITY"]
status = "Approved"
standing = "active"

[assumption.DA-06]
effect_at = ["B-03", "B-17"]
assumption = "A capacity reading is an observation supplied by the host for estimation; it is not a reservation or a guarantee of space available to later writes."
holds_when = "A usable capacity estimate is available for the actual destination and execution account, with any known quota or allocation limitations accounted for; otherwise the estimate is unavailable or qualified."
obstacle = "Quotas, thin provisioning, placeholders, filesystem compression or deduplication, and competing writers can make reported free space differ from usable capacity."
falsifier = "Independent measurement under the stated estimate conditions shows that the reported available capacity does not describe what the execution account can allocate. Later exhaustion alone does not falsify a reservation, because none is claimed."
obstacle_hats = ["FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[assumption.DA-07]
effect_at = ["B-16"]
assumption = "A target that declares support for a timestamp, folder attribute or link operation retains that information with its documented precision and semantics."
holds_when = "The particular target filesystem, mount and account support the requested operation and its required privileges; unsupported features are handled by the product's reporting requirements."
obstacle = "Timestamp rounding, unsupported folder attributes, link restrictions, permission limits or target-side rewriting prevent exact fidelity for some metadata."
falsifier = "A target reports a supported metadata or link operation as successful but the resulting value or link differs beyond its declared semantics or precision."
obstacle_hats = ["FILESYSTEM-SEMANTICS", "CROSS-PLATFORM"]
status = "Approved"
standing = "active"

[assumption.DA-08]
effect_at = ["B-16"]
assumption = "A source name within the declared name policy can be represented distinctly on a target only when that target's character, case, normalization and length rules permit it. Collision-free representability is conditional, not universal."
holds_when = "The individual name is valid on the target and does not collide with another restored or existing name under that target's comparison rules."
obstacle = "Case folding, normalization, reserved names, length limits or existing target entries can make distinct recorded paths resolve to one name or to an invalid path; required collision detection and reporting still apply."
falsifier = "Names classified as representable and distinct under the declared target rules are merged, rewritten or rejected by a target conforming to those rules."
obstacle_hats = ["CROSS-PLATFORM", "FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[assumption.DA-09]
effect_at = ["B-08", "B-09"]
assumption = "Corrective action outside FileBackup depends on an operator or automation host observing its outcome and deciding to act; the tool cannot establish that this happened."
holds_when = "The recipient has working access to results and an operational process for handling them."
obstacle = "Ignored outcomes, filtered or undelivered notifications, abandoned addresses and unattended dashboards can leave failures unaddressed."
falsifier = "A monitoring exercise shows that results intended to trigger external action are not observed or acted on under the stated operating process."
accepted_risk = "FileBackup cannot make anyone read its outcome; it can only make the outcome unambiguous."
obstacle_hats = ["UNATTENDED-OPS"]
status = "Approved"
standing = "active"

[assumption.DA-10]
effect_at = ["B-18"]
assumption = "A documented carried-script route has its required PowerShell or bash environment and local tools present when recovery starts. With those prerequisites present, recovery is independent of network access, the native engine and its repository."
holds_when = "The selected route's declared tools have been installed or are bundled where permitted. Provisioning may have occurred online beforehand or from offline installation media; online provisioning is not a dependency of the recovery operation."
obstacle = "A locked-down or offline host may lack every supported route and permission or media to provision one. Missing prerequisites must still be named before affected work; the documented Windows, Linux and macOS routes must recover offline once their prerequisites are present."
falsifier = "A host meeting a declared recovery-route tool floor cannot execute the carried route because it requires an undeclared external prerequisite."
obstacle_hats = ["CROSS-PLATFORM"]
status = "Approved"
standing = "active"

[assumption.DA-11]
effect_at = ["B-02"]
assumption = "Interpreting a recovered file as the original captured version relies on the selected record still describing that capture. Parsing and per-file checks do not authenticate record provenance or completeness."
holds_when = "The selected state record and shared content have been retained without an undetected, internally consistent substitution or omission."
obstacle = "Accidental record replacement or truncation and deliberate tampering can leave a well-formed but wrong record whose remaining content passes its checks; this limitation is not restricted to a malicious attacker."
falsifier = "Independent capture evidence shows that a well-formed record accepted by recovery omits or substitutes captured content while all required checks against that record pass."
obstacle_hats = ["INTEGRITY-RECOVERABILITY"]
status = "Approved"
standing = "active"

[assumption.DA-12]
effect_at = ["B-01"]
assumption = "The documented capture scope reflects what the owner intends to protect; data explicitly outside that scope is not relied on as backed up."
holds_when = "Any excluded filesystem objects or system-managed locations are disclosed as exclusions and distinguishable from captured data; no blanket exclusion follows merely from a familiar folder name."
obstacle = "Wanted data can reside in a system-managed location or an unsupported object, and an owner may overlook the declared exclusion."
falsifier = "An excluded object contains data the owner intended to recover from the backup, showing that the declared scope and that intent differ."
obstacle_hats = ["FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[assumption.DA-13]
effect_at = ["B-12"]
assumption = "The configured container platform enforces the source access mode, store access and unprivileged execution identity exposed to FileBackup."
holds_when = "The specific runtime and launch configuration implement the documented isolation and mount permissions."
obstacle = "A privileged launch, a writable source mount, host overrides or a platform defect can remove the intended access restriction. FileBackup's own source-write prohibition still applies."
falsifier = "A permission probe under the documented unprivileged, read-only-source configuration can write to the source or obtain privileges the configuration was meant to deny."
obstacle_hats = ["SECURITY"]
status = "Approved"
standing = "active"

[assumption.DA-14]
effect_at = ["B-01"]
assumption = "Ordinary source updates often change size or modification time, making those fields useful for inexpensive change detection between scheduled content re-reads; unchanged fields do not establish unchanged bytes."
holds_when = "An update is visible in the metadata actually observed by the run, with sufficient filesystem precision; otherwise only a content re-read can expose a same-metadata change."
obstacle = "Same-size edits, restored timestamps and coarse time resolution can conceal updates. The owner-selected re-read schedule remains required, including its documented limits when disabled."
falsifier = "A controlled content change expected to be visible under the stated metadata-update conditions leaves both observed size and time unchanged."
obstacle_hats = ["FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[assumption.DA-15]
effect_at = ["B-02"]
assumption = """Data whose persistence was requested and acknowledged survives power loss to the extent guaranteed by the declared filesystem, mount, device and controller combination."""
holds_when = """The host stack honors flush requests and the required namespace updates have also persisted; a process-kill test alone does not establish this."""
obstacle = "A drive or controller that acknowledges writes it has only cached, or removal of a drive without ejecting it."
falsifier = "After a power cut, content recorded as stored in a completed state is missing or short."
obstacle_hats = ["INTEGRITY-RECOVERABILITY"]
status = "Approved"
standing = "active"

[assumption.DA-16]
effect_at = ["B-02", "B-04"]
assumption = "The backup host clock supplies dates meaningful to the operator only within its configured accuracy and timezone; displayed date order alone does not establish state identity, capture order or writer ownership."
holds_when = "The host clock and timezone are configured as intended, and the clock supplies dates within the accuracy and timezone interpretation declared for that environment."
obstacle = "Clock rollback, equal timestamps and timezone changes can make dates ambiguous and complicate date-based history selection."
falsifier = "A recorded display date differs from an independent time reference beyond the host's declared accuracy or intended timezone interpretation."
obstacle_hats = ["INTEGRITY-RECOVERABILITY", "UNATTENDED-OPS"]
status = "Approved"
standing = "active"

[assumption.DA-17]
effect_at = ["B-02", "B-03", "B-04"]
assumption = "Mapped temporary-drive fixtures supply evidence for the file, name and rename cases actually exercised through that mapping on the recorded Windows host and backing filesystem. The mapping itself supplies no capacity, volume-identity or ownership evidence."
holds_when = "Each claimed case records its Windows host, NTFS backing volume, tested operation and mapping-specific limitations. Capacity, volume identity and cross-process ownership or owner-death release require their own explicit exercises on the declared host and real backing volume."
obstacle = "A mapped path can differ from the underlying volume in volume discovery or capacity reporting. The fixture supplies no untested locking, Linux/macOS, removable-device, network, synchronization or power-loss evidence."
falsifier = "A paired file, name or rename test through a mapped path and its direct backing path produces different results for a documented case that claims those operations behave equivalently."
realized_by = "SUR-01"
obstacle_hats = ["FILESYSTEM-SEMANTICS"]
status = "Approved"
standing = "active"

[surrogate.SUR-01]
name = "Mapped temporary drives"
emulates = ["EXT-04", "EXT-05"]
description = "Windows test stand-in using temporary folders mapped to drive letters for exercised file, name and rename cases. Merely creating the mapping supplies no evidence for capacity, volume identity or cross-process ownership; those require separately identified exercises on the real backing volume. It supplies no Linux/macOS, network, removable-device or power-loss evidence."
status = "Approved"

[surrogate.SUR-02]
name = "Stock Linux test environment"
emulates = ["EXT-10", "EXT-11", "EXT-12"]
description = "Linux recovery test stand-in using declared shell tools and fixture stores, with file comparisons for the exercised cases. It supplies no evidence of native engine operation, macOS behavior or untested storage and failure conditions."
status = "Approved"

[assumption.DA-18]
effect_at = ["B-10", "B-18"]
assumption = "Separately supplied hash and archive tools implement the declared algorithms and formats on each supported host, within the conformance cases used to qualify them."
holds_when = "The external tool build and invocation satisfy the documented version and format contract and the relevant conformance checks pass; a familiar package name alone is insufficient."
obstacle = "Incompatible, modified or faulty external builds can compute different identities or expanded bytes. FileBackup's embedded implementations remain its own verification responsibility."
falsifier = "A declared-compatible external tool produces a different identity or expanded payload for a known conformance input."
status = "Approved"
standing = "active"

[assumption.DA-19]
effect_at = ["B-13"]
assumption = "A complete-store handoff preserves the records, carried recovery scripts, guidance, required redistribution notices and shared content available in a coherent source store at the time of transfer. It does not recreate content removed before transfer."
holds_when = "The transfer captures a coherent store, preserves required file contents and layout, includes its recovery guidance and required notices, and includes content needed by states within the retained recovery window; any present older state records may remain outside that window."
obstacle = "Copying only a state folder, omitting shared content, or copying during mutation without a coherent transfer can lose dependencies. Earlier retention may already have invalidated older states."
falsifier = "A purported complete transfer omits or changes required content, recovery files, guidance or redistribution notices available in the coherent source store."
status = "Approved"
standing = "active"

[assumption.DA-20]
effect_at = ["B-21"]
assumption = "The declared host credential facility enforces its documented access policy and supplies notification credentials to the authorized execution identity without exposing them in configuration, backups or run records."
holds_when = "The mechanism is provisioned for the account or service identity that runs the operation, with the documented host, access and portability restrictions."
obstacle = "Wrong execution identity, unsupported transfer between hosts, permissive access controls or a compromised credential facility can prevent access or disclose secrets."
falsifier = "An identity outside the declared access policy can obtain the protected credentials through that facility, or readable configuration, backup or run records expose them."
obstacle_hats = ["SECURITY"]
status = "Approved"
standing = "active"

[assumption.DA-21]
effect_at = ["B-01"]
assumption = "A before-and-after fixture comparison can attribute source changes to FileBackup only when other writers are excluded or independently observed for that measurement."
holds_when = "The source-nonmutation test controls its fixture and accounts for host-managed read effects and external writes; this is a verification condition, not a requirement for a quiet production source."
obstacle = "Concurrent application writes, synchronization, metadata changes or unobserved host effects make a simple difference an ambiguous attribution."
falsifier = "A supposedly isolated nonmutation test records an unaccounted source change caused by another process or by the host."
status = "Approved"
standing = "active"

[assumption.DA-22]
effect_at = ["B-06", "B-20"]
assumption = "Progress timing measured during execution depends on the host scheduling the process; a suspended process cannot emit progress while it is not running."
holds_when = "The host stays awake and supplies the declared execution resources, with ordinary scheduling delays accounted for in the reported timing basis."
obstacle = "Host sleep, virtual-machine or container suspension, and severe scheduling starvation can extend wall time without active execution. Required reporting during available execution is not waived."
falsifier = "An observation interval claimed to represent continuously available execution includes an unaccounted host suspension or scheduling outage."
obstacle_hats = ["UNATTENDED-OPS"]
status = "Approved"
standing = "active"
