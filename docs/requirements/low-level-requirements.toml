[design.LLR-037]
sr_refs = ["SR-037"]
title = "Portable tool resolution"
module = "FileBackup.Common;FileBackup.Engine"
code_symbol = "Resolve-OptionalTool;Initialize-Dependencies"
detail = """The default 7-Zip location comes from FILEBACKUP_7ZIP_PATH; failing that, on Windows the standard install location, and failing that the first 7-Zip command found on the PATH. Resolving it never throws on a non-Windows host. A set's Tools.SevenZipPath takes precedence over the default, and the missing-7-Zip remediation names both settings (SR-037). The same import-time resolution reads FILEBACKUP_7Z_LEVEL into the 7-Zip compression level, accepting only the ten single-digit strings '0' to '9' by exact membership: no trimming, so a padded or whitespace-only value is invalid, while an absent or empty variable simply means the default, 9. This resolution never throws, because the restorers import the same shared library and a bad environment variable must not break a restore; instead it records the raw rejected value and leaves the level at 9. The backup entry point checks that record immediately after the configuration loads and before the run creates any artifact (the global log directory included), and refuses with the configuration-failure status (2 under -ExitCode, SR-042/SR-043) when the value is invalid AND -Action is Backup AND some set has CompressEnabled true. Verify, View, Prune, Snapshots, a run where every set has compression off, and both restorers are therefore unaffected by the variable."""
test_refs = "TC-065;TC-232"
status = "Drafted"

[design.LLR-038]
sr_refs = ["SR-038", "SR-022"]
title = "Witness sidecar writer"
module = "FileBackup.Common;FileBackup.Engine"
code_symbol = "Write-Manifest;Write-ManifestWitness;Get-ManifestWitnessPath;Test-IsInfrastructureFile"
detail = """The index writer publishes the index atomically (SR-082, LLR-087) and then writes its witness: the XXH128 digest of the written index, emitted as Version/Rows/Bytes/XxH128/Written key=value lines, UTF-8 without BOM, LF line endings, written to a temporary sidecar in the same folder and published by an atomic rename over any prior witness. The witness writer lives in the shared library because the PowerShell restorer may use only that library (AGENTS.md section 3). The witness file name joins the root-level infrastructure allowlist beside the paths sidecar, together with the two temporary names MANIFEST.csv.meta.tmp and MANIFEST.csv.tmp: a crash between writing and publishing leaves a temporary file behind, and a leftover must neither be backed up as user data nor warned about as an orphan. The row count comes from the writer, which already holds the records it wrote, rather than from re-reading the index; a standalone re-stamp of the witness counts the file instead. A snapshot inherits its own witness because its staged index is rewritten through the same writer before the snapshot is published; the witness is deliberately not in the kit-artifact copy list, which would overwrite the snapshot's witness with the backup root's (SR-038)."""
test_refs = "TC-066;TC-067;TC-237;TC-239"
status = "Drafted"

[design.LLR-039]
sr_refs = ["SR-039"]
title = "Restore-side witness verification"
module = "FileBackup.Common;Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Test-ManifestWitness;verify_manifest_witness"
detail = """A shared-library verifier reads the witness, compares Bytes, Rows and XxH128 against the index on disk, and returns a verdict (Verified, Absent, Mismatch or Malformed) with the failing field and an optional non-fatal warning. Fields are checked Bytes, then Rows, then XxH128, but a Rows-only disagreement defers to the digest: when bytes and digest match, the index IS the witnessed one, so it verifies with a warning (counting-semantics divergence) rather than aborting; with no digest present, a row-count disagreement still aborts. Both restorers verify after confirming the index exists and before creating the target folder, the restore log or running the capacity pre-check, so an exit-2 or exit-3 refusal writes nothing into the target (log lines are buffered and flushed once the log exists). The PowerShell restorer also checks the index's CSV header shape, as the shell restorer already does, and the shell restorer verifies at the same point, immediately after its header check. An absent witness warns and continues unless -RequireWitness / --require-witness is given (SR-039)."""
test_refs = "TC-068;TC-069"
status = "Drafted"

[design.LLR-040]
sr_refs = ["SR-040"]
title = "Restore exit-code taxonomy"
module = "Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Find-DataFileByHash;Exit-Reconstruct;die_code"
detail = """The pool locator in both restorers returns one cause per lookup: Found, ContentMissing, DependencyMissing or StorageUnreadable, with a detail. Search folders are probed for existence and readability. An archive candidate met without a usable 7-Zip yields DependencyMissing; a candidate that cannot be read at all is the host condition StorageUnreadable and records exactly that one cause, never DependencyMissing as well; a candidate that fails to expand is data damage, folded into the ContentMissing detail (' ; N candidate(s) could not be expanded: <first>'). The locator never returns CandidateError. Whether an expand failure counts as damage is gated by a self-test that 7-Zip is actually usable. The restore loop records each unrestored row with its cause and detail; its own CandidateError (the row's own file failed to expand or copy) and WriteMismatch stay host-class. The summary classifies unrestored rows into the content class (exit 1) and the host class (exit 4). Both restorers report an unlistable snapshot tree as StorageUnreadable (exit 4) rather than silently shrinking the recovery pool. Under -ExitCode (which the Windows launcher passes) a classified outcome becomes the process exit code; otherwise it raises an error carrying the same message wording, so in-process callers keep working. Any terminating error the restorer did not classify is routed to the precondition class (exit 2 under -ExitCode, re-raised otherwise), so an unexpected failure can never be reported as data loss (1). Failures creating the target folder or the restore log route through the same class, matching the shell restorer's refusal (2) for a file occupying the target path. The shell restorer reports usage and precondition failures as 2, the witness refusal as 3, and the 1-versus-4 split at the end of its run; its usage text and header comment carry the exit-code table (SR-040)."""
test_refs = "TC-070;TC-071;TC-072;TC-141"
status = "Drafted"

[design.LLR-041]
sr_refs = ["SR-041"]
title = "Move-loop failure aggregation"
module = "FileBackup.Engine"
code_symbol = "Move-RemovedFilesToStaging;Save-SupersededData;Invoke-BackupSet"
detail = """Evicting removed files and preserving superseded data each catch a failure per file (including creating the destination directory), log 'Failed to <evict|preserve> ...: <message>' at ERROR, record the entry, mark the run unsuccessful and continue; each reports a summary count, so a partially staged snapshot is explicit. The run then still proceeds to publish the snapshot, so the staging area is never orphaned (SR-017) (SR-041)."""
test_refs = "TC-073"
status = "Drafted"

[design.LLR-042]
sr_refs = ["SR-042"]
title = "Validating configuration loader"
module = "FileBackup.Engine;FileBackup.ps1;container/FileBackup.schema.json"
code_symbol = """Import-BackupConfiguration;Test-BackupConfigurationShape;Assert-NoUnknownConfigKey;Resolve-BackupSetDefaults;Test-ConfigValueJsonType;Test-IsJsonNumber;Get-ConfigValueJsonTypeName"""
detail = """The configuration loader belongs to the backup-only engine, not the shared library, because configuration loading has no restore-side meaning and the library must stay restore-safe. It accepts the JSON and the CLIXML configuration document, chosen by file extension. JSON: ConfigVersion must be an integer within [1, the current schema version], range-checked before any integer conversion, so an out-of-range version is refused as unsupported rather than by luck of fractional representation. The key set is closed at the top level, under Tools, under Secrets and in each set, and Secrets.Credential is refused explicitly. Type checks read the parsed JSON value's actual type, so a quoted "false" is refused rather than coerced to true; an 'integer' accepts any integral-valued JSON number, culture-safely and including one beyond the 64-bit range. CLIXML: the shape check only, keeping its established message wording. Both formats run the same shape and value checks. Defaults are materialised for every set: SourceStatePath defaults to SourcePath, AllowEmptySource to false, CompressProbe to always, and HashRecalcFreq is upper-cased. Every validated optional key reaches the engine; a validated key must never be silently dropped during defaulting. CompressProbe's vocabulary is exact lowercase (off, excluded-extensions, always), so a mixed-case 'Always' is refused, and the value check runs for both formats, which makes it the only place an invalid CLIXML value is caught. Errors are terminating, single, first in document order, and name the JSON path; a set is named by its real array index. A published draft-07 JSON schema with additionalProperties:false mirrors the validator, including the CompressProbe enum, the BackupSets shape and the ConfigVersion constant. It is documentation, not read at runtime, and is not shipped in the container image. ConfigVersion stays 2 for an optional, defaulted key: such an addition is additive (SR-063). The key is documented in the entry point's help and example configuration, the README field table and IF-001 (SR-042)."""
test_refs = "TC-074;TC-075;TC-076;TC-077;TC-227"
status = "Drafted"

[design.LLR-043]
sr_refs = ["SR-043"]
title = "Entry-point status codes"
module = "FileBackup.ps1;container/entrypoint.sh"
code_symbol = "FileBackup.ps1;entrypoint.sh"
detail = """The backup entry point accepts -ExitCode. A configuration failure, including a missing or unreadable configuration file, writes its message to stderr and, with -ExitCode, exits 2; without it the error is re-raised so in-process callers still see it. A failed set exits 1 in both modes. The container entry point passes -ExitCode ahead of the caller's arguments. The codes match the restorers' table (0 complete, 1 incomplete, 2 usage/precondition), so one vocabulary covers both halves of IF-001 (SR-043). The run's log is not created until the configuration has loaded successfully, because creating the log truncates it, and creating it earlier destroyed the previous run's log on a configuration typo. Configuration-time messages, such as the multi-set warning, are buffered and flushed once the log exists. A configuration failure appends to the global log only when that file already exists, and creates nothing."""
test_refs = "TC-078"
status = "Drafted"

[design.LLR-045]
sr_refs = ["SR-045"]
title = "Prune plan and re-homed copy"
module = "FileBackup.Engine"
code_symbol = "Remove-BackupSnapshot;Get-SnapshotPrunePlan;Copy-ReHomedDataFile;Publish-PruneManifest"
detail = """The prune plan builds the pool's content index (LLR-047) and derives the demand set: every row outside the target whose DataPath is blank, or whose non-blank DataPath names a file that is absent (verification can blank root DataPaths in a damaged store). It holds no more than one manifest at a time (plan C43): the endangered keys, every copy inside the target, come from the lean content index alone; the target's manifest is read once for its row count, the DataPaths it references and the source row of each endangered copy; every other manifest is read once, keeping only the rows that claim an endangered key. It emits one plan item per endangered key, naming its source location and row, its destination folder and name, the destination row's position and the RelativePath it carries, its stored form and its bytes. The destination is elected as cross-change deduplication elects it: the backup root when it demands the key, otherwise the newest demanding snapshot by folder order. The destination name IS the source row's DataPath: a stored object's name derives from its content and stored form, so a re-homed object's name is always identical to its source's. A name that would classify as root-level infrastructure at the destination, or that would overwrite a DIFFERENT file already there, is recorded as a code-2 problem instead of an item; an identical file already there is treated as an interrupted prune's completed copy, and the prune resumes. A re-homed copy is written to '<destination>.fbprune.tmp', path taken literally, and verified for stored-form identity (length and XXH128 equal to the source) and, unless content verification is skipped, for content identity against the row's xxH2Hash and Length, expanding an archive to a temporary file first, the same check the restorers' pool locator makes. It is then published by rename. Publishing the plan reads each destination manifest again, one at a time, finds each planned row by its position, and refuses (before writing that manifest; the prune reports 4 before the commit point) when the row there no longer carries the planned RelativePath and content key. It mutates only DataPath, Compressed and StoredAsHashSize on the destination row and persists through the one index writer, so the witness (SR-038) is re-stamped by its one writer and is never copied between folders."""
test_refs = "TC-081;TC-082;TC-085;TC-086;TC-090;TC-255"
status = "Drafted"

[design.LLR-046]
sr_refs = ["SR-046", "SR-035", "SR-039"]
title = "Prune rails, pool proof and commit point"
module = "FileBackup.Engine"
code_symbol = """Remove-BackupSnapshot;Assert-PrunePrecondition;Test-PoolResolves;Complete-PruneDeletion;Invoke-PruneEntrySweep;Remove-CommittedPruneResidue;Get-PruneCapacityRefusal"""
detail = """The prune precondition check returns the full set of refusals, each with a code, kind and message, rather than stopping at the first; the prune applies the precedence 2 > 3 > 4 > 1 over the whole set, and a -WhatIf run can report every refusal at once. It checks: - the target is an existing the dated folder that is a direct child of the resolved change root and contains no wildcard (2); - the SR-035 run-state gate: a malformed run-state record, or a populated backup index with no last-backup time (2); - no staging area in the change root (2, mutual exclusion with a backup, SR-017); - the plan's own code-2 problems (unknown target, infrastructure name, destination collision); - no unreferenced data files in the target, measured against the target's own index, unless -DiscardUnreferencedData (2); - the WHOLE pool resolves, so an already-broken pool or a pre-existing form disagreement refuses rather than being pruned into (2); - free space on each destination volume for the planned bytes, grouped by volume identity so a UNC or rooted POSIX store is checked too; an unmeasurable volume is skipped rather than refused (2); - 7-Zip present when the plan carries a compressed row and content verification is on (2); - the witness of EVERY pool index: Mismatch or Malformed (3), Absent (3) unless -AllowUnverifiedIndex. The pool-resolution check rebuilds the lean index over the pool minus an excluded folder, then reads each folder's manifest one at a time (plan C43), and reports every row that would not resolve (a row whose own object its listing shows damaged counts as unresolved, and its message says damaged), plus every form disagreement: Compressed='Yes' with a located file that is not '.7z', or Compressed='No' with a located '.7z' file whose row's RelativePath is not itself '.7z' (which would be a legitimately stored already-compressed source file). Deletion renames the folder to 'Pruning_<name>', which is the commit point because that name matches neither the engine's snapshot pattern nor either restorer's the dated pattern, and then deletes it recursively. Residue is handled in two parts. Committed residue, 'Pruning_<that same name>' only, is removed before the named snapshot is planned: it is past the commit point, invisible to every consumer, and holds the name the plan needs; a host failure there is a code-4 record, not an unclassified error, and the step is skipped under -WhatIf. The entry sweep runs inside the transaction, after the rails pass and the staging lock is held, so a refusal mutates nothing and a sweep failure is code 4; it scans only pool folders (the backup root and dated snapshot) and deletes a '*.fbprune.tmp' only when that folder's own index does not reference it, because a staged copy is unreferenced by construction while a referenced file is content. The prune takes the staging area by creating it without overwrite: creation is the atomic test, closing the window between the staging-busy rail and the lock; an existing folder becomes the staging-busy refusal (code 2), and cleanup never deletes a lock this invocation did not create. The PRUNE.inprogress marker is written inside the transaction."""
test_refs = "TC-083;TC-084;TC-085;TC-255"
status = "Drafted"

[design.LLR-047]
sr_refs = ["SR-047", "SR-026", "SR-045"]
title = "Shared content index and snapshot inventory"
module = "FileBackup.Engine"
code_symbol = """Get-BackupContentIndex;Get-BackupSnapshot;Get-SnapshotDate;Get-PoolSnapshotFolder;Optimize-ChangeFolders"""
detail = """The content index maps each '<xxH2Hash>|<Length>' key to the locations holding those bytes, each recording its folder, DataPath, full path, whether it is the backup root, and its folder order: the backup root first, then the given snapshot folders in the order supplied (name order, oldest first). It skips blank DataPaths, blank hashes and rows whose file is not on disk or whose listing shows it damaged (the backup run's rule, plan C37): the index describes usable bytes that EXIST, so a blank row is demand and never supply. It also returns one record per indexed folder, carrying only the folder's identity, order and the set of its usable top-level file names, and no index is retained: each is read once, fed to the map and dropped before the next is read (plan C43), so the content index's memory grows with the number of stored objects, not with the rows of every snapshot. The prune plan, the pool-resolution check and the storage-form audit each read a folder's index again themselves, one folder at a time. Cross-change deduplication uses the lean default: duplicate election is unchanged, and it re-reads and rewrites only a change folder whose DataPaths name a vanished file (LLR-026); it derives its list of change indexes from the same pass. The snapshot inventory lists the change root's folders matching the one snapshot pattern every consumer uses, sorted by name, and parses each snapshot's point-in-time date from its folder name, tolerating the same-second disambiguating suffix. The reported physical, reclaimable and re-homed bytes of a snapshot come straight from the prune plan, so the reported reclaim is the achieved reclaim by construction."""
test_refs = "TC-087;TC-089;TC-234;TC-235;TC-236"
status = "Drafted"

[design.LLR-048]
sr_refs = ["SR-048", "SR-043"]
title = "Retention at the entry point and the container boundary"
module = "FileBackup.ps1;container/entrypoint.sh"
code_symbol = "FileBackup.ps1;entrypoint.sh"
detail = """The backup entry point's -Action vocabulary includes Prune and Snapshots beside the default Backup, with -Snapshot naming the snapshots to act on. Prune and Snapshots resolve the single configured set's paths read-only (no SourcePath needed, nothing created) and either prune the named snapshots (passing -WhatIf through, with the resolved 7-Zip) or list the snapshot inventory as JSON. A store path that cannot be resolved is 4 when its drive or share is not attached and 2 otherwise, decided by the same function the backup run uses (Get-StoreRefusalCode). Under -ExitCode the SR-040 code from the batch result becomes the process exit code; otherwise a non-zero outcome raises an error for in-process callers. The Backup path is unchanged, so every existing invocation behaves exactly as before. The container entry point reads FILEBACKUP_ACTION, or takes a leading positional word in {backup, prune, snapshots}; anything starting with '-' is left in the arguments and flows through unchanged. FILEBACKUP_SNAPSHOT becomes -Snapshot and a truthy FILEBACKUP_DRY_RUN becomes -WhatIf. The shell restorer carries no removal path."""
test_refs = "TC-088"
status = "Drafted"

[design.LLR-049]
sr_refs = ["SR-049", "SR-038", "SR-040"]
title = "Storage-form audit and repair"
module = "FileBackup.Engine"
code_symbol = """Test-BackupStorageForm;Get-StorageFormFinding;Repair-BackupStorageForm;Get-StoredFileForm"""
detail = """A stored file is classified as Archive or Raw from its first six bytes (the 7z signature 37 7A BC AF 27 1C) plus its extension, with no hashing. The storage-form audit walks the pool through the content index (LLR-047), the backup root first and then dated snapshot in name order, and emits one finding per disagreement, naming the folder, RelativePath, DataPath, class, observed and expected form, and whether it is repairable. The classes are NameLies, FlagOverRaw, FlagOverArchive, DanglingDataPath, BlankRowFormDisagreement and Unreferenced. The already-compressed-source exemption is keyed on the payload, not the file name: when the observed form is Archive but the row says Compressed=No, the file's own bytes are hashed against the row's (xxH2Hash, Length); a match is correct raw storage of archive-shaped content and yields no finding, and only a mismatch is a genuine FlagOverArchive, because an already-compressed source can be named anything. A .7z RelativePath is the cheap fast path. The non-Deep scan widens that fast path for one shape only: a Compressed=No archive-signature object is exempt without hashing when all three hold: the row's RelativePath extension is one the already-compressed list exempts (asked of the shared library; the engine holds no copy of the list), its DataPath extension equals the row's RelativePath extension, and its on-disk length equals the row's Length. Without this, a store where a large share of objects are listed-format archives stored raw would be re-hashed in full on every non-Deep pass. The exemption proves form, not payload: a same-length substitution under a listed name passes the non-Deep scan and is caught by -Deep, the payload audit, which always hashes. An archive-signature object under a name the list does not exempt keeps the confirming hash. Otherwise the non-Deep scan reads six bytes per row. -Deep additionally verifies payload identity, and requires 7-Zip: a raw object by length and XXH128 against the row; an archive by its own bytes first, since for an already-compressed source stored raw those bytes ARE the payload, and only otherwise by expanding it to a temporary file and hashing. Repair acts only on findings whose evidence is a file in the row's own folder. It rewrites Compressed and renames the data file so name and form agree, never re-packs, never touches the six logical columns, and persists each folder through the one index writer. Findings are grouped by (folder, DataPath), so the physical rename happens once and every row referencing the old path adopts the observed form, including a row exempted by the payload-keyed rule, whose bytes' identity is read before the rename moves them (it follows the file and keeps its own Compressed). Blank-row findings are reported only. Enumeration recognises infrastructure only at each folder's own root (B6/SN-018). The outcome maps to the SR-040 table, and nothing in the backup run calls the audit. The verify entry point resolves the set's roots read-only, so verification creates no directory, does not require the source path, and reports a missing backup root as code 2. After a change to the already-compressed list or to the compression settings the pool can legitimately hold both forms of one (hash, length): content archived before the change and re-added raw after it. Cross-change deduplication keeps one copy and blanks the other snapshot row, whose recorded Compressed can then disagree with the surviving object; the resulting BlankRowFormDisagreement on that blanked row is expected and benign (reported only, never repaired), and restore is unaffected because both restorers decide the form from the file they locate."""
test_refs = "TC-091;TC-093;TC-094;TC-102;TC-229"
status = "Drafted"

[design.LLR-050]
sr_refs = ["SR-050", "SR-040", "SR-029"]
title = "Hash recovery reports the located file's form"
module = "Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Find-DataFileByHash;find_by_hash"
detail = """A pool lookup's Found result in both restorers also reports the located file's form: Archive when the match was proven by expanding an archive candidate, Raw when proven by hashing the file itself. When a row is recovered by hash, the restore loop records that form and decides whether to expand from it; a row with a non-blank DataPath is decided per LLR-068. Every archive candidate that does not yield the payload is re-tested as raw bytes (length and hash) before it is dropped, whether the expand failed (an archive name over raw content) or succeeded with other content (a genuine archive source file stored raw, whose own bytes are the row's content). If that raw-bytes test cannot read the file, the read failure is recorded once as StorageUnreadable and the candidate loop continues, since 7-Zip could not have helped read an unreadable file; only a candidate whose raw bytes were read successfully and did not match still records DependencyMissing when 7-Zip is unavailable. The shell restorer mirrors this, including the no-7-Zip arm. No new tool, state or index column is involved."""
test_refs = "TC-092;TC-098;TC-099"
status = "Drafted"

[design.LLR-051]
sr_refs = ["SR-051", "SR-006", "SR-059"]
title = "Reference-counted deletion at every pool-removal site"
module = "FileBackup.Engine"
code_symbol = "Save-SupersededData;Move-RemovedFilesToStaging"
detail = """Both steps that remove bytes from the pool, evicting removed files and preserving superseded data, ask the same question before removing anything: does any row of the FINAL index still claim this DataPath? (B9). A test based on the source rows instead cannot see a frozen row (SR-055/SR-057) or a row whose replacement copy failed, and would move out bytes those rows still claim. These two steps are the only pool-removal sites in a backup run, so the invariant lives entirely at them."""
test_refs = "TC-118;TC-135"
status = "Drafted"

[design.LLR-052]
sr_refs = ["SR-052", "SR-023", "SR-043"]
title = "Cross-platform free-space preflight"
module = "FileBackup.Common;FileBackup.Engine;Reconstruct.ps1"
code_symbol = "Get-FreeSpaceBytes;Get-VolumeIdentity;Assert-BackupCapacity;Invoke-BackupSet"
detail = """Free space is measured in the shared library, so the restore kit stays self-contained. The measurement resolves the path's containing volume from its full path, falls back to the drive for a drive-qualified path, and answers 'unknown' only when neither works; it never throws. Volume identity comes from the mount table: the longest real mount point that prefixes the resolved path on a separator boundary, so two paths on one POSIX mount (for example /backup and /backup/sub) are recognised as one volume. The PowerShell restorer's capacity check uses this, so SR-023 works for a rooted POSIX path. The backup capacity check sums the run's additions per volume: new (hash, length) groups the backup does not already hold, at uncompressed Length (a blank-DataPath row holds no bytes, so its heal copy is budgeted), plus the staging bytes only when the change root is on a different volume from the backup root. Demands on one volume are summed against that volume's free space, because checking them separately passed two demands that each fitted and together did not. A shortfall fails the set with a classified precondition failure (entry-point status 1) before any mutation: it is checked after the diff and before superseded data is preserved, the last point at which nothing has been written, so a refusal leaves none of this run's content written and no staging area orphaned. This is not a claim that the tree is byte-identical: nothing already stored is ever re-formed (SR-061), so there is nothing to migrate and nothing to size. An unmeasurable volume is skipped, not refused. There is no new configuration key (SR-042's schema is closed)."""
test_refs = "TC-100;TC-101"
status = "Drafted"

[design.LLR-053]
sr_refs = ["SR-053"]
title = "Blank rows re-enter the diff; dedup adoption requires a non-blank DataPath"
module = "Modules/FileBackup.Engine.psm1"
code_symbol = "Compare-SourceToBackup;Invoke-BackupFileGroup"
detail = """A row whose metadata equals the source but whose DataPath is blank counts as new-or-changed in the diff (a pure comparison). Deduplication adopts an existing stored object only from a row with a non-blank DataPath, so a (hash, length) group whose existing rows are all blank is copied afresh and every logical name in it, the healed row included, points at the newly written object. Preserving superseded data is unaffected: a heal row has the same content as its blank predecessor, so the same-content guard skips staging it."""
test_refs = "TC-103"
status = "Drafted"

[design.LLR-054]
sr_refs = ["SR-054", "SR-046"]
title = "Verify runs the pool audit; the blank-row form rail is kit-revision-gated"
module = "FileBackup.ps1;Modules/FileBackup.Engine.psm1"
code_symbol = "Invoke-VerifyAction;Test-PoolResolves"
detail = """-Action Verify runs the pool-resolution check alongside the storage-form audit, in the same guarded step, so a path failure stays code 2 and findings drive code 1. Each pool-resolution problem names its folder, RelativePath and DataPath and is reported as a finding: PoolDataPathMissing when the bytes still survive elsewhere in the pool (checked on disk against the content index, excluding the missing path itself), and PoolUnresolvable only for a row that genuinely has no bytes left. For a blank-DataPath row, a folder whose kit revision is 2 or higher skips the located-copy form comparison entirely, because that kit decides the form from the file (SR-050); below 2 the refusal remains, and its message names the kit revision and the -Action Verify -RefreshKits remedy. The backup capacity check does not count a blank-DataPath row as held, so heal copies are budgeted. The non-blank-DataPath form check is unchanged."""
test_refs = "TC-104;TC-105"
status = "Drafted"

[design.LLR-055]
sr_refs = ["SR-055"]
title = "Portable-name guard in the source scan"
module = "Modules/FileBackup.Engine.psm1"
code_symbol = "Test-PortableRelativePath;Update-SourceManifest;Invoke-BackupSet"
detail = """A relative path is classified per component as portable or not, returning nothing or a reason. On Windows both slashes separate components, elsewhere only '/'; a reserved device-name stem (CON, PRN, AUX, NUL, COM1-9, LPT1-9, in any case, with or without an extension) is non-portable. The platform is injectable, so the POSIX-only backslash rule can be exercised on Windows. The source scan skips a non-portable name before trying to open or hash it and records its RelativePath and reason. The run logs one ERROR per record and marks the set failed, and leaves the skipped names out of the removed-from-source set, so an existing row is frozen rather than evicted."""
test_refs = "TC-106;TC-117"
status = "Drafted"

[design.LLR-056]
sr_refs = ["SR-056"]
title = "Restore verify-after-write and one-shot pool recovery"
module = "Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Restore-OneRow;restore_one"
detail = """After a row's object is successfully expanded or copied, the restored file is hashed and its (Length, xxH2Hash) compared against the row. On a mismatch the file is deleted and the pool recovery by (hash, length) is attempted exactly once, as if the row had a blank DataPath, and the result is verified again. There is one verify implementation and one restore-this-row implementation in each restorer, called at most twice per row. No exclusion state is needed: the pool locator hashes every candidate itself, so a wrong-bytes file cannot be returned as a match. A row that still fails verification after the one recovery attempt is recorded as the content-class cause ContentMismatch, not as a host cause (SR-040/SR-056). When the locator proved its source and the written file still mismatches, the cause is the host-class WriteMismatch and there is no second search; a read-back failure is host-class and the file is kept."""
test_refs = "TC-108;TC-109;TC-110"
status = "Drafted"

[design.LLR-057]
sr_refs = ["SR-057"]
title = "Hidden and dot entries captured at every enumeration"
module = "Modules/FileBackup.Engine.psm1;Modules/FileBackup.Common.psm1;Reconstruct.ps1"
code_symbol = """Get-DataFile;Update-SourceManifest;Optimize-ChangeFolders;Get-PoolSnapshotFolder;Get-SnapshotPrunePlan;Invoke-PruneEntrySweep;Expand-FileWithSevenZip;Find-DataFileByHash"""
detail = """Every enumeration of the source, the pool and the change root includes hidden and system entries and descends into hidden directories: the source walk (including the cached-hash path), cross-change deduplication's scan of change folders, the snapshot inventory, the prune plan's physical-bytes accounting (so the reported reclaim counts hidden files it deletes), the prune entry sweep's residue scan, the archive-expansion temporary folder, the restorer's pool scan and its snapshot-folder listing (so a hidden snapshot folder or hidden pool file stays recoverable). Reparse-point and symlink traversal semantics are unchanged: hidden capture does not follow links. The shell restorer already enumerates dot-files and does not follow links, both by intent (SR-057)."""
test_refs = "TC-113;TC-114"
status = "Drafted"

[design.LLR-058]
sr_refs = ["SR-058", "SR-060", "SR-003", "SR-013"]
title = "Content-addressed copy with owner election and intra-run memo"
module = "FileBackup.Engine"
code_symbol = "Invoke-BackupFileGroup;Resolve-GroupStorageForm"
detail = """Every stored object is named from its content. Each (hash, length) group elects an owner (the shortest RelativePath, ties broken ordinally), whose extension and storage-form decision (LLR-086) define the group's single physical form; the first member writes it, and every later member in the same run adopts it. The storage-form decision is made lazily and once per group: only on first entry to the write path, never before, and remembered for the rest of the group. Laziness keeps deduplication hits and same-run twins from probing at all, because they never reach the write path; remembering keeps a group whose first member's copy fails from re-probing and re-warning once per failing member. Nothing reads the form before the write path."""
test_refs = "TC-119;TC-120;TC-121;TC-226"
status = "Drafted"

[design.LLR-059]
sr_refs = ["SR-059", "SR-010", "SR-028"]
title = """Superseded-data preservation after copy/evict, survival tested against the final manifest"""
module = "FileBackup.Engine"
code_symbol = "Save-SupersededData"
detail = """Preserving superseded data runs after the copy and evict steps (nothing is overwritten, because every object is named from its content) and asks whether any row in the FINAL index still claims the old row's DataPath, the same claim test eviction uses (B9). Testing by DataPath is conservative in the direction that matters: a claim always keeps its bytes in the pool. Where one content is stored under two names, the unclaimed one is at worst parked in the newest snapshot, still inside the restore pool. Frozen rows (SR-055/SR-057) and rows whose copy failed keep their claim in the final index, so their objects stay in the pool. There is one code path."""
test_refs = "TC-118;TC-122;TC-135"
status = "Drafted"

[design.LLR-060]
sr_refs = ["SR-061"]
title = "Sanitize kept; legacy store refused by engine AND both restorers"
module = "FileBackup.Engine"
code_symbol = "Test-BackupManifest;Invoke-BackupSet;Reconstruct.ps1;reconstruct.sh"
detail = """No backup run migrates the storage layout. Before mutation the run checks the index for unreferenced and missing data (the sanitize step) through the one linear orphan scan (SR-064). A row carrying StoredAsHashSize='Original' fails the set before mutation, with the remedy of starting a fresh backup path. Both restorers scan the authority index before the target exists and refuse with the precondition code (2) when any row carries StoredAsHashSize='Original' (the authoritative marker, matching the engine) or a DataPath containing a path separator (the structural marker, which still catches a store whose column was lost). Nothing is written."""
test_refs = "TC-124;TC-138"
status = "Drafted"

[design.LLR-061]
sr_refs = ["SR-062"]
title = "Manifest-derived browse view generator"
module = "FileBackup.Engine"
code_symbol = "New-BrowseViewIndex"
detail = """Generates a browse view under the resolved view root (by default <BackupPath>_View): a tab-separated index, one HTML page per folder and a root search page. Entry names come from the row: RelativePath, plus '.7z' exactly when the row's Compressed is 'Yes'. The view carries a stamp that is a SHA-256 of the canonical index ROWS, deliberately not the index witness, because a manifest-identical run can rewrite the CSV with different quoting. The generator refuses a view root that is on another volume or that overlaps any owned path in either direction, and, as an independent second guard, refuses to wipe a view root holding anything that is not a generated view. View code lives only in the engine; the shared library never grows it (AGENTS.md section 3)."""
test_refs = "TC-129;TC-130;TC-133"
status = "Drafted"

[design.LLR-062]
sr_refs = ["SR-064"]
title = "Linear unreferenced-data audit"
module = "FileBackup.Engine"
code_symbol = "Test-BackupManifest"
detail = """The unreferenced-data audit builds one lookup of referenced DataPaths and checks each on-disk file against it, rather than re-scanning the index per file, so the audit is linear. The lookup compares paths the way the filesystem does, so a case-differing pair on Linux is not conflated."""
test_refs = "TC-132"
status = "Drafted"

[design.LLR-063]
sr_refs = ["SR-063", "SR-042"]
title = "Config contract v2: removed-key refusal and view keys"
module = "FileBackup.Engine"
code_symbol = "Assert-NoUnknownConfigKey"
detail = """The configuration schema version is 2. PreserveFolderTree is not in the closed key set, and a configuration that carries it is refused with a named diagnostic (not the generic unknown-key message) for JSON and CLIXML alike. BrowseView and ViewPath are in the key set with their vocabulary and placement checks. CompressProbe is in the key set with the same treatment as every optional key (LLR-042): exact-lowercase vocabulary off, excluded-extensions, always, defaulting to always. An optional key with a default is additive, so ConfigVersion stays 2; an older build refusing such a key by name is the closed schema working as designed, not a break."""
test_refs = "TC-125;TC-126;TC-127;TC-128;TC-227"
status = "Drafted"

[design.LLR-064]
sr_refs = ["SR-062"]
title = "-Action View dispatch"
module = "FileBackup.ps1"
code_symbol = "Invoke-ViewAction"
detail = """-Action View forces a rebuild of the browse view and reports through the SR-040 status table; the backup run also refreshes the view at its end."""
test_refs = "TC-131"
status = "Drafted"

[design.LLR-065]
sr_refs = ["SR-065"]
title = "Directory sidecar: empty directories and folder attributes"
module = "FileBackup.Engine;FileBackup.Common;Reconstruct.ps1;reconstruct.sh"
code_symbol = """Get-SourceDirectoryRecord;Write-DirectorySidecar;Get-DirectoryAttributeToken;ConvertTo-DirectoryAttributeFlag;Restore-DirectorySidecar;parse_dir_sidecar;apply_dir_sidecar"""
detail = """The source walk, including hidden entries, records each directory that is EMPTY of files or carries a recorded attribute, with its RelativePath and attributes. Emptiness is decided from the ancestors of the file rows the walk already produced, never by re-enumerating each directory, so the pass stays linear in directories plus file rows (the SR-064 discipline). A directory the walk could not enumerate is NOT recorded, because claiming empty for an unreadable directory would be a lie in the dangerous direction; a non-portable directory name (SR-055) is skipped with a warning rather than failing the set a second time. The recorded attributes are Hidden, System, ReadOnly and NotContentIndexed, the only four that can be applied to a directory: Archive, Temporary and Offline are meaningless on one, and Compressed, Encrypted, ReparsePoint and the ReFS integrity bits cannot be set that way at all. Rows sort ordinally, so two runs over the same state write byte-identical sidecars. The directory sidecar (DIRECTORIES.csv) is written beside the index after the index, and is removed when there are no rows, so a tree with no empty or attributed directory is byte-identical to a store without the feature. The prior sidecar is copied into staging so a snapshot keeps its own point in time; it is deliberately not in the kit-artifact list. Both restorers apply it LAST, after every file is written and verified: directories are created parents first and attributes applied deepest first, path traversal is refused as it is for index rows, and the shell restorer creates the directories but reports the Windows attributes as inapplicable on POSIX rather than dropping them silently. The sidecar is advisory and unwitnessed: absent, unreadable or malformed, it leaves exactly the behaviour of a store without it and never fails a restore."""
test_refs = "TC-137"
status = "Drafted"

[design.LLR-066]
sr_refs = ["SR-066"]
title = "Restored files carry their own modification time"
module = "Reconstruct.ps1;reconstruct.sh"
code_symbol = "Set-RestoredLastWriteTime;stamp_mtime"
detail = """Both restorers apply the row's own LastWriteTimeStr after the SR-056 (hash, length) verification passes, including after a hash-recovery retry, so a file that was deleted and rewritten never keeps a stamp from the failed attempt. The time is parsed from the index's ISO-8601 round-trip form; where a userland cannot take fractional seconds, the shell restorer retries with them stripped. Stamping is never fatal: the bytes are correct and verified by the time it runs, so a blank or unparseable cell warns and the row still counts as restored. A read-only file does not block it, because setting a file's time needs only the right to write its attributes, which a read-only file grants. This stops a deduplicated row from inheriting the pool object's timestamp; when the time rode along with the copy, every twin got the owner's."""
test_refs = "TC-136"
status = "Drafted"

[design.LLR-067]
sr_refs = ["SR-067"]
title = "Bounded copy retry with a per-run budget"
module = "FileBackup.Engine"
code_symbol = "Invoke-BackupFileGroup;Get-CopyRetryDelayMs;Test-CopyFailureIsTransient"
detail = """Copying a content group's object is retried in attempt rounds: each round tries every member of the group, then waits and retries the whole list. The waits are 250 ms and then 1000 ms, so three attempts cost at most 1.25 s of waiting per file. Only the refusal to write onto a directory at the destination is treated as permanent, since waiting cannot change it; every other failure is treated as possibly transient, because guessing wrong that way costs time while guessing wrong the other way costs the file. The destination is cleared between rounds, so a retry never lands on or merges into partial debris (SR-004). The retry budget belongs to the set: one budget per set is shared by every group, so a systemically unreadable tree cannot sleep the run away; a direct call without a budget gets a fresh local one. On exhaustion the error names the attempt count and states that the file is NOT in the backup; no row is added for it, and the run is marked unsuccessful. A row from an EARLIER run survives untouched, the same frozen-row treatment SR-055/SR-057 give a file the walk could not read."""
test_refs = "TC-140"
status = "Drafted"

[design.LLR-068]
sr_refs = ["SR-068"]
title = "Byte-derived stored form in the kit"
module = "FileBackup.Common;Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Get-StoredObjectForm;stored_object_form"
detail = """The stored-form test used by the restorers lives in the shared library, because the restore kit does not bundle the engine (where the audit-side equivalent lives). Cheapest test first: no 7-Zip signature in the first six bytes returns Raw conclusively, since the engine never writes a compressed object without one; a signature with a length different from the row's Length returns Archive on a stat alone; equal lengths hash the file, and a match against the row's xxH2Hash returns Raw because the bytes ARE the content (the user's own archive). An unreadable object returns Raw rather than guessing, so the caller's copy attempt surfaces the real I/O error. Both restorers decide a DataPath-resolved row's form with this test instead of the row's Compressed column; a hash-recovered row keeps the form the pool lookup proved (SR-050). The shell restorer's twin reads the signature with standard coreutils and reuses its XXH128 wrapper. The Compressed column survives in the 9-column schema and still feeds the capacity ESTIMATE in both restorers, which is explicitly approximate and warns when compressed rows exist."""
test_refs = "TC-141"
status = "Drafted"

[design.LLR-069]
sr_refs = ["SR-069", "SR-061"]
title = "Base-57 name codec and the one canonical parser"
module = "FileBackup.Common"
code_symbol = """Convert-HexToShortName;Convert-ShortNameToHex;Get-HashSizeFileName;ConvertFrom-HashSizeFileName;Test-HashSizeFileName;Test-LegacyStoredObjectName"""
detail = """The object-name codec encodes hex to base-57 and refuses an encoding wider than its field rather than keeping the rightmost characters, because a truncated name cannot be checked against the index it addresses. Decoding normalises to an exact hex width, removing any spurious sign digit and restoring leading zeros, and refuses a field wider than the target. A name is built as "<hash22>_<len><ext>". There is exactly one parser: the first 22 characters are the hash, the separator sits at index 22, base-57 digits run to the first dot, and the remainder is an opaque extension that must be free of path separators; a malformed name yields 'no parse', never an error. Two predicates answer different questions: 'is this the current grammar?' and 'is this a RETIRED grammar?' (the structural half of the SR-061 legacy gate). The retired-grammar test is a positive test, never the negation of the first, so a damaged DataPath stays repairable rather than being taken for a legacy store. The shell restorer carries only the retired-grammar predicate (structural; it uses no decoded value) and no current-grammar predicate, which would be dead weight in a file bundled into every backup, since the pool locator matches content rather than names. The PowerShell and shell retired-grammar predicates agree on every name."""
test_refs = "TC-004;TC-142;TC-143;TC-144;TC-145;TC-147;TC-149;TC-150;TC-151;TC-152;TC-153"
status = "Drafted"

[design.LLR-070]
sr_refs = ["SR-070"]
title = "The stored extension is opaque and may be empty"
module = "FileBackup.Common;FileBackup.Engine"
code_symbol = "Get-HashSizeFileName;Invoke-BackupFileGroup"
detail = """The stored name's extension may be empty: a source file with no extension (README, LICENSE, Makefile) is backed up normally and never fails the set, with compression on or off. The owner's extension is carried verbatim, never validated against the SR-069 alphabet, and the name parser preserves it byte for byte."""
test_refs = "TC-146;TC-148"
status = "Drafted"

[design.LLR-071]
sr_refs = ["SR-071"]
title = "POSIX size, temp, time and space shims"
module = "bash/reconstruct.sh"
code_symbol = "stat_size / make_tempdir / iso_now / stamp_mtime_posix"
detail = """The shell restorer measures a file's size portably across GNU, BSD and POSIX userlands. It selects a measuring style once, by probing a known regular file, and accepts a style only when its output is numeric, because a style that ignores its argument would otherwise succeed on a working directory holding a file named like its format string; it falls back to the POSIX byte count. Temporary directories are always created from an explicit template (GNU supplies a default, BSD does not), and every caller checks the result, because an unchecked failure leaves the path empty and once wrote the 7-Zip self-test probe to the filesystem root. Current-time stamps use an explicit POSIX format. Where the native time-setting form is unavailable, a restored file's modification time is still set exactly for EVERY ISO-8601 offset, by carrying the offset as a POSIX TZ value (whose sign is the inverse of ISO-8601, so '-06:00' becomes 'UTC+6:00'), rather than refusing any offset other than UTC or the host's, which would silently drop SR-066 on BSD for any store written in another timezone."""
test_refs = "TC-155, TC-156, TC-158, TC-160, TC-161, TC-182"
status = "Drafted"

[design.LLR-072]
sr_refs = ["SR-071", "SR-009"]
title = "Canonicalisation that refuses rather than guesses"
module = "bash/reconstruct.sh"
code_symbol = "canon / is_inside"
detail = """Path canonicalisation in the shell restorer resolves a path physically where the platform can; otherwise it REFUSES any path containing a '..' component and reports failure rather than returning its raw input. Lexical '..' reduction is not path resolution: with a symlink outside -> backup, link/../backup/x resolves INSIDE the backup by kernel semantics but OUTSIDE lexically, so reducing first would walk a restore into the root SR-009 protects. The containment test is TRI-STATE (inside, outside, indeterminate) because the safe branch differs by caller: the target guard refuses unless the target is provably OUTSIDE the backup, and the traversal guards reject a path unless it is provably INSIDE the target. Every canonicalisation call site handles failure, including the sidecar containment case, where an empty result would leave the glob '/*' and match every absolute path."""
test_refs = "TC-157, TC-159"
status = "Drafted"

[design.LLR-073]
sr_refs = ["SR-073", "SR-016"]
title = "Target-prompt decision core and its dialogs"
module = "Reconstruct.ps1, bash/reconstruct.sh"
code_symbol = "Test-ShouldPromptGraphically / Select-FolderInteractively / pick_target_dir"
detail = """The decision whether to prompt for a restore target, and how, is PURE: every signal is an input and the answer is None, Text or Gui, so the whole matrix can be exercised without a dialog. The interactive folder picker is the I/O shell around it: its picker is injectable for tests, it never throws, and when the current thread is not in a single-threaded apartment (PowerShell 7.0 to 7.2 default to multi-threaded) it shows the dialog from a runspace created in a single-threaded apartment. It must not use a bare thread without a runspace: a PowerShell script block on such a thread raises an unhandled exception that terminates the process. Platform dialogs: the Windows folder browser, macOS 'choose folder', zenity, kdialog. The shell restorer's picker is reached ONLY via --pick-target and honours FILEBACKUP_PICKER, invoked quoted so a picker path containing spaces is not split, so tests can drive it headlessly. A cancelled or missing dialog leaves the target empty, and the existing required-argument check then prints usage and exits 2."""
test_refs = "TC-162, TC-163, TC-164, TC-165, TC-166, TC-167, TC-183, TC-184"
status = "Drafted"

[design.LLR-074]
sr_refs = ["SR-072"]
title = "Launcher generation and the window hold"
module = "Modules/FileBackup.Engine.psm1, Reconstruct.ps1"
code_symbol = "New-ReconstructScript / Wait-BeforeClosing"
detail = """The kit's Windows launcher, RECONSTRUCT.cmd, is CRLF, ASCII, and a single pwsh line passing -ExitCode and all its arguments; reconstruct.command is copied beside it. The .cmd is a PURE PASSTHROUGH and never pauses, because a pause also fires for a console-attached automated caller that passes no arguments and hangs it without returning its exit code. Holding a double-clicked window open is the restorer's job instead, and only when the target came from a picker or a prompt, so the hold can never reach automation. reconstruct.command changes to its own folder (Finder starts it in the home folder), adds --pick-target when given no arguments, and invokes the restorer through 'bash --', so the shell restorer needs no executable bit."""
test_refs = "TC-168, TC-169, TC-170"
status = "Drafted"

[design.LLR-075]
sr_refs = ["SR-007", "SR-022"]
title = "Seven-artifact kit, with the legacy name still recognised"
module = "Modules/FileBackup.Common.psm1, Modules/FileBackup.Engine.psm1"
code_symbol = """ReconstructCmdName / ReconstructCommandName / ReconstructLegacyBatName / Get-IsInfrastructureFile"""
detail = """One kit artifact list of seven names serves the kit deposit, snapshot staging and the kit refresh (-RefreshKits). The retired launcher name RECONSTRUCT.bat is never written but stays in the root-level infrastructure set permanently: a snapshot keeps the kit it was written with, so every older store still holds a RECONSTRUCT.bat, and dropping the name would make every run report it as an orphan or not-in-index row (SR-022). The kit refresh copies and never deletes, so a refreshed older store legitimately holds both launcher names."""
test_refs = "TC-171, TC-172"
status = "Drafted"

[design.LLR-076]
sr_refs = ["SR-007", "SR-049"]
title = "One kit revision, pinned so it cannot drift again"
module = "Reconstruct.ps1, bash/reconstruct.sh, Modules/FileBackup.Engine.psm1"
code_symbol = "KitRevision marker / Get-BackupKitRevision"
detail = """Both restorers carry a '# KitRevision: <n>' marker with the same value. The marker moves whenever a kit-bundled file changes behaviour (AGENTS.md section 3), including the shared library when the change does not touch restore logic. One reader reads it from a folder's bundled PowerShell restorer. The marker records what a BUNDLED kit does, and a deployed copy cannot be rewritten, so a marker found to be wrong is corrected forward to the next number, never back-dated. The two markers are kept equal."""
test_refs = "TC-173"
status = "Drafted"

[design.LLR-077]
sr_refs = ["SR-007"]
title = "Restores never inherit a read-only pool"
module = "Reconstruct.ps1, bash/reconstruct.sh"
code_symbol = "Restore-OneRow / restore_one"
detail = """Both restorers clear the read-only attribute on every file they write, at the single write point so the expand path is covered too, and BEFORE the SR-056 verification and the SR-066 timestamp so both act on a writable file. Copying propagates the read-only attribute or mode bits from the source, so a write-protected store would otherwise hand its protection to the restored tree. For the same reason a source file that was read-only at backup time is not restored read-only: read-only state is not part of what a restore reproduces."""
test_refs = "TC-174"
status = "Drafted"

[design.LLR-078]
sr_refs = ["SR-074", "SR-057", "SR-022"]
title = "Root-level volume pseudo-folder exclusion"
module = """Modules/FileBackup.Common.psm1, Modules/FileBackup.Engine.psm1, Reconstruct.ps1, bash/reconstruct.sh"""
code_symbol = "Test-IsVolumeRootPseudoPath / Get-DataFile / Find-DataFileByHash / volume_root_skip"
detail = """A path is a volume-root pseudo-folder when its FIRST relative segment is one of the volume-root skip names (System Volume Information, $RECYCLE.BIN) AND the root it is relative to is itself a filesystem volume root; the folder and its contents are one test. Without the volume-root condition, a user's own folder of the same name would be excluded and its files silently lost. The test lives in the shared library so the engine and the standalone restorer use one definition. The engine's data enumeration filters BOTH the returned files and the enumeration-error records: the first stops recycle-bin contents being backed up, the second stops 'System Volume Information' marking the set failed. The restorer's pool scan filters both its candidate list and its enumeration errors; filtering only one would leave half the false verdict in place. The shell restorer's twin is a no-op on a native POSIX filesystem but correct on a mounted NTFS volume; it decides volume-root status from the system's mount points and answers 'not a volume root' when detection fails, the safe direction: scan rather than skip."""
test_refs = "TC-175, TC-176, TC-177, TC-178, TC-180"
status = "Drafted"

[design.LLR-079]
sr_refs = ["SR-009"]
title = "Physical path containment for the target guard"
module = "Reconstruct.ps1"
code_symbol = "Resolve-PathPhysically / Test-PathIsInside"
detail = """The restore-target containment test resolves BOTH paths physically before comparing: it walks up to the deepest EXISTING ancestor, resolves that ancestor's link target when it is a reparse point, and re-appends the non-existent tail, which is sound because a path that does not exist cannot contain a link. Lexical normalisation alone normalises separators and '..' but never follows a junction, so 'C:\\outside\\link\\restore', where 'link' is a junction to the backup, would compare as OUTSIDE and the restore would write into the backup. This matches the shell restorer's canonicalisation (LLR-072)."""
test_refs = "TC-181"
status = "Drafted"

[design.LLR-080]
sr_refs = ["SR-075", "SR-017"]
title = "Staging owner record, heartbeat and lock classifier"
module = "FileBackup.Engine"
code_symbol = """Write-StagingOwnerRecord;Read-StagingOwnerRecord;Read-StagingMarkerText;Get-StagingLockState;Start-StagingHeartbeat;Stop-StagingHeartbeat;StagingHeartbeat"""
detail = """The staging-lock ownership helpers belong to the backup-only engine, not the shared library: the library is bundled into every restore kit, so a change there would move both kit-revision markers, and staging-lock ownership has no restore-side meaning. The rule is a dependency direction (the library must not depend on the engine), not a demand that engine concepts move down. Owner record: a once-only JSON payload (SchemaVersion, Kind, a fresh-GUID RunId, set name, host, container id, boot id, pid, StartedUtc, HeartbeatIntervalSeconds, StaleAfterSeconds 1800) written DIRECTLY to RUN.inprogress by a create-new open: one kernel operation that both creates the file and proves exclusivity, with no temporary file and no rename. A temporary write plus a non-overwriting rename is check-then-rename on Unix and so not exclusive there, its atomic variant needs hard links that exFAT lacks, and a crash mid-publish would strand a temporary file in a folder the run may no longer own, which every later classification would read as HoldsContent, a permanent wedge. The record is written only after the staging area was created successfully; a create-new collision is lock-lost, and the caller aborts touching nothing. Torn reads stay safe on the reader side: ParseInvalid with a fresh modification time classifies OwnerLive and refuses. Every marker read goes through one share-tolerant reader, so the heartbeat's open handle cannot make the engine's own fence and classifier reads fail. A read returns its state (Parsed, ParseInvalid or Unreadable), the record, its last-write time and its age; ParseInvalid with the time fields populated is a normal, expected answer (a torn record is exactly a dead writer), while Unreadable is distinct and refuses upstream. The classifier is PURE of I/O decisions: it takes the caller's forced, fail-closed listing and the record and returns one of Empty, EmptyFresh, OwnerStale, OwnerLive, PruneHeld, HoldsContent or Indeterminate, so the whole matrix can be exercised with no filesystem. The roughly 90 s confirmation sample belongs to the caller (LLR-017), which is what keeps the classifier pure. Heartbeat: the beat runs on its own timer, independent of the run's pipeline, so a long hash cannot starve it and a beat can never terminate the process. Starting it performs ONE synchronous beat before the timer is armed and refuses when that touch did not land: a store that rejects setting a modification time would otherwise beat into an unseen error, and after StaleAfterSeconds a live run would read as dead and be confirmed dead, because the confirmation sample detects change and nothing changes. The running heartbeat is kept reachable for the lock's whole lifetime, because an unreachable timer can be collected and stop silently, and nothing else would report it. Each beat re-reads the marker and touches it only when the RunId is its own, holding one open handle across the check and the touch and setting the time through that handle, so the touch lands on the very file the identity check verified; checking and then touching by path would let a reclaim landing between the two freshen the successor's marker. Stopping it reports the error count and last error when either is nonzero (a beat that fails mid-run cannot be made fatal but must not be invisible); it is idempotent, does not throw on a cleanup path, and DRAINS: it cancels, disposes the timer and waits out any in-flight beat, so no touch can land after Stop returns. The reclaim protocol these helpers serve has an exact order: (1) classify, with the confirmation sample on the stale branches; (2) move the staging area aside to Temp.stale-<utc>-<8 hex>, refusing on failure with no retry loop; (3) create a fresh staging area and IMMEDIATELY publish the new record, refusing on either failure and leaving the aside folder; (4) re-list the aside folder forced and fail-closed, delete the exact marker by name and then the folder non-recursively, keeping the folder on anything else, any I/O error, or either delete failing. Step 4 is the safety proof, not belt and braces: a frozen-then-resumed owner can write between steps 1 and 2, and a non-recursive delete is structurally incapable of taking a data file with it. The fence points are the FIVE phase boundaries of a backup run (before the staging index write, before eviction, before preserving superseded data, before the backup root's index publish and before the snapshot publish), where a marker whose RunId differs means the lock was lost and the run aborts cleaning up nothing; an unreadable marker is first retried three times about 300 ms apart. The staging OS lock (LLR-090) is a separate primitive and changes nothing here: the classifier is never told whether that lock is held, so holding it can never turn a verdict into a reclaimable one."""
test_refs = "TC-185;TC-189;TC-193;TC-196;TC-197;TC-199;TC-200;TC-201;TC-248"
status = "Drafted"

[design.LLR-086]
sr_refs = ["SR-081"]
title = "Sampled compressibility probe and composed storage-form decision"
module = "FileBackup.Engine"
code_symbol = """Measure-SampleCompressibility;Resolve-CompressionDecision;Invoke-BackupFileGroup;Resolve-GroupStorageForm;New-ProbeStatistic;Write-ProbeStatistic"""
detail = """The probe and the storage-form decision belong to the backup-only engine, never the shared library: the library is bundled into every restore kit, so placing them there would move both kit-revision markers for a concept restore has no use for, and the architectural rule is a dependency direction (the library must not depend on the engine), not a demand that engine concepts move down. Probe. The probe opens the source read-only, sharing reads only, the same sharing the hashing and stored-form reads use, so a successful probe predicts a successful copy. It returns 'no measurement' for any path it cannot open; that is a normal, expected answer, not an error. What that sharing buys is platform-qualified. On Windows a read-shared open fails while any writer holds the file, so the probe cannot sample a file open for writing. On POSIX file sharing is advisory, so a non-cooperating writer can change bytes under the sample; against that, and against a Windows writer that opens after the probe does, the probe reads the file's length and last-write time before and after sampling and returns 'no measurement' if either moved. The worst case is the list's answer. Geometry: with 256 KiB windows and three samples, a file shorter than three windows is read once, whole, as a single sample, which avoids over-reading files between 256 KiB and 768 KiB; otherwise three windows are taken at offsets 0, (len - 256 KiB) / 2 (rounded down) and len - 256 KiB, each filled completely unless end of file is reached first. Each window is compressed into a counting sink and its compressed size is read only after the encoder is closed, because a count taken earlier reads short and would call random bytes compressible. The probe reports the sampled and compressed byte totals plus the per-window ratios for the log line. An empty file is below the floor and never probed. Decision. The storage-form decision is a pure function with no I/O. Its inputs are: compression enabled, the set's CompressProbe mode (off, excluded-extensions or always), the already-compressed list's opinion (taken as if compression were enabled, so it carries only the list's view), the length, the size floor, the sampled and compressed byte counts, and the threshold. It returns whether to compress and a Reason in {CompressDisabled, ModeOff, BelowFloor, ListExempt, ProbeUnavailable, ProbeCompressible, ProbeIncompressible}, evaluating SR-081's ordered rule. There is no name-based override, so no input and no Reason is named after a format. Compression disabled is tested FIRST, and with it nothing is read at all. The ruled defaults are held in the engine: a file must shrink by at least 10 percent in aggregate (compressed / original <= 0.90) to be compressed, and files below 256 KiB are never probed. Neither is configurable (SR-081: two knobs nobody can measure), and the shared library exposes neither. Use. The set's CompressProbe value reaches the group copy; a direct call without it uses the default. The decision is made lazily and once per group (LLR-058). Deduplication hits and same-run twins never reach the write path and never probe, which is how SR-061 stays true: no already-stored object's form is ever re-decided. When it does decide, the probe walks the group's candidates, the owner first and then every member (the same list the copy uses, because a locked owner must not fail a group that a readable twin can serve), and samples the first that opens. Only when none opens is the decision ProbeUnavailable, which takes the list's answer with one WARN and never fails the run. Emission: one DEBUG line per written group, 'compress-decision: <rel> <Reason> ratio=<aggregate> windows=<r1,r2,r3>', and three per-set physical-object counters, incremented only after a successful write: 'Probe stored raw: <n> objects, <bytes>', 'Probe compressed: <n>', 'Probe reads: <bytes>'. Codec: Brotli at its fastest level, chosen because it made the fewest wrong decisions against the real whole-file 7-Zip -mx=9 outcome on a calibration corpus, and is also cheaper per sample than Deflate. Deflate's 32 KiB history cannot see a 64 KiB repetition even inside one 256 KiB sample, so it would store raw a file 7-Zip shrinks to nothing. A repetition period longer than a sample window cannot be seen by any codec; that is a limit of sample size and count, and its cost is one file stored raw that could have shrunk, a correct storage form either way (I-1), never a data risk. The decision rule is codec-agnostic."""
test_refs = "TC-223;TC-224;TC-225;TC-226;TC-227;TC-228;TC-230;TC-231"
status = "Drafted"

[design.LLR-087]
sr_refs = ["SR-082", "SR-025", "SR-038"]
title = "Atomic Write-Manifest"
module = "FileBackup.Common"
code_symbol = "Write-Manifest;Write-ManifestWitness"
detail = """The index writer builds the canonical rows and then: (1) deletes any temporary index left beside the destination by an earlier kill (a no-op when absent) and writes the new content to that temporary index, removing the partial file and re-raising on an ordinary failure; (2) publishes it over the destination with a single atomic overwriting rename (rename(2) on Linux, a replace-existing move on Windows), removing the temporary file and re-raising on failure; then (3) writes the witness over the PUBLISHED file, still AFTER the index, so a kill between (2) and (3) leaves a complete index beside a stale witness, which is a loud mismatch (SR-038). Test seams before the temporary write, after it and after the rename stand in for a kill that runs no cleanup. Not done, deliberately: an fsync of the temporary file before the rename, so a power loss (as opposed to a process kill) can still lose the newest write on a filesystem that reorders the rename ahead of the data; the earlier in-place write had no fsync either."""
test_refs = "TC-237;TC-238;TC-239"
status = "Drafted"

[design.LLR-088]
sr_refs = ["SR-083", "SR-017", "SR-022"]
title = "Manifest staging file allowlist and Temp tolerance"
module = "FileBackup.Engine;FileBackup.Common"
code_symbol = """Test-IsInfrastructureFile;Get-StagingLockState;Clear-ReclaimedStagingFolder;Remove-OwnStagingFolder;Get-FileBackupDefaults"""
detail = """The temporary index name MANIFEST.csv.tmp is root-level infrastructure, beside MANIFEST.csv.meta.tmp, in the backup root and in every snapshot, so the store's data enumeration, which the orphan scan, the storage-form audit and the prune sweep all use, never returns it. (The shell restorer already skips any root-level MANIFEST* name during hash recovery.) The staging-lock classifier ignores exactly that case-sensitive name before testing for unrecognised entries: a staging area holding RUN.inprogress plus the temporary index classifies by the marker alone (OwnerStale or OwnerLive), and one holding only the temporary index is Empty by the directory's modification time; any other entry still yields HoldsContent. Reclaim tolerates it in the aside folder and deletes it by exact name before the marker, and a run's own cleanup counts it among its disposable leaves. It is never the only copy of anything: it is an incomplete copy of a file that still exists beside it."""
test_refs = "TC-239;TC-240"
status = "Drafted"

[design.LLR-090]
sr_refs = ["SR-085", "SR-086", "SR-087"]
title = "Staging OS lock primitive"
module = "FileBackup.Engine"
code_symbol = "Get-StagingOsLockPath;Enter-StagingOsLock;Exit-StagingOsLock"
detail = """The staging OS lock is the file Temp.lock in the change root. Taking it opens the file, creating it if absent, with read access and no sharing: refusing all sharing IS the lock, and read-only access means a read-only attribute cannot wedge it. Any failure to open is retried up to 3 times, 250 ms apart, and then refused with a message beginning [SR-075/lock-held]. The platform error only chooses the wording (held by another process, or could not be opened); every branch refuses identically. The message does not use the lost-marker-lock prefix, so it is never mistaken for a lost marker lock. Releasing closes the file, makes a second release a no-op, accepts a lock that was never taken, never throws and never deletes the file. A test seam inside the same open guard stands in for an open failure. The lock belongs to the backup-only engine, which is not part of the restore kit."""
test_refs = "TC-241;TC-243;TC-249"
status = "Drafted"

[design.LLR-091]
sr_refs = ["SR-085", "SR-086", "SR-075"]
title = "Backup holds the OS lock across the no-marker window"
module = "FileBackup.Engine"
code_symbol = "Invoke-BackupSet;Initialize-StagingFolder;Invoke-StagingLockReclaim"
detail = """A backup run's opening order is: resolve the set's paths, creating missing roots; take the staging OS lock; read the prior state; create the run log; then set up staging. No read of store state precedes the lock. If the lock cannot be taken, the run appends one refusal line to the set's backup log (appending, never truncating, because the log belongs to the live holder), marks the set failed and returns. The prior-state reads (the last backup time, the guard against a populated index with no last backup time, and the witness gate) keep their order and run under a guard that releases the lock and re-raises the ORIGINAL error, so the witness refusal still maps to exit 3 and the backup log is left as the last run wrote it. Creating the run log is guarded the same way. Staging setup receives the held lock and passes it to reclaim, which only logs that a current-version holder is excluded and that an older FileBackup takes no OS lock; classification, the confirmation sample and the refusals are untouched (SR-086). If staging setup fails, the lock is released first. Otherwise the lock is released in the run's final cleanup, after the heartbeat is stopped and in a way that cannot be skipped; on the healthy path that is after the snapshot is published, run state is written, deduplication and the browse view run, and it also runs on every error and every lock-lost return. Test seams sit right after the marker is deleted and on either side of the snapshot-publishing rename."""
test_refs = "TC-242;TC-243;TC-244;TC-247;TC-248;TC-250"
status = "Drafted"

[design.LLR-092]
sr_refs = ["SR-085", "SR-086", "SR-046"]
title = "Prune holds the same OS lock"
module = "FileBackup.Engine"
code_symbol = "Remove-BackupSnapshot"
detail = """Prune takes the staging OS lock once, after resolving the roots and before working through the named snapshots, and so before committed-residue removal, the rails, the staging-area creation and every re-home, unless -WhatIf is in effect. If the lock cannot be taken, prune reports every named snapshot as Status Refused, Code 4 (retry later, as a backup; Get-StoreRefusalCode), with a single refusal of kind lock-held whose message is the [SR-075/lock-held] text, and returns. The lock is held for the whole batch and released in prune's final cleanup. The existing staging-area rail, the create-without-overwrite staging take and PRUNE.inprogress are unchanged. A test seam runs right after PRUNE.inprogress is written."""
test_refs = "TC-244;TC-245;TC-246;TC-249;TC-250"
status = "Drafted"

[design.LLR-093]
sr_refs = ["SR-087", "SR-085"]
title = "Lock file lifecycle and invisibility"
module = "FileBackup.Engine;Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = "Exit-StagingOsLock;Get-StagingOsLockPath;Get-PoolSnapshotFolder;Optimize-ChangeFolders"
detail = """Nothing deletes, writes or truncates Temp.lock. Every enumeration of the change root lists directories only (the engine's snapshot inventory additionally filters by the snapshot pattern, and every prune, audit, kit-refresh and -Action Snapshots path reaches the change root through it; both restorers build their pool from directories), so the lock file is invisible to all of them. Committed prune residue and the staging area are addressed by exact name."""
test_refs = "TC-241;TC-250"
status = "Drafted"

[design.LLR-094]
sr_refs = ["SR-085", "SR-086"]
title = "Repair and kit refresh hold the same OS lock"
module = "FileBackup.Engine"
code_symbol = "Enter-StoreMutationLock;Repair-BackupStorageForm;Update-BackupSnapshotKit"
detail = """Storage-form repair and the kit refresh hold the same staging OS lock. Taking it for them refuses a blank change root, creates a missing one, and then takes the OS lock; on any failure it logs one ERROR line through the caller's logger and refuses with a message carrying [SR-075/lock-held]. Repair takes it as its FIRST act, before the storage-form audit, so findings and repair see one state; the kit refresh takes it before listing the snapshots. Both skip it under -WhatIf, and both release it in a final cleanup around their whole body. The lock lives in the mutating operations, not in the verify entry point, so a direct module caller is covered; the verify entry point turns the refusal into exit code 2. A read-only -Action Verify runs only the storage-form audit and the pool-resolution check and takes no lock. Left lock-free because they do not write the store: -Action Snapshots, -Action View (it writes only the view root, which the SR-063 rails keep outside both roots), the -Deep audit (its scratch files are under the system temporary directory) and both restorers (they write only the restore target). Every other engine step that writes the store is a backup or prune step reached only from a backup run or a prune; several of those steps can also be called directly as module exports, and such a direct caller holds no lock."""
test_refs = "TC-251;TC-252;TC-253;TC-254"
status = "Drafted"

[design.LLR-095]
sr_refs = ["SR-014", "SR-042", "SR-063"]
title = "One store folder per backup set (plan C44)"
module = "FileBackup.Engine"
code_symbol = """Resolve-BackupSetDefaults;Resolve-BackupSetPaths;Assert-StoreLayout;Assert-StoreHistoryPresent;Get-SnapshotRoot;Resolve-ViewRootPath;Assert-SingleStoreMount;Test-BackupConfigurationShape;Assert-NoUnknownConfigKey"""
detail = """A backup set names one StorePath (ConfigVersion 3); BackupPath and ChangePath are refused by name in JSON and CLIXML, and versions 1 and 2 as too old. The loader derives the latest state as <StorePath>/CurrentBackup and the change root as <StorePath>, and the snapshots sit in <StorePath>/BackupHistory, with path arithmetic that needs no attached drive, so an unplugged store drive still reports 4 (C25). Path resolution creates a missing store, its BackupHistory and then its CurrentBackup only when safe: a store holding a MANIFEST.csv of its own, a folder beside CurrentBackup holding one other than the store's own View, Verify, Incoming and Temp folders, or a folder of old Snapshot_<date> folders, is an old-layout backup and is refused (2); a store holding snapshots but no CurrentBackup is refused (2), never answered with a fresh full backup; a store with a CurrentBackup but no BackupHistory is refused (2) for every action, with a message saying an empty BackupHistory folder lets the run go on, and BackupHistory is never created for an existing store. CurrentBackup, BackupHistory and the store must be one volume and one mount, proven by test renames. The browse view defaults to <StorePath>/View and may lie inside the store only there."""
test_refs = "TC-256"
status = "Drafted"

[design.LLR-096]
sr_refs = ["SR-069", "SR-058", "SR-003"]
title = "Shard folders of the latest state (plan C44, L8)"
module = "FileBackup.Common;FileBackup.Engine;Reconstruct.ps1;bash/reconstruct.sh"
code_symbol = """Get-StoredObjectShard;Get-StoredObjectPath;Get-StoredObjectFile;Get-MisplacedStoreObject;Get-StoreObjectIndex;Publish-StagedObject;Get-LatestObject;New-StoredObjectNameIndex"""
detail = """An object of the latest state lives at CurrentBackup/<xx>/<name>, xx being the first two characters of its name lowercased (the folder pattern ^[2-9a-z]{2}$, 'l' included); snapshots stay flat and a DataPath stays the bare name. One Common function gives an object's path from its state folder, its name and whether that folder is the latest state; the caller says which, nothing infers it from a folder's name. Listing the latest state reads a file only from its own shard folder, so the run's index, retention, the audit and both restorers' name indexes agree that a file anywhere else in CurrentBackup is no object. -Action Verify reports such a file as MisplacedObject and -RepairStorage moves it into Verify/. The shard folder is created before the rename that publishes an object into it; an emptied one is left in place."""
test_refs = "TC-258;TC-259"
status = "Drafted"

[design.LLR-097]
sr_refs = ["SR-055", "SR-065", "SR-001"]
title = "'/' as the only recorded separator (plan C44, L7)"
module = "FileBackup.Engine"
code_symbol = "ConvertTo-RecordedPath;Get-SourceFileList;Get-SourceDirectoryRecord;Invoke-BackupSet"
detail = """The source walk converts every relative path to '/' once, so MANIFEST.csv and DIRECTORIES.csv record the same RelativePath on every host and every later comparison (change detection, the unreadable-folder prefixes, case-only collisions, the directory record's ancestors) sees one form. On Windows '\\' becomes '/'; on Linux a '\\' is part of a name, which SR-055 refuses as unportable, so it is never recorded. The restorers keep mapping a '\\' to '/' on a POSIX host for a manifest an older engine wrote."""
test_refs = "TC-260"
status = "Drafted"

[design.LLR-098]
sr_refs = ["SR-007", "SR-009", "SR-010", "SR-031"]
title = "Restore kit revision 16: the store is found from the kit's own folder (plan C44, S3, L9)"
module = "Reconstruct.ps1;bash/reconstruct.sh;FileBackup.Engine"
code_symbol = "New-ReconstructScript;New-StoredObjectNameIndex;Resolve-RowDataSource"
detail = """Both restorers run from a folder named exactly CurrentBackup, whose parent is the store, or a dated folder whose parent is named BackupHistory, whose grandparent is the store; a dated folder anywhere else is no snapshot. The pool is <store>/CurrentBackup plus every dated folder in <store>/BackupHistory, and a restore from CurrentBackup still runs with BackupHistory missing, reporting a row whose object was in a snapshot as missing (1). No path sidecar is written or read and no sibling or child folder is guessed. From any other folder a restorer refuses with 2 before writing anything, unless -StoreRootOverride / --store-root names the store. The target must be outside the store and outside the restore's own origin folder. The kit has six files."""
test_refs = "TC-257;TC-259"
status = "Drafted"

# Native design draft: planned symbols/cases, no implementation or result evidence.
# Existing architecture is the baseline; see docs/plans/native-design-2026-11-05/review.md.

[design.LLR-151]
sr_refs = ["SR-018", "SR-042", "SR-123", "SR-134", "SR-135", "SR-129"]
title = "Whole-configuration admission"
module = "native/config"
code_symbol = "validate_configuration"
detail = "Parse the existing closed versioned JSON configuration into typed settings without creating logs or store files. Retain StorePath and the established single-store path derivation; reject unknown/retired keys, wrong types, missing fields and unsupported versions with a nonsecret field diagnostic. Derive explicit defaults and shipped examples from the same schema. Any configuration revision required by new fields is declared explicitly; do not invent a new configuration family merely because the implementation is Rust. At whole-configuration admission, reject readable notification secrets and accept only the declared protected credential references, without echoing values, before any set/action mutation. This applies even when notification is disabled or the requested action would not submit a notice."
rationale = "One validated representation prevents schema/loader disagreement and mutation before configuration refusal."
test_refs = "TC-261"
status = "Drafted"

[design.LLR-152]
sr_refs = ["SR-063", "SR-138", "SR-154"]
title = "Resolved root and view ownership admission"
module = "native/config"
code_symbol = "validate_location_graph"
detail = "Resolve existing ancestors and append normalized nonexistent tails. Compare configured sources, stores and owned derived-view areas using host path identity. Reject equal or ancestor-related protected roots, link aliases and duplicate set destinations before any set starts. Permit only a dedicated view area whose ownership is established without adopting unrelated existing files; lack of identity resolution refuses admission."
rationale = "Text-prefix checks confuse sibling names and aliases; deciding the complete configuration before iterating sets avoids partial mutation for an invalid later entry."
test_refs = "TC-262"
status = "Drafted"

[design.LLR-153]
sr_refs = ["SR-014", "SR-043", "SR-095", "SR-142"]
title = "Independent action dispatch and aggregate results"
module = "native/cli"
code_symbol = "dispatch_actions"
detail = "Validate the whole configuration, then execute admitted sets independently with a typed per-set result. Default an omitted container action to backup. Aggregate with invalid-request/configuration ahead of busy/host-stop, ahead of incomplete, ahead of complete; retain all per-set reasons. One set failure after admission does not skip the remaining sets."
rationale = "Separating configuration admission from per-set execution satisfies both no-mutation-on-invalid-config and failure independence."
test_refs = "TC-263"
status = "Drafted"

[design.LLR-154]
sr_refs = ["SR-016", "SR-019", "SR-118", "SR-132", "SR-133"]
title = "Required and optional dependency admission"
module = "native/tools"
code_symbol = "admit_tools"
detail = "Determine dependencies from the selected action and content form. Resolve local executable versions without interactive prompts; absent required tools refuse before store/restore writes with provisioning guidance, optional media tools emit a skipped-feature event. Initial native delivery offers guidance rather than automatic download. Script guidance covers a missing interpreter that cannot issue its own diagnostic."
rationale = "Conditional tool admission avoids requiring an extractor for raw-only recovery or a media utility for backup correctness."
test_refs = "TC-264"
status = "Drafted"

[design.LLR-155]
sr_refs = ["SR-085", "SR-086", "SR-107"]
title = "Supported ownership acquisition and release"
module = "native/platform"
code_symbol = "acquire_store_ownership"
detail = "Obtain an OS-lifetime exclusive lock on one persistent store-side lock file before a mutation. Use the same mechanism for backup, removal, repair, refresh and view publication in one validated configuration. Retain the open handle through finalization; never unlink the lock or reclaim by elapsed age. Return observed contention/access/I/O causes without inferring permission to proceed."
rationale = "OS owner-death release avoids stale-heartbeat fencing and keeps a suspended live owner protected."
test_refs = "TC-265"
status = "Drafted"

[design.LLR-156]
sr_refs = ["SR-001", "SR-074", "SR-088", "SR-089", "SR-093", "SR-094"]
title = "Source walk and declared exclusions"
module = "native/capture"
code_symbol = "walk_source"
detail = "Enumerate hidden/system/dot entries with a stack, retaining each directory enumeration result as complete, partial or unavailable. Exclude only volume-owned metadata/recycle locations at actual volume roots; do not exclude matching nested names. Source operations are reads only. Emit a capture error with the affected prefix instead of interpreting a failed listing as removal."
rationale = "A typed walk result distinguishes absence from unreadability while preserving owner content and read-only mounts."
test_refs = "TC-266"
status = "Drafted"

[design.LLR-157]
sr_refs = ["SR-021", "SR-055", "SR-092"]
title = "Portable names and collision groups"
module = "native/paths"
code_symbol = "classify_names"
detail = "Validate UTF-8 path components, separators and the declared source/target naming profile. Build equivalence groups using the actual supported target comparison profile, covering case and normalization, rather than treating hash equality as path equality. Persist unsupported-source prefixes for prior-row preservation. For restore collisions reject every member and report target-name collision; do not choose a winner by record order."
rationale = "Cross-host names need a separate comparison contract from content identity and from lexical containment."
test_refs = "TC-267"
status = "Drafted"

[design.LLR-158]
sr_refs = ["SR-011", "SR-024", "SR-105", "SR-005", "SR-100"]
title = "Metadata reuse and deterministic rereads"
module = "native/capture"
code_symbol = "select_capture_work"
detail = "Use the selected latest record as the change-detection baseline. Reuse a row only when size/time match, the scheduled reread is not due and its referenced object is available and not known unusable. Every/never/periodic schedules count elapsed time from the last completed full reread; checkpointing a partial pass does not advance that marker. Compare semantic state, not serialization order, when reporting changes. A forced recapture is an unchanged repair only if its fresh hash/length matches the recorded identity. Different captured identity is a source change even when source size/time matched. Change detection includes the represented directory tree, recorded directory attributes, folder-link kind and destination as well as file path/content/time. Adding, removing or retargeting only a folder/link retains the preceding state; serialization order, previous copies and operational bookkeeping alone do not."
rationale = "A source cache is unnecessary; separating reread completion from capture checkpoints prevents an interrupted verification pass resetting the schedule."
test_refs = "TC-268"
status = "Drafted"

[design.LLR-159]
sr_refs = ["SR-003", "SR-053", "SR-059", "SR-108"]
title = "Streaming capture and source-change detection"
module = "native/capture"
code_symbol = "capture_verified_object"
detail = "Copy into private staging while incrementally computing xxHash128 and byte length from the exact bytes copied. Compare pre/post source metadata and read errors to detect supported change cases; unstable or unreadable reads enter retry handling. Name content from the captured bytes, never from an earlier independent source hash. Consult actual usable object supply before deduplicating. Re-capture known lost content from source without claiming changed current bytes reconstruct a missing historical version. If recaptured identity differs from the missing prior identity, retain the prior state record, count a source change and separately report that the old content could not be recovered from this source."
rationale = "Content naming and capture must share one byte stream; metadata is a heuristic, not a coherent-snapshot proof."
test_refs = "TC-269"
status = "Drafted"

[design.LLR-160]
sr_refs = ["SR-067", "SR-090", "SR-091"]
title = "Bounded retry scheduling and frozen prior rows"
module = "native/capture"
code_symbol = "retry_failed_entries"
detail = "Maintain attempts and eligibility in a per-set queue: at most three attempts per file. Retry after other ready work, with proposed backoffs of 1 and 5 seconds; charge deliberate waiting once against one 60-second aggregate per-set budget, not once per file. Stop waiting when exhausted and report attempts. Retain prior rows for unreadable file/prefix groups; host-wide disappearance uses the source-stop rule. No failed new content acquires a successful row."
rationale = "A shared waiting budget avoids multiplying sleep time by the number of locked files; queue fairness prevents immediate repeated attempts consuming all chances."
test_refs = "TC-270"
status = "Drafted"

[design.LLR-161]
sr_refs = ["SR-036", "SR-091"]
title = "Missing and empty source stop semantics"
module = "native/capture"
code_symbol = "guard_source_availability"
detail = "Before preserving/publishing a new run, distinguish a new empty source from an unavailable or empty previously populated root. Recheck source availability before final removal decisions. An incomplete walk never supplies a deletion list. Mid-run disappearance stops publication of removals, keeps earlier protected content and valid committed checkpoints, and reports host stop. Removing a set from configuration retires future capture without deleting its store."
rationale = "Deletion evidence must come from a complete available walk, not an empty result created by a failed mount."
test_refs = "TC-271"
status = "Drafted"

[design.LLR-162]
sr_refs = ["SR-081", "SR-096", "SR-111"]
title = "Compression decision and immutable mixed forms"
module = "native/content"
code_symbol = "choose_stored_form"
detail = "With compression disabled, neither probe nor compressor is invoked. With it enabled, apply the accepted probe modes, 256 KiB boundary and inclusive 10% measured-savings threshold. Define measured saving as (sample raw bytes minus sample archive bytes)/sample raw bytes using bounded deterministic sample offsets; on measurement failure warn and use the declared type fallback. The stored-form decision follows the accepted measured-saving/fallback rule; a different final-size override requires reconciling SR-081 rather than silently changing it. Existing stored objects are not recompressed when settings change."
rationale = "A reproducible bounded sample controls probe cost; the chosen storage form remains consistent with the accepted compression policy."
test_refs = "TC-272"
status = "Drafted"

[design.LLR-163]
sr_refs = ["SR-003", "SR-041", "SR-059", "SR-108", "SR-136"]
title = "Existing content-addressed pool and immutable publication"
module = "native/store"
code_symbol = "publish_object"
detail = "Retain the existing pool: sharded objects in CurrentBackup and flat objects in dated BackupHistory folders, using the existing hash/length/name codec. Stage through Incoming and publish complete synced content with no replacement of a valid existing object. Reuse available shared content and move it back from supported snapshots when needed. Move superseded objects only after final latest publication and only when no final latest row depends on them; the destination is a state that records the identity. A failed move leaves the available copy intact and reports failure. Verify candidates where the operation requires it; names alone are not content verification."
rationale = "The current layout and bounded move protocol already deliver shared-content recovery. Porting these responsibilities is lower risk than introducing a new global object pool."
test_refs = "TC-273"
status = "Drafted"

[design.LLR-164]
sr_refs = ["SR-039", "SR-065", "SR-066", "SR-146", "SR-150", "SR-152"]
title = "Versioned file and directory/link record codecs"
module = "native/format"
code_symbol = "decode_state_records"
detail = "Retain the nine-column file manifest and extend the directory sidecar with explicit entry kind and a root-relative link destination, under a declared kit/metadata format revision. Use UTF-8 CSV with explicit headers, quoting, ordinal path ordering and slash-separated root-relative paths. Ordinary directories have no link destination. For the new revision, publish a header-only sidecar when there are no entries, so absent required metadata differs from an empty record. Validate shapes, path uniqueness and file/directory/link conflicts. Report missing/malformed required metadata and conflicting entries while preserving independently recoverable file bytes. Validate the selected last-known definitions without requiring that the source scan finished; parsing and per-file checks do not authenticate record completeness or provenance. Previous-definition copies are separate inspection/recovery inputs, never an automatic substitute or a completion marker."
rationale = "The existing directory record is the natural extension point for link metadata; it does not require a new content pool, database-backed format or metadata-generation architecture."
test_refs = "TC-274"
status = "Drafted"

[design.LLR-165]
sr_refs = ["SR-005", "SR-010", "SR-017", "SR-075", "SR-082", "SR-100"]
title = "Existing bounded publication with explicit metadata failure handling"
module = "native/state"
code_symbol = "publish_latest_state"
detail = "Preserve the ordered run: after admission and ownership, finish preserving the pre-run manifest and directory/link record as MANIFEST.csv.prev and DIRECTORIES.csv.prev before modifying either current definition. Stage and sync each copy and publish without replacement; existing previous copies remain untouched across unsuccessful runs. A fresh store has no prior definitions. Initial copy failure leaves current definitions unchanged. Publish the normal prior dated snapshot before the first latest checkpoint, then atomically replace manifest checkpoints, finalize directory/link metadata and completion dates, retain history for semantic file/folder/link changes, and move superseded content. Delete previous copies only after a successful replacement state and backup finalization. Interruption during initial copying leaves the old current definitions available; interruption during successful cleanup leaves the new current definitions available. A lone previous file is housekeeping residue, not a failed current state; never combine it automatically with a different record set. Cleanup and kit refresh leave previous copies alone. Actual required metadata errors retain their diagnostics. Keep distinct dated-state identity/disambiguation and bounded checkpoint budgets."
rationale = "The owner chose preserved previous definitions alongside usable latest checkpoints. Existing dated snapshots remain history; previous copies aid inspection/recovery after interruption without treating unfinished enumeration as record damage."
test_refs = "TC-275"
status = "Drafted"

[design.LLR-166]
sr_refs = ["SR-017", "SR-075", "SR-082", "SR-158"]
title = "Interruption cleanup and durability boundary"
module = "native/state"
code_symbol = "resume_interrupted_work"
detail = "After exclusive admission, remove only identified interrupted Incoming and Building work that the bounded-run protocol declares disposable; resume or report Pruning work under the retention protocol. Rebuild disposable indexes from retained manifests and stored objects. Preserve previous-definition copies and unknown or inaccessible items; treat a lone previous copy as housekeeping residue, without mixing it with current records or refusing current recovery. Cleanup and kit refresh never overwrite or delete previous copies; deletion belongs only to successful backup completion. Propagate sync failures as host stops and qualify power-loss claims by separately exercised storage stacks. No stale-age reclamation or source-side cache is introduced."
rationale = "Reuse the existing restart-from-disk protocol rather than add a second journal or generation recovery mechanism."
test_refs = "TC-276"
status = "Drafted"

[design.LLR-167]
sr_refs = ["SR-023", "SR-052", "SR-158"]
title = "Capacity estimates and late write failures"
module = "native/capacity"
code_symbol = "admit_storage_work"
detail = "For each actual volume, estimate allocated output, temporary staging and metadata demand without double-counting shared free space. Restore demand sums each ordinary output path after duplicate/external-link expansion; recreated links add link/metadata allowance rather than target bytes again. Backup admits bounded next units. Unknown capacity emits a warning and proceeds with bounded writes; a known shortfall refuses the affected unit. Later full/disconnected volumes stop unsafe writes and retain valid earlier outputs and source/store data."
rationale = "Free-space observations are estimates, not reservations; counting stored deduplicated bytes would understate recovery demand."
test_refs = "TC-277"
status = "Drafted"

[design.LLR-168]
sr_refs = ["SR-047", "SR-049", "SR-103", "SR-104"]
title = "Read-only inventory and whole-store verification"
module = "native/verify"
code_symbol = "inspect_store"
detail = "Read CurrentBackup and every remaining dated BackupHistory state, including older out-of-window folders. Stream one manifest at a time, using a bounded content-verdict cache and spillable index outside the store. Report paths/states affected by missing, unreadable, invalid, damaged, duplicate, misplaced and form-inconsistent content and metadata. Return findings without creating store-side logs, locks, scratch or views. Concurrent mutation is unsupported for a consistent whole-store inspection; detect observable record changes and return an incomplete concurrent-change diagnostic rather than a clean result."
rationale = "Read-only tools must remain nonmutating even when inspection itself fails; one invalidated old date is not evidence of damage in a newer state."
test_refs = "TC-278"
status = "Drafted"

[design.LLR-169]
sr_refs = ["SR-045", "SR-046", "SR-047", "SR-101", "SR-102"]
title = "Existing retention plan and resumable removal"
module = "native/retention"
code_symbol = "plan_and_commit_removal"
detail = "Retain the existing prune planner and resumable commit protocol, with its protected dependency set explicitly including latest and all retained states later than the chosen cutoff. Resolve only named dated folders inside the store; reject wildcard/parent escapes and redirected state directories. Before removing a folder, rehome any last-copy content its protected survivors require and publish associated metadata safely. Validate actual temporary/publication allocation requirements; lack of spare capacity alone does not forbid deletion needing no allocation. Only after survivor supply is available commit the selected removal through the established Pruning phase and finish deletion. Repeating the request resumes safely; older remaining records may be incomplete and are still checked. Invalidation is not deletion: older folders are left alone unless explicitly selected and included in the same dependency/rehoming analysis. For batches, analyze supply outside the entire selected deletion set. Sync every required rehomed copy and survivor record before committing Pruning; an uncommitted removal is replanned, and committed resumption cannot broaden its deletion set."
rationale = "The existing rehoming/removal mechanism already provides stronger preservation than the approved cutoff needs; it can be retained without introducing pool-wide garbage collection."
test_refs = "TC-279"
status = "Drafted"

[design.LLR-170]
sr_refs = ["SR-045", "SR-046", "SR-059", "SR-101"]
title = "Protected dependency checks for snapshot deletion"
module = "native/retention"
code_symbol = "validate_prune_dependencies"
detail = "Scan protected manifests one at a time to determine required content identities and use the existing object index to find supply outside the selected removal folder. Rehome and verify the last usable copy before deletion. If a protected record cannot be read, or required supply cannot be established, stop destructive removal. Keep unknown/unrecognized content out of automatic cleanup unless the declared removal protocol accounts for it. Do not delete a CurrentBackup object based merely on absence from an incomplete index. The deletion set is fixed by the checked plan, not inferred from the cutoff. A batch cannot count another selected-to-delete folder as surviving supply."
rationale = "Dependency analysis belongs at the existing destructive prune boundary; a new global mark/sweep collector adds unnecessary semantics."
test_refs = "TC-280"
status = "Drafted"

[design.LLR-171]
sr_refs = ["SR-109", "SR-110"]
title = "Verified repair without invented history"
module = "native/verify"
code_symbol = "repair_findings"
detail = "Obtain ownership and revalidate findings before using the existing repair/quarantine responsibilities. Accept corrections backed by freshly verified bytes matching recorded identity, preserving a usable supply for all previously recoverable states. Publish corrected manifests with the existing atomic replacement primitive; stage other required metadata before its replacement and report any incomplete maintenance route. Quarantine damaged/misplaced duplicates instead of deleting uncertain supply. Do not substitute current source bytes for unrecoverable historical identities. Report ambiguous and unrepairable findings unchanged."
rationale = "Repair is a checked transformation of evidence, not permission to guess content or mutate shared historical records in place."
test_refs = "TC-281"
status = "Drafted"

[design.LLR-172]
sr_refs = ["SR-008", "SR-009", "SR-010", "SR-031", "SR-039", "SR-118", "SR-141", "SR-145"]
title = "Recovery selection and admission"
module = "recovery/admission"
code_symbol = "admit_selected_state"
detail = "Locate the store from the selected CurrentBackup or dated BackupHistory kit using the established single-store relationship. Read its manifest and directory/link metadata under declared kit/format support before target writes. Default to current records; an explicit previous-definition selection reads the previous manifest and matching previous sidecar, never a mixture with current records. Only when previous definitions are explicitly selected, report any required member that is unavailable and recover independent files where possible. A leftover previous file does not affect default current recovery. Previous copies preserve definitions, not independent content; content resolves from the shared pool under the same integrity and retention rules. Presence or absence of previous copies alone does not determine current recovery success, and interrupted capture alone does not suppress valid recorded links or directories. Resolve target ancestry, admit tools and expanded capacity, and recover without native engine or network. Unusable file-record structure refuses the whole restore; per-entry damage permits safe continuation."
rationale = "Whole-restore refusal must precede avoidable output, while per-entry faults should not discard independent recoverable files."
test_refs = "TC-282"
status = "Drafted"

[design.LLR-173]
sr_refs = ["SR-029", "SR-056", "SR-068", "SR-119", "SR-120"]
title = "Per-file verified recovery and fallback"
module = "recovery/content"
code_symbol = "recover_entry"
detail = "Resolve candidates by recorded identity across the shared pool, test actual raw/archive forms rather than trusting the flag, and expand/copy to a private target-side temporary file. Check final byte length and xxHash128 before publishing to its validated destination. Retry a distinct verified candidate on damage; cap candidates by the finite discovered supply. Report missing/corrupt bytes separately from host/tool inability. Preserve an existing destination until a verified replacement is ready; never leave failed temporary output represented as restored."
rationale = "Verification after expansion catches form errors and source archives mistaken for wrappers, while staging avoids corrupting a preexisting target on failure."
test_refs = "TC-283"
status = "Drafted"

[design.LLR-174]
sr_refs = ["SR-009", "SR-092", "SR-121", "SR-141"]
title = "Restore path containment and collision admission"
module = "recovery/paths"
code_symbol = "validate_destination"
detail = "Validate normalized file-record paths and resolve target parent chains before writes. Reject absolute/drive-qualified/escaping names, impossible file-path ancestry and target-comparison collisions among file rows as groups. A supplemental directory/link record conflicting with valid file-manifest paths is rejected as metadata damage, not grounds to discard the independently recoverable file rows. Restore those files through validated ordinary directories, never through the rejected link. This authority rule does not depend on timestamps or previous-copy presence. Pre-existing target symlinks/reparse points remain unsafe write paths and are refused. When the target is mutable by an outside actor, use supported protected handle-relative operations or refuse that unsafe execution profile; do not claim string checks eliminate a concurrent redirection race."
rationale = "Records and target paths are independent trust inputs; links-last alone cannot validate a preexisting target redirect."
test_refs = "TC-284"
status = "Drafted"

[design.LLR-175]
sr_refs = ["SR-065", "SR-066", "SR-122", "SR-146"]
title = "Folder and per-file metadata restoration"
module = "recovery/metadata"
code_symbol = "apply_recorded_metadata"
detail = "Create ordinary directories before their children, restore each file with its own recorded timestamp at the declared precision, then apply directory attributes after child creation. Distinguish missing/malformed required metadata from unsupported host attributes/ranges. Preserve verified file bytes on metadata failure; report exact known entries and unknown lost metadata separately. Required current metadata damage yields incomplete; supported-content recovery with declared target limitations can complete with warnings. Apply valid selected ordinary directory records even after interrupted capture; prior-copy presence does not suppress them. Diagnose actual conflicts or unavailable required records."
rationale = "Applying a shared object timestamp to all duplicates loses per-path metadata, and applying directory metadata before children can immediately undo it."
test_refs = "TC-285"
status = "Drafted"

[design.LLR-176]
sr_refs = ["SR-150", "SR-151", "SR-152"]
title = "Capture and reconstruct portable folder links"
module = "recovery/links"
code_symbol = "restore_relative_folder_links"
detail = "During the source walk, classify folder links by resolved containment in the configured source root. Record a supported in-root destination as a root-relative path without traversing its alias again. Restore ordinary directories/files first, then calculate the link target relative to its restored parent. Accept parent components only when the resolved destination stays inside the restored root and maps to an available captured directory. Report an unavailable mapping instead of guessing. Never synthesize an external absolute fallback or silently copy internal linked content when link creation is unsupported; report the host limitation. A source junction may restore as a relative directory symlink, with capability/privilege requirements disclosed. Do not traverse links into protected system locations."
rationale = "Extending typed directory records preserves link identity without binding the recovered tree to the original machine; links-last protects content writes."
test_refs = "TC-286"
status = "Drafted"

[design.LLR-177]
sr_refs = ["SR-001", "SR-137", "SR-150", "SR-151"]
title = "External-link capture scope and finite traversal"
module = "native/capture"
code_symbol = "walk_external_links"
detail = "Implement the accepted external-folder expansion policy in the main source walk: capture content under each alias path and restore it as ordinary folders/files, deduplicating stored bytes while retaining each logical path. Follow nested external folders with an active-ancestor identity stack to stop cycles, not a global suppression of repeated targets. Classify destinations resolving back inside the configured source as in-root folder links. Capture single-file links as ordinary file content under their link path for both inside and outside targets, subject to protected-location exclusions. Apply bounded target-access/retry handling; unreachable targets preserve prior rows under the affected prefix and report incomplete capture. Count each expanded output path and its bytes for work/capacity; a folder containing only a link is still an enumerated nonempty source. Report unsupported cycles without inventing portable destinations."
rationale = "A global visited set silently drops accepted repeated-alias content; an ancestor stack prevents cycles while exposing acyclic expansion honestly."
test_refs = "TC-287"
status = "Drafted"

[design.LLR-178]
sr_refs = ["SR-040", "SR-043", "SR-104", "SR-120", "SR-126"]
title = "Stable result classes and structured diagnostics"
module = "native/results"
code_symbol = "encode_result"
detail = "Represent class, cause, state/set identity, affected path, counts and corrective guidance as typed data. Emit schema-versioned JSON separately from progress prose; documented exits are 0 complete, 1 incomplete, 2 invalid request/configuration/record and 4 busy/host/tool. Within a request use refusal-before-admission, then host-stop over incomplete, over complete; retain every cause in structured findings. Missing bytes, invalid names, bad records and unsupported metadata have distinct cause codes even where exits coincide."
rationale = "A stable machine result should not depend on log wording or force one exit code per diagnostic."
test_refs = "TC-288"
status = "Drafted"

[design.LLR-179]
sr_refs = ["SR-016", "SR-072", "SR-073"]
title = "Unattended execution and interactive recovery"
module = "recovery/launch"
code_symbol = "select_interaction_mode"
detail = "Explicit inputs or redirected/noninteractive execution disable prompts and wait-for-key behavior. A missing target in unattended recovery produces usage refusal. A supported desktop launcher offers target selection and leaves the outcome visible; cancellation returns without choosing a fallback directory. An interactive console can prompt for a target only when input is actually available."
rationale = "The launch environment, not whether a user happened to double-click a filename, determines whether a question can be answered."
test_refs = "TC-289"
status = "Drafted"

[design.LLR-180]
sr_refs = ["SR-089", "SR-124", "SR-125", "SR-126"]
title = "Progress, change accounting and refusal explanations"
module = "native/reporting"
code_symbol = "record_progress"
detail = "Track added/changed/removed/frozen/failed paths against the baseline, with causes and final counters. A separate progress reporter observes active-time deadlines independently of long reads/compressors/finalization and emits at least every 120 active seconds. Suspend time is excluded with a declared monotonic scheduling basis; completed counts do not count an attempted unpublished file. Refusals report condition and remedy without secret values."
rationale = "Progress must remain observable while the worker blocks; otherwise a timer checked only between files cannot satisfy long-file progress."
test_refs = "TC-290"
status = "Drafted"

[design.LLR-181]
sr_refs = ["SR-015", "SR-127", "SR-128", "SR-129"]
title = "Notification and credential isolation"
module = "native/notify"
code_symbol = "submit_result_notice"
detail = "Read only opaque credential references from configuration, resolving them under the authorized execution identity through declared host credential adapters. Reject readable secrets without echoing them. Submit the completed run result only when configured/enabled, with bounded connection/read timeouts and no prompts. Record submission failure as a warning without changing the underlying backup outcome; do not assert delivery or recipient action from relay acceptance."
rationale = "Separating result submission from operation success prevents mail outages altering backup status and avoids copying credentials into recovery material."
test_refs = "TC-291"
status = "Drafted"

[design.LLR-182]
sr_refs = ["SR-062", "SR-063", "SR-097", "SR-098", "SR-099", "SR-147"]
title = "Derived browse and space/media views"
module = "native/view"
code_symbol = "publish_derived_view"
detail = "Generate the latest-state view from the selected latest records into an owned temporary area, then replace the prior derived view after success. Include every logical path and duplicate, name search, stored-content access, stored size/shared marker and optional media rate. Media measurement uses positive duration and MiB/s to three decimals; disabled/missing/failed measurement is explicitly unavailable. Never infer zero from absence or let a view/tool failure change captured content."
rationale = "A disposable view must not become recovery authority or overwrite unrelated files, and shared physical bytes still need every logical path shown."
test_refs = "TC-292"
status = "Drafted"

[design.LLR-183]
sr_refs = ["SR-034", "SR-048", "SR-095", "SR-130", "SR-142"]
title = "Container execution parity and confinement"
module = "native/container"
code_symbol = "run_container_action"
detail = "Package the native executable and documented tools in an unprivileged image. Accept the same typed configuration/actions and multiple sets as the native route; mount sources read-only and writable locations only for stores and declared scratch/log output. No added capabilities or network are needed for a locally provisioned non-notifying fixture. Container CLI behavior is a new native contract, not an unreviewed change to the legacy HomeHub v1 interface."
rationale = "Container deployment is a delivery adapter, not a second backup implementation or an excuse for single-set divergence."
test_refs = "TC-293"
status = "Drafted"

[design.LLR-184]
sr_refs = ["SR-007", "SR-008", "SR-031", "SR-033", "SR-153"]
title = "Native builds and independent script recovery packaging"
module = "native/package"
code_symbol = "assemble_release"
detail = "Produce release executables for the declared Windows/Linux/macOS CPU matrix with embedded engine dependencies. Bundle version-matched PowerShell/bash recovery sources, restore-safe module/hash dependency where needed, launchers, guidance and notices as release assets; publish their exact bytes into state kits. Build tools and repository are not runtime dependencies. Recovery invokes only its local script/tool stack, never the native engine."
rationale = "Using native code for backup must not make disaster recovery depend on obtaining that executable later."
test_refs = "TC-294"
status = "Drafted"

[design.LLR-185]
sr_refs = ["SR-061", "SR-084", "SR-114", "SR-115", "SR-116", "SR-123", "SR-156"]
title = "Format support and explicit transition paths"
module = "native/format"
code_symbol = "admit_format_family"
detail = "Retain the current single-store layout and existing record conventions as the native design baseline. Declare the metadata/kit revision needed for link records before enabling that capability. Reuse does not designate an older executable or store version as supported: the older-version support set remains empty until tested and explicitly designated. Old stores retain their own kits; any conversion or new-store transition is explicit. Unknown required record kinds or versions refuse without mutation, and missing current metadata is not an older-format exemption."
rationale = "Preserving a useful existing architecture is distinct from promising backward compatibility. Only the actual link-format extension needs a format decision; Rust alone does not justify a new store family."
test_refs = "TC-295"
status = "Drafted"

[design.LLR-186]
sr_refs = ["SR-007", "SR-084", "SR-110", "SR-117"]
title = "Interrupted kit refresh with a usable prior route"
module = "native/kit"
code_symbol = "refresh_supported_kit"
detail = "Retain the existing explicit kit-refresh entry point and staged file-write primitives. Preflight the complete version-matched inventory and supported state-format pair before replacing any file. Preserve a usable previous kit copy until the refreshed kit set is committed; if a mix of files can execute incorrectly, add only the smallest kit-local commit/validation mechanism needed to detect that mix and provide a resumption path. A full-store generation-selector redesign is not required. Do not rewrite state records or stored content during refresh. Preserve previous-definition copies unchanged across refresh."
rationale = "The current kit mechanism is reusable, but multi-file interruption behavior still needs evidence under the accepted maintenance contract."
test_refs = "TC-296"
status = "Drafted"

[design.LLR-187]
sr_refs = ["SR-068", "SR-071", "SR-081", "SR-098", "SR-118"]
title = "Stored-form detection and optional tool adapters"
module = "native/tools"
code_symbol = "execute_checked_tool"
detail = "Invoke tools with direct argument arrays, bounded captured output and exit/time/error classification; never interpolate record paths through a shell. Declare tool-floor versions and GNU/BSD/Windows flavor adapters for both script routes. Detect form from content/signature and verified output, not extension alone. Embedded native algorithms are tested as implementation, not assumed external conformance."
rationale = "Tool invocation and error classification are portability/security seams; apparently archive-shaped damage is different from a missing executable."
test_refs = "TC-297"
status = "Drafted"

[design.LLR-188]
sr_refs = ["SR-049", "SR-064", "SR-112", "SR-113"]
title = "Resource-bounded indexes and streaming records"
module = "native/index"
code_symbol = "open_spillable_index"
detail = "Start with the existing one-manifest-at-a-time discipline and bounded in-memory indexes. If measured cardinality exceeds the budget, spill path/content joins and changed-row merging to a disposable on-disk index; any such index is rebuilt from the existing committed manifests and directory records and never required by recovery scripts. Bound in-memory caches and buffers as a fraction of the 2 GB combined budget, leaving headroom for external tools. Readers/checkers process one state record at a time and spill sorting/collision groups to scratch rather than retaining all histories. Script implementations use the same bounded processing principle without reading the native index."
rationale = "Record-count and history growth must not multiply process memory; an authoritative database would add a recovery runtime dependency."
test_refs = "TC-298"
status = "Drafted"

[design.LLR-189]
sr_refs = ["SR-064", "SR-112", "SR-113"]
title = "Scale corpus and reproducible performance measurements"
module = "verification/scale"
code_symbol = "measure_reference_workload"
detail = "Interpret each selected-state envelope as at most one million logical output file paths and 2 TiB expanded logical file bytes, with up to 365 saved states plus latest. Bound the shared pool to 2 TiB of distinct uncompressed content for the reference check corpus; declare the total historical row count and alias factor separately. Use four cores, 2 GB available memory and 100 MiB/s local SSD without competing load. Measure whole-store check/full restore and routine <=1 GiB changed backup, recording cold/warm cache conditions and repeated trials. Compare 182/364-state runs with identical changes and cache state; count simultaneous RSS, not a sum of independent peaks."
rationale = "Logical-size accounting resolves alias expansion in the benchmark without weakening real capture behavior; total history and unique pool size are separate costs."
test_refs = "TC-299"
status = "Drafted"

[design.LLR-190]
sr_refs = ["SR-027", "SR-126", "SR-131", "SR-143", "SR-155", "SR-156", "SR-157"]
title = "Guidance, helper and assurance disclosures"
module = "delivery/guidance"
code_symbol = "publish_support_material"
detail = "Ship a configuration helper/examples, offline provisioning guidance, restore route instructions and a versioned support matrix linked to measured evidence. Explain content checks versus provenance/completeness, retention cutoff, complete-store handoff, external-link expansion and unsupported metadata outcomes. Inventory redistributed components and attach their required license/notice texts to native, container and carried-kit artifacts; distinguish separately installed tools. Never label an untested platform combination supported."
rationale = "Delivery material is part of recovery capability and redistribution compliance, not an optional web link unavailable offline."
test_refs = "TC-300, TC-301"
status = "Drafted"
