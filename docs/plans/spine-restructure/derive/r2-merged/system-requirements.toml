[requirement.SR-059]
title = "No operation alters or loses content a state depends on"
sn_refs = ["SN-034"]
boundary_refs = ["B-02"]
hat_refs = ["SHARED-CONTENT"]
requirement = """The system shall not alter or remove any stored content that the latest state or any saved state still depends on, in any operation."""
rationale = """Files and states share stored content; rewriting or removing one copy because one file changed silently breaks every other file and state using it, found only at restore. Testing survival only against the files the source still holds lost: entries kept from an earlier run, and entries whose replacement failed, depend on content the source walk never sees."""
acceptance_criteria = """After one of two identical files is edited, and after files are removed, renamed and re-added, every earlier saved state still restores the old bytes for every path that held them and the latest state restores the new bytes. Content still claimed by an entry kept from an earlier run (its file unreadable or its name refused) and content whose replacement copy failed are retained; removing either of two files sharing one stored copy leaves that copy in place; after every operation no stored content that a record refers to is missing."""
permutations = """operation=set{backup,removal,repair,kit-refresh}; change=set{edit-one-twin,remove,rename,re-add,kept-earlier-entry,failed-replacement}; compress=bool; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The restorability of every state is itself the outcome."""
form = "cross-cutting"

[requirement.SR-061]
title = "A backup or state in a retired or unrecognised form is refused by name"
sn_refs = ["SN-040"]
boundary_refs = ["B-02", "B-06", "B-08", "B-15"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """If a backup, or a saved state in it, is in a retired or unrecognised form, then the system shall refuse it by name before changing anything or writing to any restore target, with a message naming the form and what to do."""
rationale = """A version that half-understands an unfamiliar form can damage a store it should have left alone, and a restorer that misreads one hands back wrong files; best-effort continuation lost. A retired form is recognised from positive evidence, so that a merely damaged entry is never mistaken for a retired store: damage is a check finding, healed or repaired per entry, while a retired form is refused as a whole."""
acceptance_criteria = """A backup in a retired form and one in an unrecognised form are each byte-identical after a backup, a removal and a repair are attempted, and the message names the form and the action to take; every restorer refuses a state in a retired form before writing to the target, naming the form, with exit code 2; a check reports the form as a finding and changes nothing. A retired form is recognised from its record's evidence, its storage-layout marker or its stored-name shape, including when no completeness evidence is present. A store whose only fault is a damaged stored location that matches neither the current nor a retired form is not refused as a whole: that entry is still checked, healed and restored."""
permutations = """form=set{retired,unrecognised,newer-than-this-version,damaged-entry-only}; action=set{backup,removal,repair,check,restore}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The untouched backup, the refusal and its message are the outcome."""
delivered_with = ["SR-114"]
form = "interface"

[requirement.SR-062]
title = "Where turned on, a browsable listing of the latest state is produced"
sn_refs = ["SN-008"]
boundary_refs = ["B-06", "B-20"]
requirement = """Where the browse view is turned on, the system shall produce after each run a listing of every backed-up path of the latest state, duplicates included, searchable by name, in which opening an entry opens that file's stored content."""
rationale = """The backup is organised by content, not by the original tree, so it cannot be browsed by eye; without another way in, finding one file means restoring everything."""
acceptance_criteria = """With the browse view on, after a run the listing holds every path of the latest state including duplicates, a name search finds a given file, opening its entry yields its content, and a run that changed the latest state brings the listing up to date; with the view off, no listing is produced."""
permutations = """browse_view=set{off,on}; duplicates=bool; change=set{add,edit,remove,none}; compress=bool; @pairwise"""
