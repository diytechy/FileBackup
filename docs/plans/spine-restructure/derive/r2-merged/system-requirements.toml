form = "interface"

[requirement.SR-064]
title = "A check and a full restore fit their time budgets at scale"
sn_refs = ["SN-043"]
boundary_refs = ["B-07", "B-08", "B-15"]
hat_refs = ["PERFORMANCE"]
requirement = """For a library at the declared scale on the declared reference host, the system shall complete a whole-backup check and a full restore each within its declared time budget."""
rationale = """Off the single-crossing rule on purpose: a time budget is a property of the whole operation, from launch to outcome. Without it a check or a restore quietly stops fitting its window as the library grows. An audit that compares every stored item against every record entry grows with the square of the library and is the first thing to break."""
acceptance_criteria = """Proposed values: for a library of up to 2 TiB in up to one million files, on a four-core host with 8 GiB of available memory and local storage sustaining 200 MiB per second with no competing load, a whole-backup check and a full restore each complete within eight hours. The audit of stored content against the records takes time linear in the number of record entries plus stored items, measured at 10,000 entries and 10,000 stored items."""
permutations = """operation=set{check,full-restore}; files=range[1..1000000]; bytes=range[0..2TiB]; compress=bool; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The elapsed time is the outcome."""
