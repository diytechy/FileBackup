hat_refs = ["SECURITY"]
requirement = """If a configuration carries notification credentials in readable form, then the system shall refuse it before any backup data is touched."""
rationale = """Accepting such a configuration keeps the secret readable wherever the configuration travels; refusing is the only way to stop it being used. The rule holds for every configuration form, since a form exempt from it is where the secret would go."""
acceptance_criteria = """A configuration holding a readable password for notification, in the JSON form and in the native-Windows form alike, is refused with the configuration-refused outcome and nothing is created or changed; a configuration referring to credentials protected by the host's credential facility is accepted."""
permutations = """form=set{json,native-windows}; credential=set{readable,protected,absent}; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The refusal is the outcome."""
delivered_with = ["SR-128"]
form = "interface"

[requirement.SR-130]
title = "The container needs no more access than reading the source and writing its own locations"
sn_refs = ["SN-024"]
boundary_refs = ["B-12"]
hat_refs = ["SECURITY"]
requirement = """The system shall complete a containerised run as an unprivileged user with read-only access to the source and write access only to the backup, its working-state and its record locations."""
rationale = """A container needing write access to the source or administrative rights puts the files at risk to protect them."""
acceptance_criteria = """A run in a container with a read-only source mount, an unprivileged user, no added capabilities and no network, with compression on, completes with the complete outcome and its backup restores byte-exact."""
permutations = """compress=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-13"]
delivered_with = ["SR-034"]
form = "assumption"

[requirement.SR-131]
title = "Shipped third-party components are licensed for it and carry their notices"
sn_refs = ["SN-054"]
boundary_refs = ["B-13", "B-12"]
hat_refs = ["LEGAL"]
requirement = """The system shall ship inside a backup folder or the container only third-party components whose licences permit that redistribution, each with its required notices alongside it."""
rationale = """Every backup the owner hands on carries other people's code; shipped against its licence, each is a breach whose risk the owner carries."""
acceptance_criteria = """For each third-party component found in a backup folder and in the container, its licence permits that redistribution and its required notices are present beside it."""
permutations = """carrier=set{backup-folder,container}; component=set{hashing,archive,media-probe,runtime}; @pairwise"""
priority = "S"
verification = "Inspection"
status = "Drafted"
coincident = """The shipped components and notices are the outcome."""
form = "interface"

[requirement.SR-132]
title = "A required component absent on first use is obtained or named"
sn_refs = ["SN-012", "SN-015"]
boundary_refs = ["B-10", "B-11", "B-08"]
requirement = """When a required component is absent at launch, the system shall obtain it from the package source or, where it cannot, refuse before changing any backup, naming the component and how to obtain it."""
rationale = """Hunting for prerequisites stops a new owner; a run that proceeds without them writes a backup that cannot be trusted. Obtaining it never asks a question, since a scheduled first run has nobody to answer (SN-011)."""
acceptance_criteria = """On a host lacking the required hashing component, the first launch, attended or not, either obtains it without asking anything and completes, or refuses with nothing changed and a message naming the component and how to install it."""
permutations = """package_source=set{reachable,unreachable}; attended=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The obtained component or the refusal is the outcome."""
delivered_with = ["SR-019", "SR-027"]
form = "interface"

[requirement.SR-133]
title = "A missing optional extra is skipped visibly"
sn_refs = ["SN-015"]
boundary_refs = ["B-10", "B-06"]
requirement = """If only an optional extra is missing, then the system shall complete the run and record that the extra was skipped."""
rationale = """Refusing a run over an optional extra stops backups for no data reason; skipping it silently hides that the owner is not getting what they set up."""
acceptance_criteria = """With only the media-measurement tool absent, the run completes with the complete outcome and its record says the extra was skipped."""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The completed run and its record are the outcome."""
