[requirement.SR-075]
title = "A run after a dead interrupted run proceeds by itself when nothing would be lost"
sn_refs = ["SN-013"]
boundary_refs = ["B-02", "B-04"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """When a run finds traces of an earlier interrupted run and can tell from the backup alone that the earlier run is dead and that proceeding loses nothing, the system shall recover and complete the run without intervention."""
rationale = """A run that refuses forever after one interruption stops all future backups until someone notices; a run that reclaims a live run's work destroys content. A process identifier proves nothing across hosts or containers, so death is judged from liveness evidence that has stopped changing. A longer threshold delays recovery; a shorter one risks a live run."""
acceptance_criteria = """After a run is killed at a point that left no content in transit, the next run completes with the complete outcome and the store restores every state. An earlier run is judged dead only when its liveness evidence is older than its declared limit, and at least 1800 seconds old, and stays unchanged over a confirmation wait of the larger of 90 seconds and its declared liveness interval plus 30 seconds. A live run updates its liveness at least every 60 seconds, including during long blocking work, and is never judged dead, also when it runs on another host or in another container or its clock runs slow. When two runs race to recover the same leftovers, one proceeds and the other is refused, and a displaced run changes nothing of its successor's work."""
permutations = """leftover=set{none,empty-staging,owner-record-only}; earlier_run=set{dead,alive,alive-slow-clock}; host=set{same,other-container}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-02", "DA-16"]
delivered_with = ["SR-017"]
form = "assumption"

[requirement.SR-081]
title = "With compression on, content is compressed only where a measurement shows a saving"
sn_refs = ["SN-003"]
boundary_refs = ["B-02", "B-10"]
requirement = """Where compression is turned on, the system shall store newly written content compressed only when measuring that content shows that compression saves at least the declared minimum, whatever the file's name."""
rationale = """Media is already compressed and only gets slower; text shrinks a lot. Choosing to compress by file name lost: it wastes space on misnamed text and time on misnamed media. Choices that only ever store content as it is (measuring turned off, a list of known-incompressible types skipped without measuring, files below the size floor) remain the owner's to make, because storing content as it is never costs a byte-exact restore; a missing or failed measurement is treated the same way, never as permission to compress by name."""
acceptance_criteria = """With compression on and every file measured, content larger than 256 KiB whose measured saving is at least 10% is stored compressed whatever its name, and content saving less is stored as it is whatever its name, so random bytes under a document name stay as they are and text under a media name is compressed. With measuring turned off, nothing is compressed. With known-incompressible types skipped, files of those types are stored as they are without being measured and other files are measured. Files of 256 KiB or less are stored as they are in every choice. When the measurement cannot be taken, the content is stored as it is with a warning and the run does not fail on that account. Measuring changes neither the source nor stored content. Every file restores byte-exact in every case."""
permutations = """content=set{compressible,incompressible,partly-compressible}; name_class=set{media-type,document-type,listed-incompressible,none}; measuring=set{off,skip-listed-types,every-file}; size=set{below-floor,above-floor}; measurement=set{taken,unavailable}; @pairwise"""
