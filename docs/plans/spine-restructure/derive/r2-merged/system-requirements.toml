[requirement.SR-135]
title = "Each configuration states the version of the description it follows"
sn_refs = ["SN-050"]
boundary_refs = ["B-05", "B-07"]
requirement = """The system shall require each configuration, in every supported form, to state which version of the configuration description it follows."""
rationale = """Without a stated version, a configuration written for another version can only be half-understood; with it, the launch can refuse what it does not support. An unversioned form would be the one configuration that can never be refused for its version."""
acceptance_criteria = """A configuration without a stated version, in the JSON form and in the native-Windows form, is refused with the configuration-refused outcome; one stating the current version is accepted; an integral version written with a decimal point is read as that integer."""
permutations = """form=set{json,native-windows}; version=set{absent,current,older,newer,integral-decimal}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The acceptance or refusal is the outcome."""
delivered_with = ["SR-042", "SR-123"]
form = "interface"

[requirement.SR-136]
title = "Each host continues the other's backup identically"
sn_refs = ["SN-023"]
boundary_refs = ["B-02"]
hat_refs = ["STORE-FORMAT-COMPATIBILITY"]
requirement = """When a backup written from one host type is continued from the other, the system shall treat its shared content, compression and saved states as the original host would."""
rationale = """A continuation that re-stores shared content, or forms saved states differently, doubles space or splits history."""
acceptance_criteria = """A run from a Linux host on a Windows-written backup, and the reverse, add no duplicate of already stored content, apply the same compression decisions, create the same saved states as a same-host run would, and leave every earlier state restorable."""
permutations = """direction=set{windows-to-linux,linux-to-windows}; compress=bool; @full"""
priority = "C"
verification = "Test"
status = "Drafted"
coincident = """The continued store is the outcome."""
delivered_with = ["SR-033"]
form = "interface"
