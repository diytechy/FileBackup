[requirement.SR-067]
title = "A briefly locked file is retried within the run"
sn_refs = ["SN-052"]
boundary_refs = ["B-01"]
requirement = """If a source file cannot be read when a run reaches it, for a reason that could change, then the system shall try it again later in the same run and capture it once it can be read."""
rationale = """Other programs hold files open for a moment; giving up at the first refusal leaves a gap for no reason. Waiting on the file until it opens lost: it can hang the run. A failure that waiting cannot change is not retried, because a retry would only delay a loud, accurate error."""
acceptance_criteria = """A file held locked for less than the retry window when the run first reaches it is captured by that run, the retry is visible in the run's record, and the file is not reported failed. Each file is tried at most three times. A file that stays unreadable after its attempts is reported with the number of attempts made, and no entry is recorded for content the backup does not hold. A failure retrying cannot change, such as a folder standing where the stored copy must be written, fails at once without waiting."""
permutations = """lock_duration=range[0s..retry-window]; failure=set{transient-lock,permanent,destination-is-folder}; group=set{unique,shared-content}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
