# interfaces.toml: FileBackup's interfaces, round 3, merged tier.
#
# Each row states its FORM only: what both sides must agree on to connect at
# all. The behaviour across each interface lives in the LLR (or SR) that
# constrains it. No row names a code file or a symbol; names that ARE the form
# (store-layout names, configuration keys, command-line switches, environment
# variable names, record columns) appear in `data` because both sides must
# spell them identically. The kit's own code files are named by role only.
# IF-001 (the legacy HomeHub contract) is retired; see mapping.md.
# All rows are Drafted.

# --- Launch, configuration and outcome -------------------------------------

[interface.IF-002]
title = "Backup launch request"
owner = "CMP-002"
requestors = ["external:EXT-01", "external:EXT-03"]
channel = "process command line"
interface_from_external = ["B-05", "B-07"]
coincident = """The request as given is what the system acts on; no assumption sits between the caller and the command line."""
data = """One process start of the backup program with named switches (case-insensitive, each at most once):
- -Action <word>: one of Backup (the default when absent), Prune (remove named saved states), Snapshots (the saved-state report), Verify (the check), View (rebuild the browse view).
- -Snapshot <name>[,<name>...]: the saved states a Prune acts on, each a saved-state folder name of the store layout (IF-013).
- -RepairStorage, -RefreshKits: with -Action Verify, run the repair or the kit refresh.
- -BackupRootOnly: with -Action Verify, check the latest state only; -IncludeSnapshots given the value false is accepted as the same request.
- -Deep: with -Action Verify, the former request for a payload check; accepted, carries no meaning.
- -VerifyStorage: accepted as the same request as -Action Verify.
- -WhatIf: with -Action Prune only, the removal dry run; with any other action a bad request.
- -ConfigPath <path>: the configuration document (IF-005 or IF-006); default a documented location in the invoking account's home folder.
- -GlobalLogPath <path>: the global run record (IF-009); default beside the configuration.
- -NoMail: switch notification off for this run.
- -NonInteractive: declare that no person is present.
- -AutoInstallDeps: the former permission to obtain the required component; accepted, carries no meaning.
- -ExitCode: the former request for distinct outcome values; accepted, carries no meaning.
- Any other switch, an unknown action word, or a switch that does not apply to the chosen action is a bad request."""
rationale = """Without one stated form a host scheduler and a person at a console could not start the same operations the same way, and a host could not tell a bad request from a failed run. A configuration-only form (every choice in the document) lost: the action and the saved states to remove change per invocation while the configuration does not."""
version = "1"
status = "Drafted"

[interface.IF-003]
title = "Operation outcome value"
owner = "CMP-002"
consumers = ["external:EXT-03", "external:EXT-01"]
channel = "process exit status"
interface_to_external = ["B-08"]
bridged_by = ["DA-09"]
data = """An integer exit status, one of:
- 0 complete;
- 1 some part failed, or content missing;
- 2 needs a person: a bad request, a refused configuration, or a precondition not met;
- 3 refused over a damaged record of a state;
- 4 retry later: the backup was busy, or a host fault occurred while the operation worked.
No other value is returned by a backup, a removal, the saved-state report, a check, a repair, a kit refresh or a view rebuild."""
rationale = """A host that alerts on 2 and retries on 4 needs one fixed value set across every operation; with a per-operation table a host must know which operation it ran to read the value, and a busy backup that shares a value with a refused configuration is either retried forever or alarmed needlessly. A two-value success-or-failure status lost for that reason."""
version = "2"
status = "Drafted"

[interface.IF-004]
title = "Configuration settings catalogue"
owner = "CMP-003"
requestors = ["external:EXT-01", "external:EXT-03"]
channel = "configuration document"
interface_from_external = ["B-05", "B-07"]
carried_by = ["IF-005", "IF-006"]
coincident = """The settings as written are the request; the document is read as given."""
data = """The one catalogue of settings, whatever the document form. Top level:
- ConfigVersion: integer, required; the description version the document follows. Supported: 2.
- BackupSets: one or more location sets, required.
- Tools: optional; SevenZipPath (string, a path), FfprobePath (string, a path).
- Secrets: optional; ToEmail, FromEmail, SmtpServer (strings), SmtpPort (integer), and in the native-Windows form only, Credential (a host-protected credential, IF-012).
Each location set:
- Name: string, non-empty, required.
- SourcePath, BackupPath, ChangePath: strings, non-empty paths, required; the source, the backup (latest state) and the saved-state locations.
- HashRecalcFreq: required, one of A, E (every run), D (daily), W (weekly), M (monthly), Y (yearly), N (never); case-insensitive.
- CompressEnabled: boolean, required.
- CompressProbe: optional, one of off, excluded-extensions, always (exact lower case); default always.
- BrowseView: optional, one of off, index (exact lower case); default off. The word link is reserved and refused.
- ViewPath: optional path; default the BackupPath followed by _View.
- SpaceView: optional boolean; default false.
- SourceStatePath: optional path, the change-detection record's location; default the source root.
- AllowEmptySource: optional boolean; default false.
Retired keys, refused by name: PreserveFolderTree."""
rationale = """Two document forms with two key lists would drift, and an integrator writing one form could not trust what the other accepts. One catalogue carried by both forms lost nothing; a separate per-form catalogue lost because every new setting would have to be added twice and checked twice."""
version = "2"
status = "Drafted"

[interface.IF-005]
title = "JSON configuration document"
owner = "CMP-003"
requestors = ["external:EXT-01", "external:EXT-03"]
channel = "file"
interface_from_external = ["B-05", "B-07"]
coincident = """The document as written is what is validated."""
data = """A UTF-8 JSON object carrying the settings catalogue (IF-004):
- strings are JSON strings, booleans JSON true or false, integers JSON numbers with an integral value (2.0 is 2);
- the key set is closed at the top level, under Tools, under Secrets and in every location set;
- BackupSets is a JSON array of location-set objects, or a single location-set object standing for a one-element array;
- the form has no protected representation of a credential, so no login key is part of it.
Its published description is a JSON Schema (draft-07) document whose version equals the ConfigVersion it describes."""
rationale = """A host container and an integrator need a form any language can write and validate before launch; the native-Windows form cannot be written outside that host. A YAML or key=value form lost: neither has one standard schema language to publish the description in."""
version = "2"
status = "Drafted"

[interface.IF-006]
title = "Native-Windows configuration document"
owner = "CMP-003"
requestors = ["external:EXT-01"]
channel = "file"
interface_from_external = ["B-05"]
coincident = """The document as written is what is validated."""
data = """The host's serialized-object document form (CLIXML) of one key-value table carrying the settings catalogue (IF-004), the same keys, value kinds and defaults as the JSON form, including ConfigVersion. Secrets.Credential, where present, is a host-protected credential object (IF-012); no other key carries a credential."""
rationale = """It is the one form that can carry the notification login protected by the host, which a scheduled Windows run needs; dropping it lost because mail with a login would then need a readable password somewhere."""
version = "2"
status = "Drafted"

[interface.IF-007]
title = "Environment settings"
owner = "CMP-004"
requestors = ["external:EXT-03", "external:EXT-09"]
channel = "process environment"
interface_from_external = ["B-07"]
coincident = """The variables as set are read as given."""
data = """Process environment variables, each optional:
- FILEBACKUP_7ZIP_PATH: path of the archive tool.
- FILEBACKUP_FFPROBE_PATH: path of the media-measurement tool.
- FILEBACKUP_7Z_LEVEL: the archive tool's effort level, exactly one of the ten strings 0 to 9 with no padding; absent or empty means 9.
- FILEBACKUP_LOG_PATH: location of the global run record.
- FILEBACKUP_NO_GUI: when 1, the language-runtime restore route never offers a folder choice."""
rationale = """A container image and a host scheduler set tool locations and effort without editing the configuration document; making them configuration keys lost because each would walk every configuration surface and bump the description version for a setting that never changes what is restored."""
version = "1"
status = "Drafted"

[interface.IF-008]
title = "Release guidance set"
owner = "CMP-024"
consumers = ["external:EXT-01"]
channel = "delivered documents"
interface_to_external = ["B-23"]
coincident = """What is handed over is the guidance itself."""
data = """What a release hands over besides the program:
- the quick-start guidance, part of the user manual;
- the configuration helper, an interactive tool that writes a native-Windows configuration document (IF-006) with the notification login protected by the host;
- the published description of the JSON configuration document (IF-005), versioned with the ConfigVersion it describes;
- an example JSON configuration document, valid apart from its locations.
Each states the configuration description version it matches."""
rationale = """A new user or an integrator who has only the program cannot know what a valid configuration is; guidance that names no version cannot be told apart from guidance for another release. Shipping only the user manual lost: it cannot be validated against."""
version = "1"
status = "Drafted"

[interface.IF-009]
title = "Run record"
owner = "CMP-006"
consumers = ["external:EXT-01", "external:EXT-03"]
channel = "text files and console"
interface_to_external = ["B-06", "B-20"]
coincident = """The record the owner reads is the record the system writes."""
data = """Two kinds of record, each UTF-8 text, one entry per line, every entry also echoed to the console:
- the global record, one per launch, at the location the launch request or FILEBACKUP_LOG_PATH gives, by default Backup_Global.log beside the configuration document;
- one location record per configured location, named backup.log in that location's saved-state root (IF-013).
Entry grammar: <yyyy-MM-dd HH:mm:ss.fff host-local> [<LEVEL>] <message>, LEVEL one of DEBUG, INFO, WARN, ERROR.
Message prefixes:
- Added: <path> | Changed: <path> | Removed: <path>
- Failed: <path> - <cause> | Not captured: <path> - <cause>
- Progress: <phase> <entries done>/<entries known> entries, <bytes> bytes, phase one of reading, storing, finalising
- Summary: added=<n> changed=<n> removed=<n> failed=<n>
- Refused <token>: <what was found>. Remedy: <what to do>
- Rebuilt change-detection state: <reason>
- Media measure not taken: <reason> | Extra skipped: <name>
Refusal tokens: [SR-075/owner-live], [SR-075/content-refused], [SR-075/prune-held], [SR-075/lock-held], [SR-075/lock-lost], [SR-075/reclaimed], [SR-075/heartbeat]."""
rationale = """An owner reading why a run failed, and a host searching for a refusal class, need stable entry kinds; free prose cannot be searched and a count without the names cannot be acted on. A structured log in a machine format lost for the owner-facing record: the machine-readable form is IF-010, and a person reads this one. The refusal tokens are kept exactly as hosts already search for them; a new refusal class takes a token that names no requirement, because requirement numbering is not a host-visible form."""
version = "1"
status = "Drafted"

[interface.IF-010]
title = "Machine-readable findings"
owner = "CMP-002"
consumers = ["external:EXT-03"]
channel = "standard output"
interface_to_external = ["B-08"]
coincident = """The document written is the findings."""
data = """One UTF-8 JSON document on standard output.
Saved-state report: an array, one object per saved state, oldest first: Name (string, the saved-state folder name), Date (string, ISO-8601), Rows (integer), PhysicalBytes, BytesReclaimed, BytesReHomed (integers, bytes).
Check, and check with repair: an array, one object per finding, empty when clean: Folder (string), FolderName (string), RelativePath (string), DataPath (string), Class (one of DanglingDataPath, FlagOverRaw, FlagOverArchive, NameLies, PayloadMismatch, BlankRowFormDisagreement, Unreferenced, LegacyStoredForm, PoolDataPathMissing, PoolUnresolvable), Observed (string), Expected (string), Repairable (boolean), Repaired (boolean, repair only), KitRevision (integer or null)."""
rationale = """A host deciding whether to remove a saved state, or whether a store is healthy, must parse the answer; scraping the human-readable record lost because its wording is free to change."""
version = "1"
status = "Drafted"

[interface.IF-011]
title = "Notification message"
owner = "CMP-005"
consumers = ["external:EXT-08"]
channel = "SMTP over TLS"
interface_to_external = ["B-09"]
bridged_by = ["DA-09"]
data = """One mail message per run, submitted to Secrets.SmtpServer on Secrets.SmtpPort with TLS: From Secrets.FromEmail, To Secrets.ToEmail, subject Automatic Backup Successful or Automatic Backup Failed, plain-text body holding the run's summary entries. Authentication with the stored login only where the configuration carries one."""
rationale = """An owner who does not read the record needs the outcome to reach him; a host-side alert alone lost because a native-Windows owner may have no host that acts on exit status."""
version = "1"
status = "Drafted"

[interface.IF-012]
title = "Protected notification credential"
owner = "external:EXT-16"
consumers = ["CMP-005", "CMP-024"]
channel = "host credential facility"
interface_from_external = ["B-21"]
bridged_by = ["DA-20"]
data = """A credential object of the host's credential facility: a user name in clear and a password protected by the facility so that only the account that protected it, on that host, can read it. Carried only as Secrets.Credential of the native-Windows configuration document (IF-006)."""
rationale = """A login written readable into any document is a leaked mailbox; a separate secrets store lost because it adds a second file to keep in step with the configuration."""
version = "1"
status = "Drafted"

# --- The backup folder -------------------------------------------------------

[interface.IF-013]
title = "Backup store layout"
owner = "CMP-016"
consumers = ["CMP-011", "CMP-013", "CMP-014", "CMP-017", "external:EXT-02"]
channel = "filesystem"
interface_to_external = ["B-13", "B-02"]
bridged_by = ["DA-19", "DA-01", "DA-15"]
data = """Two roots per configured location.
Backup root (BackupPath), the latest state:
- MANIFEST.csv: the record of contents (IF-014); MANIFEST.csv.meta: its completeness evidence (IF-015);
- MANIFEST.csv.tmp, MANIFEST.csv.meta.tmp: publication temporaries;
- DIRECTORIES.csv: the folder record (IF-017), present only when it has rows; LINKS.csv: the link record (IF-018), present only when it has rows;
- FileBackupState.json and FileBackupState.json.tmp: the run-state record (IF-030);
- the restore kit (IF-019);
- the stored objects, flat at the root, named by IF-016.
Saved-state root (ChangePath):
- Snapshot_<yyyy>_<MM>_<dd>_<HH>_<mm>_<ss>[_<NNN>]: one folder per saved state, matching ^Snapshot_\\d{4}_\\d{2}_\\d{2}_\\d{2}_\\d{2}_\\d{2}; the date and time are host-local, and the optional three-digit suffix separates two folders of the same second. Each holds its own MANIFEST.csv, MANIFEST.csv.meta, DIRECTORIES.csv and LINKS.csv where present, its own restore kit, and the stored objects only it preserves;
- Temp: the staging area (IF-033); Temp.lock: the claim file (IF-032); Temp.stale-<yyyyMMddTHHmmssZ>-<8 hex digits>: reclaimed leftovers; Pruning_<saved-state folder name>: a removal past its commit point;
- backup.log: the location record (IF-009).
Infrastructure names are names at a folder's own root; the same names deeper in a folder are data. RECONSTRUCT.bat, the retired launcher name, is an infrastructure name."""
rationale = """A restorer years later, holding only the folder, must find the latest state, every saved state and the kit by name; without fixed names a restore depends on the tool that made the backup. Mirroring the source tree as stored files lost: deduplication and compression need content-addressed objects, and a mirror cannot hold one copy for many paths."""
version = "2"
status = "Drafted"

[interface.IF-014]
title = "Record of contents"
owner = "CMP-016"
consumers = ["CMP-009", "CMP-011", "CMP-013", "CMP-014", "CMP-017"]
channel = "file"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
bridged_by = ["DA-19"]
data = """CSV per RFC 4180, UTF-8, LF line endings, every field quoted, a header row then one row per file of the state, rows in ordinal order of RelativePath; written without a byte-order mark, read with or without one. A record of a state with no file is the header alone. Columns, in order:
- DataPath: the stored object's name in the state's own folder (IF-016), or blank meaning locate the content by its content key anywhere in the backup;
- RelativePath: the file's path under the source root, components separated by a backslash whatever the host; records written from Linux by earlier versions use the forward slash;
- Length: non-negative 64-bit integer bytes;
- LastWriteTimeStr: the file's modification time, ISO-8601 round-trip text with offset, opaque to readers;
- xxH2Hash: the content digest (IF-034 text form);
- Compressed: Yes or No, the form the writer recorded;
- StoredAsHashSize: the storage-layout marker, Hash for the current form; Original marks a retired form;
- Duplicate: 0, 1 or empty;
- MediaMBPerSec: blank, or a decimal with three places.
The content key of a row is the pair (xxH2Hash, Length)."""
rationale = """Every restorer on every system must read the same rows identically; a spreadsheet-safe CSV with fixed columns is readable by the shell route's text tools and by the language-runtime route alike. A binary or JSON record lost: the shell route's floor tools cannot parse JSON safely."""
version = "2"
status = "Drafted"

[interface.IF-015]
title = "Completeness evidence"
owner = "CMP-016"
consumers = ["CMP-011", "CMP-013", "CMP-014", "CMP-017"]
channel = "file"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
bridged_by = ["DA-11"]
data = """A sidecar beside each record of contents, UTF-8 without byte-order mark, LF line endings, one key=value per line:
- Version=<integer>: the evidence format version, currently 3; a version below 2 marks a retired form;
- Rows=<integer>: data rows in the record;
- Bytes=<integer>: the record's length in bytes;
- XxH128=<32 hex digits>: the content digest of the record's bytes exactly as written;
- Written=<ISO-8601 time>: when the record was written;
- DirRows=<integer>, LinkRows=<integer>: the rows of the state's folder record and link record, 0 when the state has none (from evidence version 3; evidence of version 2 does not state them).
Unknown keys are ignored by a reader of an older version."""
rationale = """A record cut short or swapped for another state's record looks like a valid smaller state; without evidence a restorer would restore it silently and call the result complete. A digest column inside the record lost: a truncated record loses its own evidence with it."""
version = "3"
status = "Drafted"

[interface.IF-016]
title = "Stored object name and form"
owner = "CMP-016"
consumers = ["CMP-010", "CMP-013", "CMP-014", "CMP-019"]
channel = "file name and bytes"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
bridged_by = ["DA-05"]
data = """Name: <hash22>_<len><ext>.
- <hash22>: the full 128-bit content digest in base-57, left-padded to exactly 22 characters;
- '_': the separator, at index 22;
- <len>: the content length in base-57, no padding;
- <ext>: a file extension carried verbatim (may be empty, may contain spaces or non-ASCII characters) for a raw-form object, or .7z for an archive-form object;
- base-57 alphabet: the 62 ASCII letters and digits less 0, O, I, l and 1, in the order 2-9, A-H, J-N, P-Z, a-k, m-z; its first glyph, 2, is the zero digit.
Form: raw (the content's bytes exactly) or archive (a 7z archive holding the content as its single member, beginning with the six signature bytes 37 7A BC AF 27 1C).
Retired grammars, recognised so they are refused: a name holding a path separator, or a space at index 16 in a name of 27 or more characters."""
rationale = """Naming by content makes deduplication a name lookup and lets a reader check a found object against the record; names derived from source paths lost because two paths with one content then need two objects."""
version = "2"
status = "Drafted"

[interface.IF-017]
title = "Folder record"
owner = "CMP-016"
consumers = ["CMP-011", "CMP-020"]
channel = "file"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
coincident = """The record is read as written."""
data = """CSV per RFC 4180, UTF-8 without byte-order mark, every field quoted, rows in ordinal order. Columns: RelativePath (backslash-separated, as in IF-014), Attributes (a comma-separated list drawn from Hidden, System, ReadOnly, NotContentIndexed, or empty). One row per folder that holds no file anywhere beneath it or carries a listed attribute."""
rationale = """A restore built only from file rows loses every empty folder and every folder attribute. Folder rows inside the record of contents lost: every kit already in a backup would read them as files."""
version = "1"
status = "Drafted"

[interface.IF-018]
title = "Link record"
owner = "CMP-016"
consumers = ["CMP-008", "CMP-020"]
channel = "file"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
coincident = """The record is read as written."""
data = """CSV per RFC 4180, UTF-8 without byte-order mark, every field quoted, rows in ordinal order of RelativePath. Columns:
- RelativePath: the link's path under the source root, backslash-separated;
- LinkKind: one of symlink, junction;
- TargetClass: one of inside-source (the target is a folder of the same source, or an ancestor of the link), own-location (the target lies in the backup, its saved states, the change-detection state location or the record location);
- Target: for inside-source, the target's path under the source root, backslash-separated; for own-location, the target's absolute path as it was resolved at backup time.
Present only when the state records at least one link."""
rationale = """A link that is recorded rather than followed vanishes at restore unless something says where it led. Link rows inside the record of contents lost: an existing kit would take a link row for a file with no content and report it missing."""
version = "1"
status = "Drafted"

[interface.IF-019]
title = "Restore kit artifact set"
owner = "CMP-017"
consumers = ["external:EXT-02"]
channel = "files in each state's folder"
carried_by = ["IF-013"]
interface_to_external = ["B-13"]
bridged_by = ["DA-19"]
data = """The artifacts every state's folder carries, each at the folder's root:
- RECONSTRUCT.cmd: the Windows launcher, ASCII with CRLF line endings;
- RECONSTRUCT.command: the macOS launcher;
- the language-runtime restorer, the shell restorer and the restore-safe shared library, each under the fixed name the kit itself documents;
- the hashing library the language-runtime route loads;
- RECONSTRUCT.paths.json: a JSON object {BackupRoot: string, ChangeRoot: string} of absolute paths at backup time;
- THIRD-PARTY-NOTICES.txt: for each third-party component in the folder, its name, version, licence and required notice text;
- KIT-ORIGIN.txt: present only in a state whose kit a kit refresh has replaced; UTF-8, one line OriginalKitRevision=<integer>, the kit revision the state carried before its first refresh.
Each restorer carries a line # KitRevision: <integer>, equal in both; the revision records which record kinds that kit writes and reads."""
rationale = """A state whose kit is incomplete restores only where FileBackup is installed, which is the case the kit exists for. Putting one kit at the backup root only lost: a saved state copied out on its own, or a store whose root kit was refreshed, must still restore with the kit it was written with."""
version = "13"
status = "Drafted"

# --- Restore ---------------------------------------------------------------

[interface.IF-020]
title = "Restore request"
owner = "CMP-022"
requestors = ["external:EXT-02"]
channel = "process command line or double-click"
interface_from_external = ["B-14"]
coincident = """The request as given is what the restore acts on."""
data = """The state restored is the one whose folder the restore is started from: a saved-state folder (IF-013 naming) restores that state, the backup root restores the latest state.
Language-runtime route switches: -TargetRoot <path>, -BackupRootOverride <path>, -ChangeRootOverride <path>, -SevenZipPath <path>, -RequireWitness, -NonInteractive, -NoGui, -ExitCode (accepted, no meaning).
Shell route switches: --target-root <path>, --from <state folder>, --backup-root <path>, --change-root <path>, --seven-zip <path>, --require-witness, --pick-target, -h or --help.
Double-click: RECONSTRUCT.cmd on Windows, RECONSTRUCT.command on macOS, each with no arguments.
An unknown switch, a switch without its value, or a missing target where none can be asked for is a bad request."""
rationale = """A restorer under stress must be able to start a restore by double-click, and a script must be able to start one with no prompt; one form serving both, with the state given by where it is started, lost nothing. Naming the state by argument lost: the folder a person opens already says which point in time it is."""
version = "1"
status = "Drafted"

[interface.IF-021]
title = "Restore outcome value"
owner = "CMP-021"
consumers = ["external:EXT-02", "external:EXT-03"]
channel = "process exit status"
interface_to_external = ["B-15"]
coincident = """The value returned is the outcome."""
data = """An integer exit status, one of: 0 complete; 1 content missing or some part failed; 2 needs a person (bad request or precondition not met); 3 damaged record of contents; 4 retry later (a host fault while the restore worked). The same value set as IF-003."""
rationale = """A wrapper that retries on 4 must never loop over damage, and a person must be told to act on 2; one vocabulary with the backup side lost nothing, and a restore-only table lost because a host would need two readings of one number."""
version = "2"
status = "Drafted"

[interface.IF-022]
title = "Restore report"
owner = "CMP-021"
consumers = ["external:EXT-02"]
channel = "text file and console"
interface_to_external = ["B-15"]
coincident = """The report written is the outcome description."""
data = """RECONSTRUCT.log in the restore target, UTF-8 text, written fresh each restore, one entry per line in the run-record entry grammar (IF-009), every entry also echoed to the console. Entries:
- Not restored: <path> - <cause> per entry, cause one of ContentMissing, ContentMismatch, PathTraversal, NameCollision, MissingDataFile, NoDataPathOrHash, DependencyMissing, StorageUnreadable, CandidateError, WriteMismatch;
- Not applied: <path> - <what> for folder metadata, a modification time or a link;
- Recovered: <path> - from <folder>;
- Unverified: <check> - <reason> for a check an older state cannot support;
- the final summary: restored=<n> not-restored=<n> content=<n> host=<n> outcome=<value>, followed by the names of every entry not restored."""
rationale = """A restorer told only that something failed cannot decide whether to try again or look elsewhere; a count alone lost because the person needs the names."""
version = "1"
status = "Drafted"

[interface.IF-023]
title = "Restored tree"
owner = "CMP-017"
consumers = ["external:EXT-12"]
channel = "filesystem"
interface_to_external = ["B-16"]
bridged_by = ["DA-07", "DA-08"]
data = """Under the chosen target folder: each file of the state at its RelativePath (separators mapped to the target host's), with the recorded bytes and the recorded modification time; each recorded folder, empty ones included, with the recorded attributes the target can hold; each recorded link as a link at its RelativePath; and the restore report (IF-022)."""
rationale = """The restored tree is what the restorer came for; stating its parts fixes what a restore may and may not write. Restoring into a temporary folder and moving it in lost: a move across volumes doubles the space a restore needs."""
version = "1"
status = "Drafted"

[interface.IF-024]
title = "Restore tool floor"
owner = "external:EXT-11"
consumers = ["CMP-017"]
channel = "host commands"
interface_from_external = ["B-18"]
bridged_by = ["DA-10", "DA-18"]
data = """Two routes; a restore needs the tools of one.
- Shell route: bash 4 or later; gawk; a POSIX userland with GNU or BSD core tools (stat, find, sed, grep, od, df, mktemp, touch, date, realpath where present); xxhsum or xxh128sum from xxHash 0.8 or later, printing a 128-bit digest; and, where the state holds compressed content, 7z, 7za or 7zz.
- Language-runtime route: PowerShell 7 or later; and, where the state holds compressed content, 7-Zip.
Each tool is found on the command search path or at a location the restore request names."""
rationale = """A restore that needs uncommon tools fails on the machine at hand; a floor written down is what a restorer can install from a standard package manager. A single route lost: a stock Linux or macOS machine has the shell tools but not the runtime, a stock Windows machine the reverse."""
version = "1"
status = "Drafted"

[interface.IF-025]
title = "Restore target probe"
owner = "external:EXT-12"
consumers = ["CMP-018"]
channel = "filesystem queries"
interface_from_external = ["B-17"]
bridged_by = ["DA-06"]
data = """For a target path: its physical location with every link and junction along the path resolved, or an indication that it cannot be resolved; the identity of the volume holding it, its free bytes and its allocation unit in bytes, each or unknown; whether the target already exists; whether it compares names with or without letter case and whether it normalises Unicode names; and whether it can hold folder links, junctions and each folder attribute."""
rationale = """A target that looks outside the backup by its spelling can land inside it through a link; without the resolved location and the free space a restore can neither refuse safely nor refuse early."""
version = "1"
status = "Drafted"

[interface.IF-026]
title = "Restore host session"
owner = "external:EXT-10"
consumers = ["CMP-022"]
channel = "process environment"
interface_from_external = ["B-19"]
coincident = """The session is as the host reports it."""
data = """Signals read at restore start: the operating system (Windows, Linux, macOS); whether standard input is redirected or closed; whether an interactive console is attached; whether a desktop session is present (on Linux, DISPLAY or WAYLAND_DISPLAY set); and the flavour of the system tools (GNU or BSD)."""
rationale = """Without these signals a restore either asks a question nobody can answer, hanging a script, or never asks a person who double-clicked it."""
version = "1"
status = "Drafted"

[interface.IF-027]
title = "Folder choice dialog"
owner = "external:EXT-10"
requestors = ["CMP-022"]
channel = "desktop dialog"
interface_from_external = ["B-19"]
coincident = """The folder chosen is the answer."""
data = """Request: a title text. Answer: one absolute folder path, or cancelled. Provided by the Windows folder browser, the macOS folder chooser, or zenity, kdialog or yad on a Linux desktop; or by the program named in FILEBACKUP_PICKER, which prints the chosen path on standard output and exits non-zero on cancel."""
rationale = """A double-clicked restore has no command line to read a target from; a typed prompt alone lost because a desktop user may never see a console."""
version = "1"
status = "Drafted"

# --- Sources, working state and the backup volume ----------------------------

[interface.IF-028]
title = "Source tree view"
owner = "external:EXT-04"
consumers = ["CMP-008", "CMP-009"]
channel = "filesystem"
interface_from_external = ["B-01"]
bridged_by = ["DA-04", "DA-12", "DA-14", "DA-21"]
data = """For each entry under a source root: its name, its kind (file, folder, folder link, junction, file link), and for a file its bytes, size and modification time; for a folder its attributes (Hidden, System, ReadOnly, NotContentIndexed among them); for a link its target as the filesystem reports it, and whether that target is reachable. An enumeration or read that fails gives the path and the cause. A volume root's system folders are named System Volume Information and $RECYCLE.BIN."""
rationale = """The capture can be no better than what the source filesystem reports; stating the view fixes what a run may rely on and what it must not change. A snapshot facility of the host lost as the interface: it is absent on most of the filesystems the owner backs up."""
version = "1"
status = "Drafted"

[interface.IF-029]
title = "Change-detection record"
owner = "CMP-009"
consumers = ["external:EXT-01"]
channel = "file"
interface_to_external = ["B-24", "B-20"]
coincident = """The record is plain text the owner can open as written."""
data = """A record of contents (IF-014) with DataPath, Compressed and StoredAsHashSize blank, and its completeness evidence (IF-015), named MANIFEST.csv and MANIFEST.csv.meta, at the SourceStatePath location, by default the source root."""
rationale = """Re-reading every file on every run overruns the backup window; the record of each file's last size, time and digest is what lets a run read only what changed. A private binary cache lost: the owner must be able to open and read what the tool keeps in his source."""
version = "2"
status = "Drafted"

[interface.IF-030]
title = "Run-state record"
owner = "CMP-011"
consumers = ["CMP-009", "CMP-011"]
channel = "file"
data = """FileBackupState.json at the backup root: a UTF-8 JSON object with LastBackupRun (string, ISO-8601 round-trip, the completion time of the latest state) and LastHashRun (string, ISO-8601 round-trip, the time the last completed full re-read began). FileBackupState.json.tmp is its publication temporary. A writer of a later version may add keys; a reader ignores keys it does not know."""
rationale = """The next saved state is named by the latest state's completion time and the re-read schedule counts from the last completed full re-read; neither can be read back from the source. Keeping them in the change-detection record lost: that record lives in the source, which may be read-only or elsewhere."""
version = "1"
status = "Drafted"

[interface.IF-031]
title = "Volume space and identity"
owner = "external:EXT-05"
consumers = ["CMP-010", "CMP-013"]
channel = "filesystem queries"
interface_from_external = ["B-03"]
bridged_by = ["DA-06"]
data = """For a path: the host's mount table on Linux and macOS, or the drive or share root on Windows; and for a volume, its free bytes and its allocation unit in bytes, each or unknown."""
rationale = """Two locations on one volume compete for the same free space; a check that measures each path separately passes two demands that together do not fit. Treating every path as its own volume lost for that reason."""
version = "1"
status = "Drafted"

[interface.IF-032]
title = "Exclusive-use claim"
owner = "CMP-012"
consumers = ["CMP-013", "CMP-014"]
channel = "operating-system file lock"
interface_to_external = ["B-04"]
bridged_by = ["DA-02", "DA-03"]
data = """The file Temp.lock at the saved-state root (IF-013), opened (created when absent) with read access and no sharing; holding that open handle is the claim. The file is empty."""
rationale = """Two changing operations on one backup can each destroy what the other just wrote; a claim every FileBackup on the same kernel or Windows share honours is the cheapest exclusion that a process death releases by itself. A lock file whose presence is the claim lost: a dead holder leaves it behind and wedges the store."""
version = "1"
status = "Drafted"

[interface.IF-033]
title = "Staging area and owner record"
owner = "CMP-012"
consumers = ["CMP-011", "CMP-013"]
channel = "filesystem"
interface_to_external = ["B-04"]
bridged_by = ["DA-16"]
data = """Temp at the saved-state root: the staging area of the one changing operation holding the backup. While a backup holds it, Temp contains RUN.inprogress, a UTF-8 JSON object: SchemaVersion (integer), Kind (string), RunId (string, a fresh GUID per acquisition), SetName, Host, ContainerId, BootId (strings, diagnostic), Pid (integer, diagnostic), StartedUtc (ISO-8601), HeartbeatIntervalSeconds (integer, 60), StaleAfterSeconds (integer, at least 1800); its modification time is part of the record. While a removal holds it, Temp contains PRUNE.inprogress, UTF-8 text holding the name of the saved-state folder being removed. Other entries a backup may place in Temp: the copied prior record of contents, its completeness evidence, the folder record, the link record and their publication temporaries."""
rationale = """A dead run's leftovers must be told from a live run's by any later FileBackup, on any host or container sharing the store, from the disk alone; a process-identity check lost because a container shares neither process namespace nor host with the reader."""
version = "1"
status = "Drafted"

# --- Tools and package source ------------------------------------------------

[interface.IF-034]
title = "Content digest"
owner = "CMP-016"
consumers = ["CMP-009", "CMP-010", "CMP-013", "CMP-014", "CMP-019"]
channel = "library call or host command"
interface_from_external = ["B-10"]
bridged_by = ["DA-18", "DA-05"]
data = """XXH128 (xxHash, 128-bit, seed 0) over a byte stream. Text form: 32 uppercase hexadecimal digits, most significant byte first. Computed by the hashing library (IF-037) on the backup side and the language-runtime restore route, and by the host's digest command (IF-024) on the shell restore route."""
rationale = """Two hosts or two routes that compute different digests for one content can neither deduplicate against each other nor verify each other's restores; one named algorithm and one text form is what makes them agree. A cryptographic digest lost: its speed would put the run-time budget out of reach, and DA-05 accepts the collision risk for the owner's own files."""
version = "1"
status = "Drafted"

[interface.IF-035]
title = "Archive tool"
owner = "external:EXT-06"
requestors = ["CMP-010", "CMP-013", "CMP-014", "CMP-019"]
channel = "host command"
interface_from_external = ["B-10"]
bridged_by = ["DA-18"]
data = """7-Zip invoked as a command: add one file to a new 7z archive at effort level 0 to 9; extract the single member of a 7z archive to a folder; exit status 0 on success. Found at Tools.SevenZipPath, FILEBACKUP_7ZIP_PATH, the platform's standard install location or the command search path."""
rationale = """Compression and expansion must give the same bytes on every host and route; a format every supported system has a free extractor for is the one a restorer can obtain. A built-in codec lost: the shell route has no runtime to run it in."""
version = "1"
status = "Drafted"

[interface.IF-036]
title = "Media probe"
owner = "external:EXT-06"
requestors = ["CMP-015"]
channel = "host command"
interface_from_external = ["B-10"]
coincident = """The playing time reported is the measure taken."""
data = """ffprobe invoked on one file for the container's format duration: a decimal number of seconds on standard output, or no number when the file has no playing time; a non-zero exit status on failure. Found at Tools.FfprobePath, FILEBACKUP_FFPROBE_PATH, the platform's default location or the command search path."""
rationale = """The space view's encoding rate needs a playing time no other shipped component can measure; writing a media parser lost on cost against an optional feature."""
version = "1"
status = "Drafted"

[interface.IF-037]
title = "Package source"
owner = "external:EXT-07"
requestors = ["CMP-004"]
channel = "network package feed"
interface_from_external = ["B-11"]
coincident = """The package fetched is the component obtained."""
data = """The public NuGet feed, package System.IO.Hashing at version 8.0.0, installed for the current user; the package's published SHA-256 identifies it."""
rationale = """A host without the hashing component must be able to obtain it on first use without a person installing it by hand; bundling it only lost for the native-Windows install, which ships no copy until the first backup has run."""
version = "1"
status = "Drafted"

# --- Container -------------------------------------------------------------

[interface.IF-038]
title = "Container actions and environment"
owner = "CMP-023"
requestors = ["external:EXT-09", "external:EXT-03"]
channel = "container start arguments and environment"
interface_from_external = ["B-12"]
coincident = """The action and variables given at start are the request."""
data = """Action: a leading positional word, or FILEBACKUP_ACTION, one of backup (the default when both are absent), prune, snapshots, verify. Any argument starting with '-' passes through to the backup launch request (IF-002) unchanged.
Variables: FILEBACKUP_CONFIG_PATH (default /config/FileBackup.json); FILEBACKUP_LOG_PATH (default /logs/Backup_Global.log); FILEBACKUP_SNAPSHOT (saved-state names for prune, comma-separated); FILEBACKUP_REPAIR (with verify, run the repair); FILEBACKUP_DRY_RUN (with prune, the removal dry run); and the environment settings of IF-007. A flag variable is set when it holds exactly one of 1, true, TRUE, True, yes, YES, Yes.
Exit status: the operation outcome value (IF-003)."""
rationale = """A container platform starts an image with words and variables, not a shell; without a stated mapping a host could not run removals or checks in the container. Requiring a shell inside the container lost: the image runs with no interactive session and as an unprivileged user."""
version = "2"
status = "Drafted"

[interface.IF-039]
title = "Container mounts and user"
owner = "CMP-023"
requestors = ["external:EXT-09"]
channel = "container platform"
interface_from_external = ["B-12"]
bridged_by = ["DA-13"]
data = """Mounts: /config (the configuration document, read-only), /source (read-only), /state (the change-detection record location, writable), /backup (writable), /changes (writable), /logs (writable), /tmp (writable scratch, may be a memory filesystem). User: uid 65532, gid 65532, no added capabilities. No network is required."""
rationale = """A host must know which folders to mount and how, or a run either fails on a missing mount or is given more access than it needs. Running as root with one writable mount lost on SR-130's least-access requirement."""
version = "1"
status = "Drafted"

[interface.IF-040]
title = "Container image contents"
owner = "CMP-023"
consumers = ["external:EXT-03", "external:EXT-09"]
channel = "OCI image"
interface_to_external = ["B-22"]
coincident = """The image as delivered is the deliverable."""
data = """An OCI image whose entry point is the container launch of IF-038, carrying: the PowerShell 7 runtime; the backup program and the restore kit; the hashing library at the version of IF-037; 7-Zip; and /opt/filebackup/THIRD-PARTY-NOTICES.txt giving, for each third-party component in the image, its name, version, licence and required notice text."""
rationale = """A host with nothing installed must be able to run backups from the image alone; an image that fetches components at run time lost because the container runs with no network."""
version = "1"
status = "Drafted"

# --- Views -------------------------------------------------------------------

[interface.IF-041]
title = "Browse view"
owner = "CMP-015"
consumers = ["external:EXT-01"]
channel = "files"
interface_to_external = ["B-06", "B-20"]
coincident = """The view as written is what the owner opens."""
data = """At the ViewPath location: INDEX.tsv (UTF-8, tab-separated, a header then one row per path of the latest state, duplicates included: RelativePath, DataPath, Length, xxH2Hash, Compressed); one INDEX.html per folder of the latest state, each entry a relative link to its stored object; a root INDEX.html with a name search, replaced by a pointer to INDEX.tsv above a documented row count; and .viewstamp holding the SHA-256 of the canonical rows the view mirrors."""
rationale = """An owner who wants one file back without a restore needs to find and open it by name; a listing inside the backup folder lost because it would be taken for data and would not be outside every source and store."""
version = "1"
status = "Drafted"

[interface.IF-042]
title = "Space view"
owner = "CMP-015"
consumers = ["external:EXT-01"]
channel = "file"
interface_to_external = ["B-06"]
coincident = """The listing as written is what the owner reads."""
data = """SPACE.tsv at the ViewPath location: UTF-8, tab-separated, a header then one row per file of the latest state, ordered by StoredBytes descending then RelativePath ordinal. Columns: RelativePath; StoredBytes (integer, the size of the stored copy); Shared (yes when the stored copy serves more than one path, else no); MediaMBPerSec (decimal with three places, or blank); MediaMeasure (taken, not-taken: <reason>)."""
rationale = """An owner deciding where backup space goes needs the files ordered by what they cost; the browse view's folder order cannot answer that. A report inside the run record lost: it would bury the run's own entries."""
version = "1"
status = "Drafted"

# --- Internal ------------------------------------------------------------------

[interface.IF-043]
title = "Content-location index"
owner = "CMP-013"
consumers = ["CMP-011", "CMP-014"]
channel = "in-process call"
data = """Request: the backup root and the saved-state folders, in the order backup root first, then saved states oldest first; whether whole records are to be retained. Answer: a map from each content key '<xxH2Hash>|<Length>' to the places holding those bytes, each place giving its folder, its DataPath, whether it is the backup root, and its folder order; and one record per folder giving its identity, its order, the non-blank DataPath values of its record and, when asked, its whole record."""
rationale = """Removal, the check and the cross-state collapse each need to know where every content lives; three separate scans lost because they would disagree on what exists, and the removal's reclaim figure would not be the reclaim achieved."""
version = "1"
status = "Drafted"

[interface.IF-044]
title = "Leftover classification verdict"
owner = "CMP-012"
consumers = ["CMP-011"]
channel = "in-process call"
data = """Request: the listing of the staging area and the owner record as read (parsed, unparseable or unreadable, with its modification time and age). Answer: one verdict of Empty, EmptyFresh, OwnerStale, OwnerLive, PruneHeld, HoldsContent, Indeterminate, with the evidence it rests on."""
rationale = """The decision whether an earlier run's leftovers may be reclaimed must be testable over every combination without a filesystem; a classifier that performs its own reads lost because its matrix could then only be exercised on real disks."""
version = "1"
status = "Drafted"

[interface.IF-045]
title = "Content search by key"
owner = "CMP-019"
requestors = ["CMP-019"]
channel = "in-process call"
data = """Request: a content key (the digest and the length); the pool folders, the backup root and every saved-state folder; optionally one folder to leave out. Answer: exactly one of
- found: the folder, the stored name, the stored bytes and the proven form (raw or archive);
- content-missing: with the candidates that failed and why;
- dependency-missing: the tool that was needed;
- storage-unreadable: the folder or item that could not be read."""
rationale = """Both restore routes realise this search, and a restore's outcome depends on which answer it gives; a typed answer set is what the two routes must agree on. Leaving the answer set in prose lost because a route that folds a host cause into content-missing reports loss where there is none."""
version = "1"
status = "Drafted"

[interface.IF-046]
title = "Backup runtime and tool floor"
owner = "external:EXT-06"
consumers = ["CMP-004"]
channel = "host commands and runtime"
interface_from_external = ["B-10"]
bridged_by = ["DA-18"]
data = """What a backup host provides for the backup side:
- the runtime: PowerShell 7 or later, reporting its version;
- the hashing library (IF-037), loadable by the runtime;
- the archive tool (IF-035), where any location set compresses;
- the media probe (IF-036), optional.
Each tool, when looked for, is either found (with its location and version) or absent."""
rationale = """A run that finds a missing runtime or tool halfway has already changed the backup, so the floor must be stated where the launch can check it first. Leaving the floor in the user manual only lost because nothing then ties the launch check to it."""
version = "1"
status = "Drafted"
