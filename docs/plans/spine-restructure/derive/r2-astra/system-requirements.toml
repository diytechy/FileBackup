[requirement.SR-121]
title = "Apply the chosen recheck schedule"
sn_refs = ["SN-007"]
boundary_refs = ["B-05","B-07","B-01","B-20"]
requirement = "When a backup begins, the system shall reread unchanged-looking content according to HashRecalcFreq."
rationale = "SN-007 reserves the cost-versus-detection choice to the owner; a fixed always-or-never policy loses that control."
acceptance_criteria = "A and E reread every run, N never schedules a reread, and D/W/M/Y reread on the first run at or after one calendar day/week/month/year since the last completed full reread; the first due run captures same-size same-time changes. Calendar periods use the backup host local time, with missing month-end dates clamped to the last day of the destination month."
permutations = "HashRecalcFreq=set{A,E,D,W,M,Y,N}; due=bool; hiddenChange=bool; @pairwise"
priority = "S"
verification = "Test"
status = "Drafted"
form = "interface"
