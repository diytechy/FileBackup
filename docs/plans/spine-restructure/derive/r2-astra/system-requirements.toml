# Re-derivation draft. Read notes for blindness qualifications and proposed thresholds.

[requirement.SR-101]
title = "Capture the source tree"
sn_refs = ["SN-001"]
boundary_refs = ["B-01","B-02","B-13"]
requirement = "When a backup runs, the system shall capture each readable source file in the latest backed-up state except its own operational artifacts and volume-owned system folders."
rationale = "SN-001 loses coverage if enumeration is limited to visible files; exclusion by ownership wins over exclusion by a bare name."
acceptance_criteria = "Every eligible path, including hidden, system, dot-named and nested names resembling operational artifacts, is recoverable with the content captured on that run."
permutations = "visibility=set{ordinary,hidden,system,dot}; location=set{root,nested}; change=set{new,changed,unchanged}; @pairwise"
priority = "M"
verification = "Test"
status = "Drafted"
form = "interface"
da_refs = ["DA-04","DA-12","DA-14"]
hat_refs = ["FILESYSTEM-SEMANTICS"]
delivered_with = ["SR-102"]

[requirement.SR-102]
title = "Report capture gaps"
sn_refs = ["SN-001","SN-052"]
boundary_refs = ["B-01","B-06","B-08","B-20"]
requirement = "If a source file or directory cannot be captured, then the system shall report the affected paths and causes as a failed backup result."
rationale = "SN-001 and SN-052 require visible gaps; treating an unreadable subtree as absent would conceal loss."
acceptance_criteria = "No inaccessible file or subtree is silently counted as captured or deliberately deleted; the record identifies every known affected path and inaccessible subtree and the run reports failure."
permutations = "failure=set{file-read,directory-read,copy}; prior=bool; @pairwise"
priority = "M"
verification = "Test"
status = "Drafted"
form = "interface"
hat_refs = ["UNATTENDED-OPS"]
coincident = "The specified boundary output is the observable outcome for the cited need; siblings supply the other stated obligations."
delivered_with = ["SR-101","SR-103","SR-104"]

[requirement.SR-103]
title = "Bound temporary-read recovery"
sn_refs = ["SN-052"]
boundary_refs = ["B-01","B-06"]
requirement = "If source reads fail transiently, then the system shall retry within a total additional waiting budget of five seconds per configured source."
rationale = "SN-052 rejects both immediate abandonment and unbounded waiting; UNATTENDED-OPS derives a finite aggregate wait budget rather than a per-file delay that grows without bound. Five seconds is a proposed operating limit requiring owner confirmation."
acceptance_criteria = "A read that becomes available before its next retry within the five-second budget is captured; the aggregate deliberate retry waits do not exceed five seconds regardless of the number of unreadable files."
permutations = "files=set{one,many}; availability=set{next-retry,after-budget,never}; @pairwise"
priority = "S"
verification = "Test"
status = "Drafted"
form = "interface"
hat_refs = ["UNATTENDED-OPS"]
coincident = "The specified boundary output is the observable outcome for the cited need; siblings supply the other stated obligations."
delivered_with = ["SR-102","SR-104"]

[requirement.SR-104]
title = "Preserve unreadable prior versions"
sn_refs = ["SN-052"]
boundary_refs = ["B-01","B-02","B-13"]
requirement = "If a previously backed-up file cannot be captured on a later run, then the system shall retain its previously saved version as recoverable."
rationale = "SN-052 loses the only safe copy if failure is interpreted as deletion; retaining prior content wins over replacing it with an absent entry."
acceptance_criteria = "The prior bytes remain restorable after an exhausted read failure, including when another source file shared those bytes."
permutations = "shared=bool; failure=set{read,copy}; @pairwise"
priority = "S"
verification = "Test"
status = "Drafted"
form = "interface"
hat_refs = ["SHARED-CONTENT"]
coincident = "The specified boundary output is the observable outcome for the cited need; siblings supply the other stated obligations."
delivered_with = ["SR-102","SR-103"]

