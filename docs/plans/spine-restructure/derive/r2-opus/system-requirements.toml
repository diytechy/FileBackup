status = "Drafted"
coincident = """The obtained component or the refusal is the outcome."""
form = "interface"

[requirement.SR-195]
title = "The configuration has a documented, versioned description matching the launch checks"
sn_refs = ["SN-050"]
boundary_refs = ["B-05", "B-07"]
requirement = """The system shall publish a documented, versioned description of the configuration that accepts and refuses exactly the configurations the launch checks accept and refuse."""
rationale = """A host generating configurations needs a contract it can rely on across versions; a description that drifts from what launch enforces leaves every integrator guessing."""
acceptance_criteria = """For a corpus of valid and invalid configurations, the published description and the launch checks give the same verdict on every one."""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The agreement between description and checks is the outcome."""
form = "interface"

[requirement.SR-196]
title = "The shipped example configuration is accepted"
sn_refs = ["SN-050"]
boundary_refs = ["B-05", "B-07"]
requirement = """The system shall ship an example configuration that passes the launch checks unchanged apart from its locations."""
rationale = """A shipped example that is itself rejected teaches an integrator nothing and suggests the contract is not real."""
acceptance_criteria = """The shipped example, with only its locations changed to existing folders, is accepted by the launch checks and by the published description."""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The acceptance is the outcome."""
form = "interface"

[requirement.SR-197]
title = "Each configuration states the version of the description it follows"
sn_refs = ["SN-050"]
boundary_refs = ["B-05", "B-07"]
requirement = """The system shall require each configuration to state, in ConfigVersion, which version of the configuration description it follows."""
rationale = """Without a stated version, a configuration written for another version can only be half-understood; with it, the launch can refuse what it does not support."""
acceptance_criteria = """A configuration without ConfigVersion is refused with the configuration-refused outcome; one stating the current version is accepted."""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The acceptance or refusal is the outcome."""
form = "interface"

[requirement.SR-198]
title = "A wrong or missing configuration is refused before any backup is touched"
sn_refs = ["SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If the configuration is missing, or has an unknown key, a value of the wrong kind, a missing required setting, or an unsupported ConfigVersion, then the system shall refuse the run before any backup data is touched, naming the setting and what was expected, with the configuration-refused outcome, creating and changing nothing."""
rationale = """A mistyped key or a quoted "false" where a yes-or-no belongs silently changes what the owner asked for, including disarming a safety setting. Coercing or ignoring lost."""
acceptance_criteria = """Each fault in turn refuses with exit code 2, the message names the setting and the expected kind or value, and no backup, saved state, log or listing is created or changed."""
permutations = """fault=set{missing-file,unknown-key,wrong-type,quoted-boolean,missing-required,version-too-old,version-too-new,non-integer-version}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched environment are the outcome."""
form = "interface"

[requirement.SR-199]
title = "A missing required component or unsupported runtime stops the run first"
sn_refs = ["SN-015"]
boundary_refs = ["B-10", "B-08"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If the runtime is unsupported, or a required component or a tool a chosen setting needs is missing, then the system shall refuse before changing the backup, naming what is missing and how to obtain it."""
rationale = """A run that proceeds without its content-identity function or the tool its storage setting needs writes a backup that cannot be trusted or restored; failing first costs one run, failing later costs the store."""
acceptance_criteria = """With an unsupported runtime, with the hashing component absent, and with compression on but the archive tool absent, each run refuses, the backup is byte-identical, and the message names the missing item and how to obtain it."""
permutations = """missing=set{unsupported-runtime,hashing-component,archive-tool-with-compression}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-194"]
coincident = """The refusal and the untouched backup are the outcome."""
form = "interface"

[requirement.SR-200]
title = "A missing optional extra is skipped visibly"
sn_refs = ["SN-015"]
boundary_refs = ["B-10", "B-06"]
requirement = """If only an optional extra is missing, then the system shall complete the run and record that the extra was skipped."""
rationale = """Refusing a run over an optional extra stops backups for no data reason; skipping it silently hides that the owner is not getting what they set up."""
acceptance_criteria = """With only the media-measurement tool absent, the run completes with the complete outcome and its record says the extra was skipped."""
priority = "M"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-120"]
coincident = """The completed run and its record are the outcome."""
form = "interface"
