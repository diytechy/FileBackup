[requirement.SR-193]
title = "Shipped guidance takes a new user to a first backup"
sn_refs = ["SN-012"]
boundary_refs = ["B-05"]
requirement = """The system shall ship quick-start guidance and a configuration helper with which a new user on a supported host builds a configuration and completes a first backup."""
rationale = """A tool that can only be configured by reading its code is set up wrongly or not at all."""
acceptance_criteria = """A user new to the tool, following only the shipped quick-start guidance and its configuration helper on a supported host, completes a first backup with the complete outcome."""
priority = "S"
verification = "Demonstration"
status = "Drafted"
coincident = """The first completed backup is the outcome."""
