verification = "Test"
status = "Drafted"
coincident = """The restored tree is the outcome."""
form = "interface"

[requirement.SR-163]
title = "A restore behaves the same on Windows, Linux and macOS"
sn_refs = ["SN-022"]
boundary_refs = ["B-19", "B-16"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """The restore kit shall restore any state to an identical tree on a stock Windows, Linux or macOS machine meeting the documented tool floor, including one without the backup tool's runtime."""
rationale = """The machine at hand after a disaster is often not the one that made the backup."""
acceptance_criteria = """The same backup restores the latest state and a saved state to byte-identical trees on each of the three systems, with the backup runtime absent."""
permutations = """restore_system=set{windows,linux,macos}; state=set{latest,saved}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-10", "DA-18"]
form = "assumption"

[requirement.SR-164]
title = "A missing restore tool is refused by name"
sn_refs = ["SN-022"]
boundary_refs = ["B-18", "B-15"]
requirement = """If a tool the restore needs is missing from the restore host, then the restore kit shall refuse before writing anything, naming the tool to install."""
rationale = """A restore that starts and then fails for a missing tool leaves a partial tree and no clear fix."""
acceptance_criteria = """With each floor tool removed in turn, the restore writes nothing and its message names that tool and how to obtain it."""
permutations = """missing=set{hash-utility,archive-extractor,text-processor,shell-version}; compressed_content=bool; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The refusal message is the outcome."""
form = "interface"

[requirement.SR-165]
title = "A restore reports no damage that is not there, whatever the host's tool flavour"
sn_refs = ["SN-022"]
boundary_refs = ["B-19", "B-18", "B-15"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """The restore kit shall report an intact backup as complete on every supported restore host, whichever flavour of system tools it has."""
rationale = """A restorer that misreads a different tool set reports damage on an intact backup, sending the restorer to an older copy or a loss that never happened."""
acceptance_criteria = """An intact backup restores with exit code 0 on hosts with GNU and with BSD system tools, every file byte-exact."""
permutations = """tool_flavour=set{gnu,bsd,windows}; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-18"]
form = "assumption"

[requirement.SR-166]
title = "A double-clicked restore asks for the target and keeps its outcome on screen"
sn_refs = ["SN-035"]
boundary_refs = ["B-14", "B-15", "B-19"]
requirement = """When a restore is opened by double-click from the backup folder on Windows or macOS, the restore kit shall ask for the target folder, restore, and keep the outcome on screen until it is dismissed."""
rationale = """The moment of restore is the worst moment to recall a parameter, and a window that closes on its result leaves the restorer not knowing whether the files are back."""
acceptance_criteria = """Double-clicking the restore on Windows and on macOS presents a folder choice, restores into the chosen folder, and leaves the outcome visible until dismissed."""
permutations = """restore_system=set{windows,macos}; outcome=set{complete,failed}; @full"""
priority = "S"
verification = "Demonstration"
status = "Drafted"
coincident = """The interaction is the outcome."""
form = "interface"

[requirement.SR-167]
title = "A scripted restore asks nothing"
sn_refs = ["SN-035", "SN-011"]
boundary_refs = ["B-14", "B-15"]
requirement = """When a restore is started with its arguments, the restore kit shall run without asking anything and return its outcome."""
rationale = """A script cannot answer a dialog; a scripted restore that prompts hangs."""
acceptance_criteria = """A restore started with a state and a target by a script, with input closed, completes and returns its outcome without any prompt or dialog."""
permutations = """restore_system=set{windows,linux,macos}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The unprompted completion is the outcome."""
form = "interface"

[requirement.SR-168]
title = "A successful restore has checked every file it wrote"
sn_refs = ["SN-033"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """The restore kit shall report a restore complete only when every file it wrote has been checked to have the content the backup recorded for it."""
rationale = """A wrong stored copy, a flipped bit or a truncated file would otherwise restore with a success status. Trusting the store lost."""
acceptance_criteria = """With stored content altered, bit-flipped at the same length, and truncated, the restore never reports exit code 0 with any written file differing from its recorded content."""
permutations = """damage=set{altered,same-length-bit-flip,truncated}; compressed=bool; restorer=set{windows,linux}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-05", "DA-18"]
delivered_with = ["SR-169"]
form = "assumption"

[requirement.SR-169]
title = "A damaged file is restored from another intact copy or named"
sn_refs = ["SN-033", "SN-053"]
boundary_refs = ["B-16", "B-15"]
requirement = """If a file's stored content does not match its record, then the restore kit shall produce it from another intact copy in the backup where one exists, and otherwise name the file and report failure."""
rationale = """Giving up on a file while an intact copy sits elsewhere in the backup throws away what could be saved."""
acceptance_criteria = """With one copy of a content damaged and another intact in a saved state, the file restores byte-exact; with every copy damaged, the file is named and the restore reports the content-missing outcome."""
permutations = """intact_copy=set{none,latest,saved-state}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-168", "SR-170"]
coincident = """The restored file or the named failure is the outcome."""
form = "interface"

[requirement.SR-170]
title = "A partial restore restores everything else and names what did not come back"
sn_refs = ["SN-053"]
boundary_refs = ["B-16", "B-15"]
requirement = """If some files of a state cannot be restored, then the restore kit shall restore every other file, name every file it could not restore with the cause, report how many, and report failure."""
rationale = """A restore that stops at the first problem throws away what could be saved; one that does not list what is missing leaves the restorer believing the tree is whole."""
acceptance_criteria = """With some stored content missing or damaged beyond recovery, every other file restores byte-exact, each unrestored file is named with its cause, the count is reported, and the outcome is not complete."""
permutations = """unrestorable_count=range[1..1000]; cause=set{missing,damaged,host-problem}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-169", "SR-177"]
coincident = """The restored tree and the report are the outcome."""
form = "interface"

[requirement.SR-171]
title = "A restore refuses a damaged or substituted record of contents"
sn_refs = ["SN-025"]
boundary_refs = ["B-13", "B-15"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """If the record of the state being restored is truncated, partly written or replaced, then the restore kit shall refuse before creating the target or writing anything, with exit code 3."""
rationale = """A restore that trusts a shrunken record reproduces a shrunken tree and reports success, and the restorer cannot know files are missing."""
acceptance_criteria = """With the record of the latest state and of a saved state each truncated, partly written, and replaced by another state's record, every restorer exits 3 and the target does not exist or is unchanged."""
permutations = """fault=set{truncated,partly-written,replaced}; state=set{latest,saved}; restorer=set{windows,linux}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched target are the outcome."""
form = "interface"

[requirement.SR-172]
title = "A restore target inside the backup is refused"
sn_refs = ["SN-042"]
boundary_refs = ["B-17", "B-15"]
hat_refs = ["SECURITY"]
requirement = """If the restore target lies inside the backup folder, directly or through a link, then the restore kit shall refuse before writing anything."""
rationale = """A restorer under stress may pick the wrong folder; writing into the backup can destroy the content being restored."""
acceptance_criteria = """Targets equal to the backup folder, inside it, and reaching it through a link are each refused with exit code 2 and the backup is byte-identical; a target outside the backup restores normally."""
permutations = """target=set{equal,inside,via-link,outside}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal and the untouched backup are the outcome."""
form = "interface"

[requirement.SR-173]
title = "A restore never writes outside its target"
sn_refs = ["SN-042"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["SECURITY"]
requirement = """If an entry in the record of a state has a path that would land outside the restore target, then the restore kit shall not write it, shall name it, and shall report failure."""
rationale = """A damaged or crafted record can name a path that climbs out of the target and overwrites files the restorer never meant to touch."""
acceptance_criteria = """A record holding entries with parent-climbing and absolute paths restores every other entry, writes nothing outside the target, names each such entry, and reports a non-complete outcome."""
permutations = """path_form=set{parent-climb,absolute,drive-qualified,via-link}; restorer=set{windows,linux}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Nothing written outside the target is the outcome."""
form = "interface"

[requirement.SR-174]
title = "Each restored file gets its own modification time"
sn_refs = ["SN-036"]
boundary_refs = ["B-01", "B-16"]
requirement = """The restore kit shall give each restored file the modification time recorded for it, including files that share one stored copy."""
rationale = """Identical files are stored once; unless each file's own time is applied, every twin comes back with the time of whichever was stored first."""
acceptance_criteria = """Two identical files with different modification times restore with their own times, with compression on and off, through every restorer."""
permutations = """CompressEnabled=bool; restorer=set{windows,linux,macos}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-07"]
form = "assumption"

[requirement.SR-175]
title = "Empty folders are recreated"
sn_refs = ["SN-036"]
boundary_refs = ["B-01", "B-16"]
requirement = """The restore kit shall recreate every folder of the state that holds no file, nested empty folders included."""
rationale = """A tree missing its empty folders is not the tree the owner had; the folder structure may itself be meaningful to applications."""
acceptance_criteria = """An empty folder and a nested chain of empty folders in the source exist in the restored tree through every restorer."""
permutations = """nesting=range[1..8]; restorer=set{windows,linux,macos}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The recreated folders are the outcome."""
form = "interface"

[requirement.SR-176]
title = "Hidden and system folders come back hidden, or the gap is reported"
sn_refs = ["SN-036"]
boundary_refs = ["B-01", "B-16", "B-15"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """The restore kit shall apply a folder's recorded hidden and system attributes where the target supports them, and where it does not, create the folder and report the attributes it could not apply."""
rationale = """A hidden folder that comes back visible is not the tree the owner had; pretending to apply attributes a system lacks hides the difference."""
acceptance_criteria = """A hidden and system folder restores hidden and system on Windows; on Linux and macOS the folder is created and the restore's report lists the attributes not applied."""
permutations = """restore_system=set{windows,linux,macos}; attribute=set{hidden,system,both}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-07"]
form = "assumption"

[requirement.SR-177]
title = "Names that would collide on the restore target are reported, never merged"
sn_refs = ["SN-032", "SN-053"]
boundary_refs = ["B-16", "B-15"]
hat_refs = ["CROSS-PLATFORM"]
requirement = """If two recorded names would land on the same name on the restore target, then the restore kit shall write neither over the other, name both, and report failure."""
rationale = """Derived through CROSS-PLATFORM: names that differ only by case, or by Unicode normalisation, are distinct on the backup host and one file on a case-insensitive or normalising target, so one file silently replaces the other. SN-032 asks that names come back exactly and SN-053 that the restorer is told which files did not; refusing the whole restore lost because every other file can still come back."""
acceptance_criteria = """A state holding two names differing only by case, restored onto a case-insensitive target, restores every other file, names both colliding entries, and reports a non-complete outcome; on a case-sensitive target both restore."""
permutations = """collision=set{case,unicode-normalisation}; target_case_sensitive=bool; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-08"]
form = "assumption"

[requirement.SR-178]
title = "Every restorer reports the same documented outcome per failure class"
sn_refs = ["SN-026"]
boundary_refs = ["B-15", "B-19"]
requirement = """The restore kit shall end every restore with one documented outcome value per class: 0 complete, 1 content missing, 2 bad request or precondition, 3 damaged record of contents, 4 host or tool problem, applying a documented precedence when several apply, identically on every supported system."""
rationale = """A host supervising restores must tell "the bytes are gone" from "fix this machine and retry" from "wrong folder"; one generic failure sends a script into retrying over real damage. A fixed precedence is needed so that a mixed failure maps to one value."""
acceptance_criteria = """Deliberately induced instances of each class, alone and in combination, produce the documented value through every restorer on every supported system."""
permutations = """class=set{complete,content-missing,precondition,damaged-record,host-problem}; combined_with=set{none,content-missing,host-problem}; restorer=set{windows,linux,macos}; @pairwise"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The outcome value is itself the outcome."""
form = "interface"

[requirement.SR-179]
title = "Where turned on, a browsable listing of the latest state is produced"
sn_refs = ["SN-008"]
boundary_refs = ["B-06", "B-20"]
requirement = """Where BrowseView is index, the system shall produce after each run a listing of every backed-up path of the latest state, duplicates included, searchable by name, in which opening an entry opens that file's stored content."""
rationale = """The backup is organised by content, not by the original tree, so it cannot be browsed by eye; without another way in, finding one file means restoring everything."""
acceptance_criteria = """With BrowseView index, after a run the listing holds every path of the latest state including duplicates, a name search finds a given file, and opening its entry yields its content; with off, no listing is produced."""
permutations = """BrowseView=set{off,index}; duplicates=bool; @full"""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The listing is the outcome."""
form = "interface"

[requirement.SR-180]
title = "A listing location that overlaps a source or a backup is refused"
sn_refs = ["SN-037", "SN-034", "SN-027"]
boundary_refs = ["B-05", "B-07", "B-08"]
requirement = """If the configured listing location overlaps a source or a backup, by lying inside one, equalling one or containing one, then the system shall refuse the run before it starts."""
rationale = """The listing is regenerated from scratch, so a location that overlaps the source would alter it (SN-037) and one that overlaps a backup would remove stored content (SN-034); SN-027 asks that such a wrong setting stop the run rather than be guessed at."""
acceptance_criteria = """With ViewPath inside, equal to, and containing the source, the backup and the saved-state location in turn, the run is refused with the configuration-refused outcome and nothing is created or changed."""
permutations = """relation=set{inside,equal,containing}; other=set{source,backup,saved-states}; @full"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """The refusal is the outcome."""
form = "interface"

# --- UNATTENDED OPERATION AND OUTCOMES ----------------------------------------

[requirement.SR-181]
title = "An operation with nobody present never prompts"
sn_refs = ["SN-011"]
boundary_refs = ["B-07", "B-08", "B-14", "B-15"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """If an operation is started with no person present, then the system shall not ask anything, and where an answer would have been needed shall report failure with the reason."""
rationale = """A scheduled task that hangs on a prompt is a silent backup failure that may also block the next run."""
acceptance_criteria = """A backup, a removal, a check and a restore each started non-interactively, with input redirected, and with no console and no desktop, finish without waiting; one that needed an answer reports a failure outcome naming the reason."""
permutations = """operation=set{Backup,Prune,Verify,restore}; absence=set{non-interactive-flag,redirected-input,no-console-no-desktop}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
coincident = """Finishing without waiting is the outcome."""
form = "cross-cutting"

[requirement.SR-182]
title = "Backups, removals and checks report one of a few documented outcomes"
sn_refs = ["SN-045"]
boundary_refs = ["B-08", "B-12"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The system shall end every backup, removal and check with a distinct documented outcome value for each of: complete, some part failed, configuration refused, and operation refused because the backup is busy or not in a state to proceed."""
rationale = """A host deciding whether to retry, alert or carry on cannot act if every failure looks the same, and a run that backed up nothing must not look like one that worked."""
acceptance_criteria = """Deliberately induced instances of each of the four classes, for a backup, a removal and a check, each produce their own documented value, including through the container's exit status."""
permutations = """operation=set{Backup,Prune,Verify}; class=set{complete,part-failed,configuration-refused,busy-or-not-ready}; host=set{direct,container}; @pairwise"""
priority = "M"
verification = "Test"
status = "Drafted"
da_refs = ["DA-09"]
form = "interface"

[requirement.SR-183]
title = "Each run's record says what was added, changed, removed and failed"
sn_refs = ["SN-044"]
boundary_refs = ["B-06", "B-20"]
requirement = """When a run ends, the system shall have recorded each file added, changed, removed or failed, the cause of every failure, and summary counts."""
rationale = """An unattended tool is trusted only as far as its record can be checked; without it a failure cannot be diagnosed and a success cannot be believed."""
acceptance_criteria = """After a run with known additions, changes, removals and one failure, the record names each file in its category, gives the failure's cause, and its counts match."""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The record is the outcome."""
form = "interface"

[requirement.SR-184]
title = "A long run shows progress"
sn_refs = ["SN-044"]
boundary_refs = ["B-06"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """While a run is in progress, the system shall show progress in its record or display at intervals no longer than the documented progress interval of a few minutes."""
rationale = """A long run that shows nothing cannot be told apart from a hung one."""
acceptance_criteria = """During a run lasting several times the documented interval, consecutive progress entries are never further apart than that interval."""
priority = "S"
verification = "Test"
status = "Drafted"
coincident = """The progress shown is the outcome."""
form = "interface"

[requirement.SR-185]
title = "Every refusal states what was found and what to do"
sn_refs = ["SN-044", "SN-027", "SN-015", "SN-040"]
boundary_refs = ["B-06", "B-08", "B-15"]
requirement = """When the system refuses an operation, it shall state what it found and what to do."""
rationale = """A refusal without a cause and a remedy sends the owner to the log or to the code; it is the package-wide legibility property each of the cited needs asks for in its own case."""
acceptance_criteria = """For each documented refusal, the message names the condition found and an action that resolves it."""
priority = "M"
verification = "Inspection"
status = "Drafted"
coincident = """The message is the outcome."""
form = "cross-cutting"

[requirement.SR-186]
title = "Where notification is set up, each run's outcome is sent"
sn_refs = ["SN-010"]
boundary_refs = ["B-09"]
requirement = """Where notification is set up, the system shall send a message stating success or failure after each run, unless the run was started with NoMail."""
rationale = """For scheduled runs the owner wants to know without checking logs."""
acceptance_criteria = """With notification set up, a message stating the run's outcome reaches the relay after each run; with it not set up, or the run started with NoMail, none is sent."""
permutations = """configured=bool; NoMail=bool; outcome=set{success,failure}; @full"""
priority = "C"
verification = "Test"
status = "Drafted"
da_refs = ["DA-09"]
delivered_with = ["SR-187"]
form = "assumption"

[requirement.SR-187]
title = "A failed notification never changes the run's outcome"
sn_refs = ["SN-010"]
boundary_refs = ["B-09", "B-08"]
requirement = """If sending the notification fails, then the system shall record a warning and report the same outcome the run would have had without notification."""
rationale = """A mail outage must not turn a good backup into a reported failure, nor a failed one into a success."""
acceptance_criteria = """With the relay unreachable or refusing, a successful run still reports complete and a failed run still reports failure, and each records a warning."""
permutations = """relay=set{unreachable,auth-refused,ok}; outcome=set{success,failure}; @full"""
priority = "C"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-186"]
coincident = """The outcome is unchanged; that is the delivered result."""
form = "interface"

[requirement.SR-188]
title = "Notification credentials are never readable in plain form"
sn_refs = ["SN-049"]
boundary_refs = ["B-21", "B-13", "B-06"]
hat_refs = ["SECURITY"]
requirement = """The system shall never write the notification account's credentials in readable form into the configuration, the backup or a run's record."""
rationale = """Configurations are copied, shared with hosts and kept beside backups; a readable mail password there gives anyone holding the folder the owner's mail account."""
acceptance_criteria = """After credentials are set up and a run sends a notification, no readable form of the credentials appears in the configuration, anywhere in the backup, or in the run's record."""
priority = "S"
verification = "Test"
status = "Drafted"
da_refs = ["DA-20"]
delivered_with = ["SR-189"]
form = "assumption"

[requirement.SR-189]
title = "A configuration carrying readable credentials is refused"
sn_refs = ["SN-049"]
boundary_refs = ["B-05", "B-07", "B-08"]
hat_refs = ["SECURITY"]
requirement = """If a configuration carries notification credentials in readable form, then the system shall refuse it before any backup data is touched."""
rationale = """Accepting such a configuration keeps the secret readable wherever the configuration travels; refusing is the only way to stop it being used."""
acceptance_criteria = """A configuration holding a readable password for notification is refused with the configuration-refused outcome and nothing is created or changed."""
priority = "S"
verification = "Test"
status = "Drafted"
delivered_with = ["SR-188"]
coincident = """The refusal is the outcome."""
form = "interface"

