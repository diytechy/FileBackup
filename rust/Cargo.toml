[package]
name = "filebackup"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Content-addressed file backup with independent script recovery"
publish = false

[features]
test-hooks = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
fs2 = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["compress"] }
sha2 = "0.11"
tempfile = "3"
unicode-normalization = "0.1"
caseless = "0.2.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false
