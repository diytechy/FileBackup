services:
  filebackup:
    build:
      context: .
    image: "${FILEBACKUP_IMAGE:-filebackup:local}"
    user: "${FILEBACKUP_UID:-65532}:${FILEBACKUP_GID:-65532}"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      FILEBACKUP_CONFIG_PATH: /config/FileBackup.json
      FILEBACKUP_LOG_PATH: /logs/Backup_Global.log
    volumes:
      - ./container/FileBackup.example.json:/config/FileBackup.json:ro
      - ${FILEBACKUP_SOURCE:?set FILEBACKUP_SOURCE}:/source:ro
      # ONE writable mount holds both backup/ (BackupPath) and changes/
      # (ChangePath): every move between them must be a rename, and a rename
      # across two bind mounts fails even on one filesystem, so a set with
      # separate mounts is refused with exit 2.
      - ${FILEBACKUP_STORE:?set FILEBACKUP_STORE}:/store
      - ${FILEBACKUP_LOGS:?set FILEBACKUP_LOGS}:/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
